    <script>
      (function () {

        // ---------- graphique à deux panneaux : prix (+ moyennes) en haut, MACD en bas ----------
        function mchart(s, rows, o) {
          var n = rows.length, PX = 100, PW = 760, T1 = o.top || 520, H1 = 420, T2 = T1 + 470, H2 = 280;

          var pad = (phi - plo) * .06; plo -= pad; phi += pad;
          var Y = function (v) { return T1 + H1 - (v - plo) / (phi - plo) * H1; };
          var ml = Math.max.apply(0, rows.map(function (r) { return Math.max(Math.abs(r[4]), Math.abs(r[5])); })) * 1.1;
          var Ym = function (v) { return T2 + H2 / 2 - v / ml * H2 / 2; };
          var g = svg(s, 0, 0, 1080, 1920);

          (o.xt || []).forEach(function (m) { var i = 0; while (i < n - 1 && rows[i][0] < m[0]) i++; el(g, "text", { x: X(i), y: T2 + H2 + 44, "font-size": 24, fill: SOFT, "font-weight": 600, "text-anchor": "middle" }, m[1]); });
          function path(k, i0, i1, Yf) { var d = ""; for (var i = (i0 || 0); i <= (i1 == null ? n - 1 : i1); i++) d += (d ? "L" : "M") + X(i).toFixed(1) + " " + (Yf || Y)(rows[i][k]).toFixed(1); return d; }
          function at(dd) { for (var i = 0; i < n; i++) if (rows[i][0] >= dd) return i; return n - 1; }
          return { g: g, X: X, Y: Y, Ym: Ym, path: path, at: at, rows: rows, n: n, T1: T1, T2: T2, H2: H2 };
        }

        // ===== 0. Intro (0 → 8,25) : vidéo « Les indicateurs de trading expliqués, partie 3 » =====

        (function () { var s = sc(8.25, 20.1), c = mchart(s, window.A, { top: 560, xt: [["2025-02-03", "févr."], ["2025-04-01", "avr."], ["2025-06-02", "juin"], ["2025-08-01", "août"]] });

          var e12 = el(c.g, "path", { d: c.path(2), fill: "none", stroke: F, "stroke-width": 6, "stroke-linejoin": "round", "stroke-linecap": "round" }); draw(e12, 10.95, 1.0);

          // « Quand elle monte… la hausse prend de la vitesse » / « Quand elle baisse… le marché ralentit »
          var iu0 = c.at("2025-04-21"), iu1 = c.at("2025-05-13"), id0 = c.at("2025-01-24"), id1 = c.at("2025-03-13");
          var upP = el(c.g, "path", { d: c.path(4, iu0, iu1, c.Ym), fill: "none", stroke: UP, "stroke-width": 9, "stroke-linecap": "round" }); draw(upP, 16.4, .6, "power2.out");

          var dd = pill(s, "Ça ralentit", DN, "#fff", c.X(id0) - 10, c.T2 - 10, 18.7, 32); tl.to(u, { opacity: 0, duration: .2 }, 18.45);
          div(s, "Moyennes mobiles exponentielles · Clôtures quotidiennes · Source : Yahoo Finance", "top:1310px", "src"); })();

        // ===== 2. Ligne de signal, histogramme, croisements (20,1 → 32,4) =====
        (function () { var s = sc(20.1, 32.4), c = mchart(s, window.A, { top: 560, xt: [["2025-02-03", "févr."], ["2025-04-01", "avr."], ["2025-06-02", "juin"], ["2025-08-01", "août"]] });
          var t = div(s, "Le MACD du S&P 500", "left:100px; top:400px; font-size:56px; font-weight:700; letter-spacing:-.045em; color:" + INK + "; opacity:0"); fade(t, 20.15);

          var l2 = div(s, "<span style='display:inline-block; width:34px; height:6px; border-radius:3px; background:" + SG + "; vertical-align:middle; margin-right:12px'></span>Signal · 9 jours", "left:330px; top:" + (c.T2 - 52) + "px; font-size:30px; font-weight:700; letter-spacing:-.03em; opacity:0"); fade(l2, 21.65);

          var bars = [], bw = 760 / c.n * .7;
          c.rows.forEach(function (r, i) { var v = r[4] - r[5], y0 = c.Ym(0), y1 = c.Ym(v);
            bars.push(el(c.g, "rect", { x: c.X(i) - bw / 2, y: Math.min(y0, y1), width: bw, height: Math.abs(y1 - y0), fill: v >= 0 ? UP : DN, "fill-opacity": .55, opacity: 0 })); });
          tl.fromTo(bars, { opacity: 0 }, { opacity: 1, duration: .1, stagger: 1.0 / bars.length, immediateRender: false }, 23.4);

          var X = c.rows.map(function (r, i) { return i; }).filter(function (i) { return i && (c.rows[i - 1][4] - c.rows[i - 1][5]) * (c.rows[i][4] - c.rows[i][5]) <= 0; });
          var rings = X.map(function (i) { return el(c.g, "circle", { cx: c.X(i), cy: c.Ym(c.rows[i][4]), r: 13, fill: "none", stroke: "#fff", "stroke-width": 3, opacity: 0 }); });
          tl.fromTo(rings, { opacity: 0 }, { opacity: .8, duration: .2, stagger: .05, immediateRender: false }, 26.6);

          var pb = el(c.g, "circle", { cx: c.X(ib), cy: c.Y(c.rows[ib][1]), r: 12, fill: UP, opacity: 0 }); fade(pb, 29.5, .2);
          pill(s, "Achat", UP, "#00194b", c.X(ib) - 50, c.Y(c.rows[ib][1]) + 26, 29.5);
          var rs = el(c.g, "circle", { cx: c.X(is), cy: c.Ym(c.rows[is][4]), r: 22, fill: "none", stroke: DN, "stroke-width": 6, opacity: 0 }); fade(rs, 30.7, .2);
          var ps = el(c.g, "circle", { cx: c.X(is), cy: c.Y(c.rows[is][1]), r: 12, fill: DN, opacity: 0 }); fade(ps, 31.8, .2);
          pill(s, "Vente", DN, "#fff", c.X(is) - 50, c.Y(c.rows[is][1]) - 76, 31.8);
          div(s, "MACD 12/26/9 · Clôtures quotidiennes · Source : Yahoo Finance", "top:1310px", "src"); })();

        // ===== 3. L'actu : le S&P 500 depuis l'été (32,4 → 40,4) =====
        (function () { var s = sc(32.4, 40.35), c = mchart(s, window.B, { top: 560, xt: [["2026-07-01", "juil."], ["2026-09-01", "sept."], ["2026-11-02", "nov."]] });
          var t = div(s, "Le S&P 500 depuis juin", "left:100px; top:400px; font-size:56px; font-weight:700; letter-spacing:-.045em; color:" + INK + "; opacity:0"); fade(t, 32.45);

          var m1 = el(c.g, "path", { d: c.path(4, 0, ic, c.Ym), fill: "none", stroke: "#fff", "stroke-width": 4.5, "stroke-linejoin": "round" }); draw(m1, 32.6, 2.6);
          var s1 = el(c.g, "path", { d: c.path(5, 0, ic, c.Ym), fill: "none", stroke: SG, "stroke-width": 4.5, "stroke-linejoin": "round" }); draw(s1, 32.6, 2.6);
          // « une semaine après son record »

          pill(s, "Record", "#fff", "#00194b", c.X(ir) - 160, c.Y(c.rows[ir][1]) - 30, 35.85, 30);
          // « son MACD a croisé à la baisse »
          var rc = el(c.g, "circle", { cx: c.X(ic), cy: c.Ym(c.rows[ic][4]), r: 24, fill: "none", stroke: DN, "stroke-width": 6, opacity: 0 }); fade(rc, 37.05, .2);
          pill(s, "Vente · 15 oct.", DN, "#fff", c.X(ic) - 120, c.Ym(c.rows[ic][4]) + 40, 37.2, 30);

          var m2 = el(c.g, "path", { d: c.path(4, ic, c.n - 1, c.Ym), fill: "none", stroke: "#fff", "stroke-width": 4.5, "stroke-linejoin": "round" }); draw(m2, 38.15, 1.2);
          var s2 = el(c.g, "path", { d: c.path(5, ic, c.n - 1, c.Ym), fill: "none", stroke: SG, "stroke-width": 4.5, "stroke-linejoin": "round" }); draw(s2, 38.15, 1.2);
          var big = div(s, "−5 %", "right:100px; top:390px; font-size:72px; font-weight:700; letter-spacing:-.05em; color:" + DN + "; opacity:0"); rise(big, 39.6, .3);
          div(s, "Clôtures quotidiennes · Source : Yahoo Finance", "top:1310px", "src"); })();

        // ===== 4. « Mais attention, il se trompe souvent » (40,35 → 51,5) =====
        (function () { var s = sc(40.35, 41.8); div(s, "<img src='assets/img/trader-panique.jpg' style='width:1080px; height:1920px; object-fit:cover; display:block'>", "inset:0"); div(s, "", "inset:0; background:linear-gradient(180deg, rgba(0,12,40,.2), rgba(0,12,40,.55))"); })();
        (function () { var s = sc(41.8, 51.5);
          var t = div(s, "Signaux d'achat du MACD", "left:0; right:0; top:400px; text-align:center; font-size:56px; font-weight:700; letter-spacing:-.045em; color:" + INK + "; opacity:0"); fade(t, 41.85);
          var u = div(s, "S&P 500 · depuis 1990", "left:0; right:0; top:476px; text-align:center; font-size:36px; font-weight:700; letter-spacing:-.03em; color:" + SOFT + "; opacity:0"); fade(u, 42.4);
          var cnt = div(s, "0", "left:0; right:0; top:560px; text-align:center; font-size:120px; font-weight:700; letter-spacing:-.06em; line-height:1; color:#fff; opacity:0"); fade(cnt, 44.7, .2);
          var o = { v: 0 }; tl.fromTo(o, { v: 0 }, { v: 384, duration: 1.3, ease: "power2.out", immediateRender: false, onUpdate: function () { cnt.textContent = Math.round(o.v); } }, 44.75);
          var g = svg(s, 0, 0, 1080, 1920), sq = [], COLS = 24, WIN = Math.round(384 * .42);
          for (var i = 0; i < 384; i++) { var x = 120 + (i % COLS) * 35, y = 720 + Math.floor(i / COLS) * 35; sq.push(el(g, "rect", { x: x, y: y, width: 27, height: 27, rx: 3, fill: "#fff", "fill-opacity": .25, opacity: 0 })); }
          tl.fromTo(sq, { opacity: 0 }, { opacity: 1, duration: .08, stagger: 1.2 / 384, immediateRender: false }, 44.8);
          // « seulement 42 % ont été gagnants »

          var pg = div(s, "42 % gagnants", "left:120px; top:1310px; font-size:48px; font-weight:700; letter-spacing:-.04em; color:" + UP + "; opacity:0"); rise(pg, 48.4, .3);
          var pr = div(s, "58 % perdants", "right:120px; top:1310px; font-size:48px; font-weight:700; letter-spacing:-.04em; color:" + DN + "; opacity:0"); rise(pr, 49.4, .3); })();

        // ===== 5. À retenir (51,5 → 58,6) =====
        (function () { var s = sc(51.5, 58.6);
          var p1 = div(s, "La force du mouvement", "left:0; right:0; top:620px; text-align:center; font-size:76px; font-weight:700; letter-spacing:-.055em; color:#fff; opacity:0"); rise(p1, 53.4); out(p1, 54.3);
