<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/vo-words.js"></script>
    <script src="assets/data.js"></script>
    <style>
      /* Reel « Le dessous des marchés, épisode 5 » : le Bitcoin passe sous sa moyenne 200 semaines. Hook (0 → 7,7 s). DA data intelligence. */
      @font-face { font-family: "Display"; src: url("assets/fonts/inter-display-latin-var.woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #00194b; }
      #root { width: 1080px; height: 1920px; position: relative; overflow: hidden; font-family: "Display", sans-serif; color: #eaf1fb; background: #00194b; font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; }
      #bg { position: absolute; inset: 0; }
      #bg .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 38% at 50% 46%, #0b3480 0%, rgba(0, 25, 75, 0) 72%); }
      #bg .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 48px 48px; background-position: 12px 0;
        -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); }
      #bg .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 65% at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,5,22,.6) 100%); }
      .a { position: absolute; }
      svg { position: absolute; overflow: visible; }
      svg text { font-family: "Display"; font-feature-settings: "tnum" 1; }
      .cap-line { position: absolute; left: 80px; right: 80px; top: 1400px; text-align: center; opacity: 0; }
      .cap-box { display: inline-block; padding: 8px 22px 13px; border-radius: 4px; background: rgba(30,34,42,.74); font-weight: 700; font-size: 54px; line-height: 1.12; letter-spacing: -.05em; color: #fff; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.7" data-width="1080" data-height="1920">
      <audio id="vo" src="assets/voix.mp3" data-start="0" data-duration="7.7" data-track-index="1"></audio>
      <div id="bgs" class="clip" data-start="0" data-duration="7.7" data-track-index="2" style="position:absolute; inset:0">
        <div id="bg"><div class="glow"></div><div class="grid"></div><div class="vig"></div></div>
      </div>
      <div id="stage" class="clip" data-start="0" data-duration="7.7" data-track-index="3" style="position:absolute; inset:0"></div>
    </div>
    <script>
      (function () {
        var NS = "http://www.w3.org/2000/svg", tl = gsap.timeline({ paused: true }), END = 7.7;
        var st = document.getElementById("stage"), B = window.BTC, N = B.length;
        var INK = "#eaf1fb", SOFT = "#8fa3c7", NAVY = "#00194b", UP = "#00e676", DN = "#ff1744", MA = "#ffd166", ORANGE = "#d06f00";
        function div(p, html, style) { var d = document.createElement("div"); d.className = "a"; d.innerHTML = html; d.setAttribute("style", style || ""); p.appendChild(d); return d; }
        function el(s, tag, a, text) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; s.appendChild(e); return e; }
        function fmt(v) { return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
        function idx(d) { for (var i = 0; i < N; i++) if (B[i][0] >= d) return i; return N - 1; }
        var L = Math.log10, LAST = N - 1, REC = idx("2025-10-06"), REC_V = B[REC][1], CROSS = idx("2026-11-14");

        // ===== zone du graphique (pleine largeur) =====
        var PX = 60, PY = 600, PW = 820, PH = 640;
        var g = document.createElementNS(NS, "svg"); g.setAttribute("width", 1080); g.setAttribute("height", 1920); g.style.left = "0px"; g.style.top = "0px"; st.appendChild(g);
        var defs = el(g, "defs", {});
        var cp = el(defs, "clipPath", { id: "plot" }); el(cp, "rect", { x: PX - 10, y: PY - 60, width: PW + 20, height: PH + 60 });
        var gr = el(defs, "linearGradient", { id: "fall", x1: 0, y1: 0, x2: 0, y2: 1 });
        el(gr, "stop", { offset: 0, "stop-color": DN, "stop-opacity": .32 }); el(gr, "stop", { offset: 1, "stop-color": DN, "stop-opacity": 0 });
        var axis = el(g, "g", {}), plot = el(g, "g", { "clip-path": "url(#plot)" });
        var base = el(g, "line", { x1: PX, x2: PX + PW, y1: PY + PH, y2: PY + PH, stroke: SOFT, "stroke-opacity": .5, "stroke-width": 2 });
        var area = el(plot, "path", { fill: "url(#fall)" });
        var maHalo = el(plot, "path", { fill: "none", stroke: MA, "stroke-opacity": .22, "stroke-width": 22, "stroke-linejoin": "round", "stroke-linecap": "round" });
        var maLine = el(plot, "path", { fill: "none", stroke: MA, "stroke-width": 8, "stroke-linejoin": "round", "stroke-linecap": "round" });
        var pOld = el(plot, "path", { fill: "none", stroke: INK, "stroke-width": 4, "stroke-linejoin": "round" });
        var pNew = el(plot, "path", { fill: "none", stroke: DN, "stroke-width": 5, "stroke-linejoin": "round" });
        var pulse = el(g, "circle", { r: 12, fill: "none", stroke: DN, "stroke-width": 5, opacity: 0 });
        var head = el(g, "circle", { r: 11, fill: "#fff", stroke: DN, "stroke-width": 5 });
        var MK = [["2018-12-15", "2018"], ["2020-03-12", "2020"], ["2022-06-18", "2022"], [B[LAST][0], "2026"]].map(function (m, k) {
          var i = idx(m[0]), c = el(g, "circle", { r: k < 3 ? 30 : 36, fill: k < 3 ? "none" : "rgba(255,23,68,.18)", stroke: k < 3 ? "#fff" : DN, "stroke-width": 6, opacity: 0 });
          return { i: i, c: c };
        });

        // caméra et révélation : tout est recalculé à chaque image (déterministe)
        var S = { a: idx("2025-09-20"), b: LAST + 9, lo: L(56000), hi: L(134000), p: REC, m: idx("2025-09-20"), dim: 1 };
        function X(i) { return PX + (i - S.a) / (S.b - S.a) * PW; }
        function Y(v) { return PY + PH - (L(v) - S.lo) / (S.hi - S.lo) * PH; }
        function val(i, k) { var f = Math.floor(i), c = Math.min(f + 1, LAST), t = i - f; return B[f][k] + (B[c][k] - B[f][k]) * t; }
        function path(k, i0, i1) { var d = "", s = Math.max(0, Math.floor(Math.max(i0, S.a - 2))), e = Math.min(i1, S.b + 2), step = Math.max(1, Math.floor((S.b - S.a) / 900));
          if (e <= s) return ""; for (var i = s; i < e; i += step) d += (d ? "L" : "M") + X(i).toFixed(1) + " " + Y(B[i][k]).toFixed(1);
          d += (d ? "L" : "M") + X(e).toFixed(1) + " " + Y(val(e, k)).toFixed(1); return d; }
        var YT = [2000, 3000, 5000, 10000, 20000, 30000, 50000, 60000, 70000, 80000, 90000, 100000, 120000], MO = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
        var ticker, pct;
        function render() {
          // axes
          axis.textContent = ""; var lastY = 1e9;
          YT.forEach(function (v) { var y = Y(v); if (y < PY - 10 || y > PY + PH - 20 || lastY - y < 70) return; lastY = y;
            el(axis, "line", { x1: PX, x2: PX + PW, y1: y, y2: y, stroke: "#fff", "stroke-opacity": .08, "stroke-width": 1.5 });
            el(axis, "text", { x: 1030, y: y + 9, "font-size": 26, fill: SOFT, "font-weight": 600, "text-anchor": "end" }, v >= 1000 ? fmt(v / 1000) + " k$" : v); });
          var span = S.b - S.a, lastX = -1e9;
          for (var i = Math.max(1, Math.ceil(S.a)); i <= Math.min(LAST, S.b); i++) {
            var d0 = B[i - 1][0], d1 = B[i][0], lab = null;
            if (span > 500) { if (d1.slice(0, 4) !== d0.slice(0, 4)) lab = d1.slice(0, 4); }
            else if (d1.slice(5, 7) !== d0.slice(5, 7)) { var mo = +d1.slice(5, 7); if (span < 200 || mo % 2 === 1) lab = mo === 1 ? d1.slice(0, 4) : MO[mo - 1]; }
            if (lab && X(i) - lastX > 90 && X(i) > PX + 20 && X(i) < PX + PW - 20) { lastX = X(i); el(axis, "text", { x: X(i), y: PY + PH + 48, "font-size": 26, fill: SOFT, "font-weight": 600, "text-anchor": "middle" }, lab); }
          }
          // courbes
          pOld.setAttribute("d", path(1, 0, Math.min(S.p, REC)));
          var dn = S.p > REC ? path(1, REC, S.p) : ""; pNew.setAttribute("d", dn);
          area.setAttribute("d", dn ? dn + "L" + X(S.p).toFixed(1) + " " + (PY + PH) + "L" + X(REC).toFixed(1) + " " + (PY + PH) + "Z" : "");
          var md = path(2, 0, S.m); maLine.setAttribute("d", md); maHalo.setAttribute("d", md);
          [pOld, pNew].forEach(function (n) { n.style.opacity = S.dim; });
          var hx = X(S.p), hy = Y(val(S.p, 1)); head.setAttribute("cx", hx); head.setAttribute("cy", hy);
          pulse.setAttribute("cx", X(CROSS)); pulse.setAttribute("cy", Y(B[CROSS][1]));
          MK.forEach(function (m) { m.c.setAttribute("cx", X(m.i)); m.c.setAttribute("cy", Y(B[m.i][1])); });
          if (ticker) { var v = val(S.p, 1); ticker.textContent = fmt(v) + " $"; var q = Math.round((v / REC_V - 1) * 100); pct.textContent = q < 0 ? "−" + Math.abs(q) + " %" : "0 %"; }
        }

        // ===== en-tête : Bitcoin + cours en direct =====
        var hd = div(st, "", "left:60px; top:300px; width:960px; height:260px");
        div(hd, "<svg width='64' height='64' viewBox='0 0 64 64' style='position:static; vertical-align:middle'><circle cx='32' cy='32' r='32' fill='" + ORANGE + "'/><text x='33' y='45' font-size='40' font-weight='800' fill='#fff' text-anchor='middle' font-family='Display'>B</text><rect x='26' y='10' width='4' height='8' fill='#fff'/><rect x='33' y='10' width='4' height='8' fill='#fff'/><rect x='26' y='46' width='4' height='8' fill='#fff'/><rect x='33' y='46' width='4' height='8' fill='#fff'/></svg><span style='vertical-align:middle; margin-left:20px; font-size:52px; font-weight:700; letter-spacing:-.05em'>Bitcoin</span>", "left:0; top:0");
        ticker = div(hd, "", "left:0; top:84px; font-size:150px; font-weight:700; letter-spacing:-.06em; line-height:1; color:#fff; white-space:nowrap");
        pct = div(hd, "", "right:0; top:112px; padding:6px 22px 12px; border-radius:6px; background:" + DN + "; color:#fff; font-size:64px; font-weight:700; letter-spacing:-.045em; white-space:nowrap");
        var src = div(st, "Clôtures quotidiennes · Échelle logarithmique · Source : Yahoo Finance", "left:60px; top:1320px; font-size:24px; font-weight:600; color:" + SOFT);
        
        // 1. « Le Bitcoin chute » (0 → 2,6) : le krach se dessine en direct depuis le record
        tl.fromTo(S, { p: REC + 4 }, { p: LAST, duration: 2.55, ease: "power1.in" }, 0);
        tl.fromTo(g, { scale: 1.04, transformOrigin: "50% 50%" }, { scale: 1, duration: 3.4, ease: "power1.out" }, 0);
        // 2. « regarder cette ligne » (2,85 → 3,6) : la ligne jaune, sans la nommer
        tl.fromTo(S, { m: idx("2025-09-20") }, { m: LAST, duration: .75, ease: "power2.out" }, 2.85);
        tl.fromTo(S, { dim: 1 }, { dim: .4, duration: .3 }, 2.9);
        // 3. « Il vient juste de passer dessous » (3,6 → 5,0) : on plonge sur la cassure
        tl.to(S, { a: idx("2026-08-25"), b: LAST + 5, lo: L(60500), hi: L(84000), dim: 1, duration: .8, ease: "power2.inOut" }, 3.6);
        tl.fromTo(pulse, { attr: { r: 12 }, opacity: 1 }, { attr: { r: 64 }, opacity: 0, duration: .7, ease: "power2.out", immediateRender: false }, 4.45);
        tl.fromTo(pulse, { attr: { r: 12 }, opacity: 1 }, { attr: { r: 64 }, opacity: 0, duration: .7, ease: "power2.out", immediateRender: false }, 4.95);
        // 4. « seulement la quatrième fois en huit ans » (5,0 → 7,7) : on recule sur 8 ans
        tl.to(S, { a: 0, b: LAST + 30, lo: L(2300), hi: L(175000), duration: .6, ease: "power3.inOut" }, 5.0);
        tl.to(head, { opacity: 0, duration: .2 }, 5.4);
        tl.to(area, { opacity: 0, duration: .3 }, 5.0);
        tl.to(hd, { opacity: 0, duration: .15 }, 5.75);
        var big = div(st, "<span style='color:" + DN + "'>4<sup style='font-size:.5em; vertical-align:.8em; letter-spacing:0'>e</sup> fois</span><span id='huit' style='color:#fff'> en 8 ans</span>", "left:60px; top:330px; font-size:150px; font-weight:700; letter-spacing:-.06em; line-height:1; white-space:nowrap; opacity:0");
        tl.fromTo(big, { opacity: 0, scale: 1.2, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: .3, ease: "power3.out" }, 6.0);
        var huit = document.getElementById("huit");
        tl.fromTo(huit, { opacity: 0 }, { opacity: 1, duration: .2 }, 7.03);
        [5.42, 5.6, 5.78].forEach(function (t, k) { tl.fromTo(MK[k].c, { opacity: 0, scale: .4, transformOrigin: "50% 50%", transformBox: "fill-box" }, { opacity: 1, scale: 1, duration: .28, ease: "back.out(2)" }, t); });
        tl.fromTo(MK[3].c, { opacity: 0, scale: .3, transformOrigin: "50% 50%", transformBox: "fill-box" }, { opacity: 1, scale: 1, duration: .35, ease: "back.out(2.5)" }, 6.0);
        tl.fromTo(pulse, { attr: { r: 20 }, opacity: 1 }, { attr: { r: 80 }, opacity: 0, duration: .8, ease: "power2.out", immediateRender: false }, 6.1);
        // accolade « 8 ans » sous l'axe
        var br = el(g, "path", { d: "M" + PX + " 1300 V1314 H" + (PX + PW - 30) + " V1300", fill: "none", stroke: "#fff", "stroke-width": 4 });
        var bl = br.getTotalLength(); br.style.strokeDasharray = bl + " " + bl;
        tl.fromTo(br, { strokeDashoffset: bl }, { strokeDashoffset: 0, duration: .5, ease: "power2.out" }, 7.0);
        tl.to(src, { opacity: 0, duration: .15 }, 6.9);

        tl.eventCallback("onUpdate", render);

        // ===== sous-titres : 3 mots max ; pas quand « 4e fois en 8 ans » est à l'écran =====
        var W = window.VO.words, groups = [], cur = [];
        W.forEach(function (t, k) { cur.push(t); if (/[,.?:!…]$/.test(t.w) || cur.length >= 3 || !W[k + 1]) { groups.push(cur); cur = []; } });
        groups.forEach(function (gp, k) {
          var t0 = gp[0].s, t1 = k + 1 < groups.length ? groups[k + 1][0].s : END;
          if (t0 >= 5.8 || t0 >= END) return;
          var d = div(st, "<span class='cap-box'>" + gp.map(function (t) { return t.w; }).join(" ") + "</span>", "");
          d.className = "cap-line";
          tl.fromTo(d, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .1, ease: "power2.out" }, Math.max(0, t0 - .06));
          tl.set(d, { opacity: 0 }, Math.min(t1, gp[gp.length - 1].e + .6, 5.95) - .035);
        });

        tl.set({}, {}, END);
        window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; tl.seek(0); render();
      })();
    </script>
  </body>
</html>
