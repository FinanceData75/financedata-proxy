<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;background:transparent;font-family:"Inter",sans-serif}
  .wrap{position:absolute;left:0;right:0;top:1000px;display:flex;flex-direction:column;align-items:center}
  .sirens{font-family:"Noto Color Emoji";font-size:64px;line-height:1;background:#fff;border-radius:22px 22px 0 0;padding:14px 26px 4px;letter-spacing:6px}
  .badge{background:#fff;color:#E5202B;font-weight:800;font-size:74px;letter-spacing:-1.5px;padding:8px 36px 12px;border-radius:22px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
  .msg{margin-top:56px;width:960px;text-align:center;color:#fff;font-weight:700;font-size:66px;line-height:1.16;letter-spacing:-1px}
  .msg span{background:rgba(0,0,0,.45);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:2px 14px;border-radius:10px}
  .msg b{color:#fff;font-weight:800}
  .cta{margin-top:70px;background:#000;color:#fff;font-weight:700;font-size:50px;padding:12px 28px 16px;border-radius:14px}
  .cta i{font-style:normal;font-family:"Noto Color Emoji";font-size:44px;margin-left:10px}
</style></head><body>
<div class="wrap">
  <div class="sirens">🚨🚨🚨</div>
  <div class="badge">ALERTE UBER</div>
  <div class="msg"><span>Le PDG d’Uber vient d’acheter pour <b>10 millions $</b> d’actions Uber avec son propre argent</span></div>
  <div class="cta">Plus d’infos en description<i>⬇️</i></div>
</div>
</body></html>
