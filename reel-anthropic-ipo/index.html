    <style>
      /* Reel Anthropic v4 : minimaliste. Une idée par écran (≈ 2,4 s), photos plein cadre,
         police d'écran façon SF Pro (Inter Display), sans filet ni encadré. Sous-titres en Inter 600. */

      @font-face { font-family: "Display"; src: url("assets/fonts/inter-display-latin-var.woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Display", sans-serif; }
      .sc { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
      .white { background: #f5f5f7; }
      .navy { background: radial-gradient(ellipse 90% 70% at 50% 42%, #18206e 0%, #0d1250 70%, #0a0e3b 100%); }
      .black { background: #000; }
      .t { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; font-family: "Display", sans-serif; font-variation-settings: "opsz" 32; }
      .hd { font-weight: 700; letter-spacing: -.035em; line-height: 1.02; }
      .lb { font-weight: 500; letter-spacing: -.015em; }
      .nm { font-weight: 700; letter-spacing: -.045em; line-height: .95; font-feature-settings: "tnum" 1; }
      .box { position: absolute; }
      svg { position: absolute; overflow: visible; }
      svg text { font-family: "Display", sans-serif; font-variation-settings: "opsz" 32; }
      #caps { position: absolute; left: 0; right: 0; top: 1330px; z-index: 20; }
      .cl { position: absolute; left: 0; right: 0; text-align: center; opacity: 0; }
      .cl span { display: inline-block; padding: 8px 22px 13px; border-radius: 4px; background: rgba(30,34,42,.74); font-family: "Inter FD", sans-serif; font-weight: 600; font-size: 54px; letter-spacing: -.045em; word-spacing: .06em; color: #fff; white-space: nowrap; }
      /* sur fond clair, le fond gris translucide disparaissait : version plus dense */
      .cl.solid span { background: rgba(22,24,30,.92); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="49.62" data-width="1080" data-height="1920">
      <audio id="vo" src="assets/voix.mp3" data-start="0" data-duration="49.62" data-track-index="1"></audio>
      <div id="stage" class="clip" data-start="0" data-duration="49.62" data-track-index="0" style="position:absolute; inset:0"></div>
    </div>

    <script>
      (function () {
        var NS = "http://www.w3.org/2000/svg", tl = gsap.timeline({ paused: true }), stage = document.getElementById("stage");
        var W = window.VO.words, toCenter = [];

        function at(word, after) { after = after || 0; for (var i = 0; i < W.length; i++) if (W[i].s >= after && W[i].w.replace(/[.,?]$/, "") === word) return W[i].s; throw new Error("mot introuvable : " + word + " après " + after); }
        function div(parent, cls, html, style) { var d = document.createElement("div"); d.className = cls; if (html != null) d.innerHTML = html; if (style) d.setAttribute("style", style); parent.appendChild(d); return d; }

        function photoScene(a, b, src, pos, dark) {

        }
        function scene(a, b, bg) {
          var sc = div(stage, "sc " + (bg || ""));

        }
        // flèche dessinée (trait + pointe)
        function arrow(svg, x1, y1, x2, y2, color, t, sw) {
          var p = path(svg, "M" + x1 + " " + y1 + " L" + x2 + " " + y2, color, sw || 8);
          var a = Math.atan2(y2 - y1, x2 - x1), s = 30;
          var hd = el(svg, "path", { d: "M" + (x2 - s * Math.cos(a - 0.5)) + " " + (y2 - s * Math.sin(a - 0.5)) + " L" + x2 + " " + y2 + " L" + (x2 - s * Math.cos(a + 0.5)) + " " + (y2 - s * Math.sin(a + 0.5)), fill: "none", stroke: color, "stroke-width": sw || 8, "stroke-linejoin": "round", "stroke-linecap": "round", opacity: 0 });
          draw(p, t, 0.45); tl.to(hd, { opacity: 1, duration: 0.1 }, t + 0.4);

            path(svg, "M" + (cx - 250) + " " + (top + 440) + " L" + (cx + 250) + " " + (top + 440), color, 14)
          ];
          [-150, -50, 50, 150].forEach(function (dx) { parts.push(path(svg, "M" + (cx + dx) + " " + (top + 190) + " L" + (cx + dx) + " " + (top + 400), color, 26)); });
          parts.forEach(function (p, i) { draw(p, t + i * 0.06, 0.4); });

        // =================== MONTAGE ===================
        // v4 : 21 écrans (≈ 2,4 s chacun), un seul message par écran, 2 lignes max, aucun filet ni encadré.
        var s, g, WHITE = [];

        }

        function H(p, text, t, top, size, color, now) { return T(p, "hd", text, t, top, size || 104, color || "#fff", now); }

        function onPhoto(d) { d.setAttribute("style", d.getAttribute("style") + SH); return d; }

        // 1. 0–1,0 « C'est officiel » : la cloche du Nasdaq, confettis

        // 5. 6,12–8,1 la 7e entreprise du monde
        s = sc(6.12, 8.1, "white");
        N(s, "7<span style='font-size:.5em; vertical-align:.8em; letter-spacing:0'>e</span>", at("septième") - 0.15, 520, 400);

        counter(n13, at("perte"), 0, 80, 0.8, 0, "−", " Md$");

        // 14. 32,22–34,66 le prix : 2 000 Md$
        s = photo(32.22, 34.66, "nasdaq-marketsite.jpg", .6);

        onPhoto(H(s, "Le prix", 32.25, 300, 112));
        onPhoto(N(s, "2 000 Md$", at("Deux", 33) - 0.1, 820, 170, "#fff"));

        var cv1 = txt(g, 320, BASE - 965 * K2 - 30, "965 Md$", 64, SOFT, 600), cl1 = txt(g, 320, BASE + 70, "En mai", 48, SOFT, 500);
        var cv2 = txt(g, 760, BASE - 2000 * K2 - 36, "2 000 Md$", 80, NAVY, 700), cl2 = txt(g, 760, BASE + 70, "En Bourse", 48, NAVY, 600);

        tl.fromTo([cv1, cl1], { opacity: 0 }, { opacity: 1, duration: 0.15 }, 34.8);
