<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/config.js"></script>
    <style>
      /* Reel « 100 000 abonnés » : captures plein écran, fixes, tout est flouté sauf le nombre d'abonnés (effet surlignage de coupure de presse). */
      @font-face { font-family: "Display"; src: url("assets/fonts/inter-display-latin-var.woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { width: 1080px; height: 1920px; position: relative; overflow: hidden; background: #000; }
      .shot { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
      .bg, .fg { position: absolute; left: 0; top: 0; width: 1080px; display: block; }
      .bg { filter: blur(10px) brightness(.5); transform: scale(1.03); transform-origin: 50% 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="10" data-track-index="1" style="position:absolute; inset:0"></div>
      <video id="v-base" class="clip fg" src="assets/video/flip.mp4" data-start="6.2" data-duration="1.8" data-track-index="5" muted playsinline style="height:2351px"></video>
      <video id="v-bg" class="clip bg" src="assets/video/flip.mp4" data-start="6.2" data-duration="1.8" data-track-index="2" muted playsinline style="height:2351px"></video>
      <video id="v-fg" class="clip fg" src="assets/video/flip.mp4" data-start="6.2" data-duration="1.8" data-track-index="3" muted playsinline style="height:2351px"></video>
      <div id="top" class="clip" data-start="0" data-duration="10" data-track-index="4" style="position:absolute; inset:0"></div>
    </div>
    <script>
      (function () {
        var C = window.CFG, tl = gsap.timeline({ paused: true }), END = 10;
        var st = document.getElementById("stage");
        // zone nette (en px écran) autour du nombre d'abonnés
        function clip(fx, fy, H, w, h, dy) { var cx = fx * 1080, cy = fy * H + (dy || 0);
          return "inset(" + (cy - h / 2) + "px " + (1080 - cx - w / 2) + "px " + (H - cy - h / 2) + "px " + (cx - w / 2) + "px round 18px)"; }
        function shot(src, H, fx, fy, t, d, w, h, dy, first) {
          var sh = document.createElement("div"); sh.className = "shot"; st.appendChild(sh);
          sh.innerHTML = "<img class='fg' src='" + src + "' style='height:" + H + "px'><img class='bg' src='" + src + "' style='opacity:" + (first ? 0 : 1) + "; height:" + H + "px'><img class='fg' src='" + src + "' style='height:" + H + "px; clip-path:" + clip(fx, fy, H, w, h, dy) + "'>";
          tl.set(sh, { opacity: 1 }, t); if (d) tl.set(sh, { opacity: 0 }, t + d);
          // le flou n'arrive qu'une fois, au début, de façon linéaire, puis reste
          if (first) tl.fromTo(sh.children[1], { opacity: 0 }, { opacity: 1, duration: .8, ease: "none", immediateRender: false }, t + .15);
        }
        var pick = [1111, 2500, 4002, 5000, 8001, 10000, 15000, 20000, 30000, 40000, 74300, 85400], t = 0;
        pick.forEach(function (c, k) {
          var s = C.shots.filter(function (x) { return x.c === c; })[0], big = s.f === "img_2997" || s.f === "img_2983";
          var d = k ? 5.2 / 11 : 1.0; shot("assets/img/" + s.f + ".jpg", big ? 1080 * 2622 / 1206 : 1080 * 2436 / 1125, s.fx, s.fy, t, d, big ? 215 : 290, big ? 140 : 170, big ? 10 : 16, k === 0); t += d;
        });
        // l'enregistrement d'écran : 99,9 K → 100 K à 7,0 s
        document.getElementById("v-fg").style.clipPath = clip(.64, .205, 2351, 220, 145, 16);
                // écran de fin minimaliste : logo + une ligne
        var e = document.createElement("div"); e.setAttribute("style", "position:absolute; inset:0; opacity:0; background:#000a1f; font-family:Display, sans-serif; color:#fff; text-align:center");
        e.innerHTML = "<img id='lg' src='assets/img/logo-financedata.png' style='position:absolute; left:450px; top:740px; width:180px; height:180px; border-radius:50%; display:block'>"
          + "<div id='m1' style='position:absolute; left:0; right:0; top:980px; font-size:46px; font-weight:500; letter-spacing:-.02em'>Merci pour les 100 000 abonnés</div>";
        document.getElementById("top").appendChild(e);
        var E = 8.0;
        tl.to(e, { opacity: 1, duration: .4, ease: "power1.inOut" }, E);
        tl.fromTo("#lg", { opacity: 0 }, { opacity: 1, duration: .6, ease: "power1.out", immediateRender: false }, E + .2);
        tl.fromTo("#m1", { opacity: 0 }, { opacity: 1, duration: .6, ease: "power1.out", immediateRender: false }, E + .55);
        tl.set({}, {}, END);
        window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; tl.seek(0);
      })();
    </script>
  </body>
</html>
