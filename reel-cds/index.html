<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/vo-words.js"></script>
    <script src="assets/reel-data.js"></script>
    <style>
      @font-face { font-family: "Inter UI"; src: url("assets/fonts/Inter-Regular.otf") format("opentype"); font-weight: 400; }
      @font-face { font-family: "Inter UI"; src: url("assets/fonts/Inter-Medium.otf") format("opentype"); font-weight: 500; }
      @font-face { font-family: "Inter UI"; src: url("assets/fonts/Inter-SemiBold.otf") format("opentype"); font-weight: 600; }

      /* DA FinanceData : bleu #00194B quadrillé alterné avec un blanc cassé quadrillé, angles droits, rouge pour les alertes */
      :root { --bg: #00194b; --ink: #eaf1fb; --soft: #8fa3c7; --hair: rgba(255, 255, 255, 0.14); --cyan: #7dd0f5; --red: #ff2e24; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { width: 100%; height: 100%; position: relative; font-family: "Inter UI", sans-serif; color: var(--ink); background: var(--bg); font-feature-settings: "tnum" 1; }
      #stage { position: absolute; inset: 0; overflow: hidden; }

      #bg-dark { position: absolute; inset: 0; }
      #bg-dark .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 38% at 50% 46%, #0b3480 0%, rgba(0, 25, 75, 0) 72%); }
      #bg-dark .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px); background-size: 48px 48px; background-position: 12px 0;
        -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); }
      #bg-dark .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 65% at 50% 46%, rgba(0, 0, 0, 0) 55%, rgba(0, 5, 22, 0.6) 100%); }
      #bg-light { position: absolute; inset: 0; opacity: 1; background: #f6f8fc; }
      #bg-light::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 25, 75, 0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 25, 75, 0.06) 1px, transparent 1px); background-size: 48px 48px; background-position: 12px 0;
        -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); }
      #bg-light::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 65% at 50% 46%, rgba(255, 255, 255, 0) 55%, rgba(0, 25, 75, 0.08) 100%); }

      /* scènes : bloc centré dans la safe zone (x 140–940, y 440–1290) */
      .scene { position: absolute; left: 140px; top: 440px; width: 800px; height: 850px; opacity: 0; text-align: center; color: var(--ink); }
      .scene.light { --ink: #00194b; --soft: #5b6b8a; --hair: rgba(0, 25, 75, 0.14); --cyan: #0b6fd0; }
      .title { font-size: 60px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.04; white-space: nowrap; }
      .sub { margin-top: 12px; font-size: 26px; color: var(--soft); }
      .big { font-weight: 600; letter-spacing: -0.05em; line-height: 1; white-space: nowrap; }
      .scene svg.chart { position: absolute; left: 0; top: 150px; width: 800px; height: 640px; overflow: visible; }
      svg text { font-family: "Inter UI", sans-serif; font-feature-settings: "tnum" 1; }
      svg .val { font-weight: 600; fill: var(--ink); letter-spacing: -0.02em; }
      svg .lbl { fill: var(--soft); }
      svg .cap { font-weight: 500; fill: var(--soft); letter-spacing: 0.14em; }
      svg .axis { stroke: var(--soft); stroke-width: 2; fill: none; opacity: 0.6; }
      svg .node { fill: none; stroke: var(--ink); stroke-width: 3; }
      svg .ink { fill: var(--ink); }
      svg .arw { stroke: var(--ink); stroke-width: 4; fill: none; stroke-linecap: square; }
      svg .arw-c { stroke: var(--cyan); stroke-width: 4; fill: none; }
      svg .arw-r { stroke: var(--red); stroke-width: 4; fill: none; }

      /* hook : capture du CDS, sans arrondi */
      #shot { position: absolute; left: -60px; top: 380px; width: 920px; background: #fff; box-shadow: 0 30px 60px rgba(0, 25, 75, 0.18); border: 1px solid rgba(0, 25, 75, 0.08); }
      #shot img { display: block; width: 100%; }
      .badge { position: absolute; padding: 10px 26px 14px; background: var(--red); color: #fff; font-weight: 600; letter-spacing: -0.04em; white-space: nowrap; opacity: 0; }

      /* fin : profil Instagram + bouton */
      #end { position: absolute; left: 140px; top: 470px; width: 800px; height: 820px; opacity: 0; text-align: center; }
      #avatar { position: absolute; left: 220px; top: -10px; width: 360px; height: 360px; }
      #avatar svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #avatar .pic { position: absolute; left: 22px; top: 22px; width: 316px; height: 316px; border-radius: 50%; overflow: hidden; border: 8px solid #00194b; box-shadow: 0 20px 50px rgba(0, 5, 25, 0.5); opacity: 0; }
      #avatar .pic img { width: 100%; height: 100%; display: block; }
      #wordmark { position: absolute; left: 0; right: 0; top: 380px; font-size: 72px; font-weight: 600; letter-spacing: -0.04em; color: #fff; opacity: 0; }
      #btn { position: absolute; left: 50%; top: 510px; width: 400px; height: 100px; margin-left: -200px; border-radius: 8px; background: #0095f6; color: #fff; font-size: 40px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: center; justify-content: center; gap: 14px; opacity: 0; box-shadow: 0 18px 40px rgba(0, 60, 140, 0.4); }
      #btn .t2 { display: none; }
      #btn svg { width: 38px; height: 38px; display: none; }

      /* sous-titres : blanc, fond gris translucide, lettres resserrées */
      #captions { position: absolute; left: 140px; right: 140px; top: 1330px; height: 130px; }
      .cap-line { position: absolute; left: -60px; right: -60px; top: 0; text-align: center; opacity: 0; }
      .cap-box { display: inline-block; padding: 8px 22px 13px; border-radius: 4px; background: rgba(30, 34, 42, 0.74);
        font-family: "Inter UI", sans-serif; font-weight: 600; font-size: 54px; line-height: 1.12; letter-spacing: -0.045em; word-spacing: -0.02em; color: #fff; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="74" data-width="1080" data-height="1920">
      <audio id="vo" src="assets/voiceover.mp3" data-start="0" data-duration="74" data-track-index="1"></audio>
      <div id="stage" class="clip" data-start="0" data-duration="74" data-track-index="0">
        <div id="bg-dark"><div class="glow"></div><div class="grid"></div><div class="vig"></div></div>
        <div id="bg-light"></div>

        <div class="scene light" id="sc-hook"><svg class="chart" id="ch-hook" viewBox="0 0 800 640" style="top:40px"></svg></div>
        <div class="scene" id="sc-ami"><svg class="chart" id="ch-ami" viewBox="0 0 800 640"></svg></div>
        <div class="scene light" id="sc-assur"><svg class="chart" id="ch-assur" viewBox="0 0 800 640"></svg></div>
        <div class="scene" id="sc-pays"><svg class="chart" id="ch-pays" viewBox="0 0 800 640"></svg></div>
        <div class="scene light" id="sc-prix"><svg class="chart" id="ch-prix" viewBox="0 0 800 640"></svg></div>
        <div class="scene" id="sc-chiffres">
          <div class="title">Assurer 1 M€ de dette</div>
          <div class="sub">française, par an</div>
          <svg class="chart" id="ch-chiffres" viewBox="0 0 800 640"></svg>
        </div>
        <div class="scene light" id="sc-nom">
          <div class="big" id="cds-big" style="margin-top:20px;font-size:200px">CDS</div>
          <div class="sub" id="cds-sub" style="font-size:36px;margin-top:20px">Credit Default Swap</div>
          <div id="shot"><img src="assets/img/cds-3-mois.png" alt="" /></div>
        </div>
        <div class="scene" id="sc-pourquoi">
          <div class="title" style="margin-top:40px">Pourquoi ça explose ?</div>
          <div class="big" id="w1" style="margin-top:90px;font-size:110px;opacity:0">Dette</div>
          <div class="big" id="w2" style="margin-top:30px;font-size:110px;opacity:0">Budget</div>
          <div class="big" id="w3" style="margin-top:30px;font-size:110px;opacity:0;color:var(--red)">Politique</div>
        </div>
        <div class="scene light" id="sc-signal"><svg class="chart" id="ch-signal" viewBox="0 0 800 640"></svg></div>
        <div class="scene" id="sc-impact"><svg class="chart" id="ch-impact" viewBox="0 0 800 640"></svg></div>
        <div class="scene light" id="sc-r1">
          <div class="title">1. L'État</div>
          <svg class="chart" id="ch-r1" viewBox="0 0 800 640"></svg>
        </div>
        <div class="scene" id="sc-r2">
          <div class="title">2. Votre crédit</div>
          <svg class="chart" id="ch-r2" viewBox="0 0 800 640"></svg>
        </div>

        <div id="end">
          <div id="avatar"><svg viewBox="0 0 360 360"><defs><linearGradient id="gStory" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75" /><stop offset="0.3" stop-color="#fa7e1e" /><stop offset="0.6" stop-color="#d62976" /><stop offset="1" stop-color="#962fbf" /></linearGradient></defs>
            <circle id="ring" cx="180" cy="180" r="170" fill="none" stroke="url(#gStory)" stroke-width="12" transform="rotate(-90 180 180)" /></svg>
            <div class="pic"><img src="assets/img/logo-financedata.png" alt="" /></div></div>
          <div id="wordmark">FinanceData</div>
          <div id="btn"><svg viewBox="0 0 40 40"><path d="M9 21 L17 29 L32 12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></svg><span class="t1">S'abonner</span><span class="t2">Abonné</span></div>
        </div>

        <div id="captions"></div>
      </div>
    </div>

    <script>
      (function () {
        var NS = "http://www.w3.org/2000/svg";
        var RED = "#ff2e24";
        var R = window.REEL;
        var tl = gsap.timeline({ paused: true });
        var SFX = []; // [nom, instant, gain] → mixés après le rendu par scripts/sfx.mjs

        function el(parent, tag, attrs, text) {
          var n = document.createElementNS(NS, tag);
          for (var k in attrs) n.setAttribute(k, attrs[k]);
          if (text != null) n.textContent = text;
          parent.appendChild(n);
          return n;
        }
        function $(id) { return document.getElementById(id); }
        function drawIn(node, at, dur, ease) {
          var len = node.getTotalLength();
          node.style.strokeDasharray = len + " " + len;
          tl.fromTo(node, { opacity: 0 }, { opacity: 1, duration: 0.01 }, at);
          tl.fromTo(node, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.inOut" }, at);
        }
        function fadeIn(node, at, dur, y) { tl.fromTo(node, { opacity: 0, y: y == null ? 16 : y }, { opacity: 1, y: 0, duration: dur || 0.45, ease: "power2.out" }, at); }
        function popIn(node, at) { tl.fromTo(node, { opacity: 0, scale: 0.85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, at); }
        function growX(node, at, dur) { tl.fromTo(node, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: dur || 0.8, ease: "power2.out" }, at); }
        function growY(node, at, dur) { tl.fromTo(node, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: dur || 0.8, ease: "power2.out" }, at); }
        function fmt(v) { return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
        function counter(node, at, to, dur, suf) {
          var o = { v: 0 };
          tl.fromTo(o, { v: 0 }, { v: to, duration: dur, ease: "power2.out", immediateRender: false, onUpdate: function () { node.textContent = fmt(o.v) + (suf || ""); } }, at);
        }
        function sc(id) { return R.scenes.filter(function (s) { return s.id === id; })[0]; }
        function wordAt(id, key, nth) {
          var hits = [];
          sc(id).chunks.forEach(function (c) { c.words.forEach(function (w) { if (w.key === key) hits.push(w); }); });
          if (!hits.length) throw new Error("mot introuvable : " + key);
          return hits[nth || 0].start;
        }
        function arrow(parent, x1, y1, x2, y2, at, dur, cls, dash) {
          var p = el(parent, "path", { d: "M" + x1 + " " + y1 + " L" + x2 + " " + y2, class: cls || "arw" });
          if (dash) p.setAttribute("stroke-dasharray", dash);
          var a = Math.atan2(y2 - y1, x2 - x1), h = 20;
          var head = el(parent, "path", { d: "M" + (x2 - h * Math.cos(a - 0.5)) + " " + (y2 - h * Math.sin(a - 0.5)) + " L" + x2 + " " + y2 + " L" + (x2 - h * Math.cos(a + 0.5)) + " " + (y2 - h * Math.sin(a + 0.5)), class: cls || "arw" });
          if (dash) { fadeIn(p, at, dur || 0.5, 0); } else drawIn(p, at, dur || 0.5);
          fadeIn(head, at + (dur || 0.5) - 0.1, 0.15, 0);
          return [p, head];
        }
        // personnage / institution : carré à angles droits + libellé
        function node(parent, x, y, label, at, kind) {
          var g = el(parent, "g", {});
          if (kind === "bank") {
            el(g, "path", { d: "M" + (x - 52) + " " + (y - 14) + " L" + x + " " + (y - 50) + " L" + (x + 52) + " " + (y - 14) + " Z M" + (x - 40) + " " + (y - 6) + " L" + (x - 40) + " " + (y + 34) + " M" + x + " " + (y - 6) + " L" + x + " " + (y + 34) + " M" + (x + 40) + " " + (y - 6) + " L" + (x + 40) + " " + (y + 34) + " M" + (x - 58) + " " + (y + 44) + " L" + (x + 58) + " " + (y + 44), class: "node" });
          } else if (kind === "flag") {
            el(g, "rect", { x: x - 66, y: y - 44, width: 44, height: 88, fill: "#1f4fbf" });
            el(g, "rect", { x: x - 22, y: y - 44, width: 44, height: 88, fill: "#ffffff", stroke: "rgba(0,25,75,0.15)" });
            el(g, "rect", { x: x + 22, y: y - 44, width: 44, height: 88, fill: RED });
          } else {
            el(g, "circle", { cx: x, cy: y - 26, r: 24, class: "node" });
            el(g, "path", { d: "M" + (x - 44) + " " + (y + 44) + " L" + (x - 44) + " " + (y + 28) + " Q" + x + " " + (y - 6) + " " + (x + 44) + " " + (y + 28) + " L" + (x + 44) + " " + (y + 44), class: "node" });
          }
          el(g, "text", { x: x, y: y + 96, class: "val", "font-size": 34, "text-anchor": "middle" }, label);
          if (at != null) popIn(g, at);
          return g;
        }
        function chip(parent, x, y, text, at, color, fill) {
          var g = el(parent, "g", {});
          var t = el(g, "text", { x: x, y: y, "font-size": 28, "font-weight": 600, "text-anchor": "middle", "letter-spacing": "0.06em", style: "fill:" + (fill ? "#fff" : color) }, text);
          var w = text.length * 20 + 40;
          var r = el(g, "rect", { x: x - w / 2, y: y - 34, width: w, height: 48, style: fill ? "fill:" + color : "fill:none;stroke:" + color + ";stroke-width:2" });
          g.insertBefore(r, t);
          if (at != null) popIn(g, at);
          return g;
        }

        // ================= MONTAGE : une scène = un fond, alterné blanc / bleu =================
        R.scenes.forEach(function (s, i) {
          var light = s.id !== "cta" && i % 2 === 0;
          if (i) {
            tl.to("#bg-light", { opacity: light ? 1 : 0, duration: 0.3, ease: "power1.inOut" }, s.start - 0.15);
            SFX.push(["whoosh", s.start - 0.22, 0.12]);
          }
          var n = $("sc-" + s.id);
          if (!n) return;
          tl.fromTo(n, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: i ? 0.4 : 0.2, ease: "power2.out" }, Math.max(0, s.start - 0.04));
          tl.to(n, { opacity: 0, duration: 0.2 }, s.end - 0.2);
        });

        // ---------- hook : la France inquiète les marchés… et ça vous concerne ----------
        (function () {
          var s = sc("hook"), svg = $("ch-hook");
          var fl = node(svg, 400, 110, "", null, "flag");
          fl.setAttribute("transform", "translate(400 120) scale(1.9) translate(-400 -110)");
          tl.fromTo(fl, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, 0.0);
          SFX.push(["swipe", 0.0, 0.4]);
          var pulse = el(svg, "circle", { cx: 545, cy: 30, r: 22, fill: RED });
          tl.fromTo(pulse, { opacity: 0 }, { opacity: 1, duration: 0.18, repeat: 7, yoyo: true }, 0.1);
          var t1 = el(svg, "text", { x: 400, y: 330, "font-size": 56, "font-weight": 600, "text-anchor": "middle", "letter-spacing": "-0.03em", style: "fill:var(--ink)" }, "La France inquiète les marchés");
          tl.fromTo(t1, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.15);
          [["Crédit", "crédit", 150], ["Épargne", "l'épargne", 400], ["Impôts", "impôts", 650]].forEach(function (w) {
            var g = el(svg, "g", {});
            el(g, "rect", { x: w[2] - 115, y: 400, width: 230, height: 90, style: "fill:var(--ink)" });
            el(g, "text", { x: w[2], y: 460, "font-size": 40, "font-weight": 600, fill: "#fff", "text-anchor": "middle" }, w[0]);
            popIn(g, wordAt("hook", w[1]) - 0.12);
            SFX.push(["pop", wordAt("hook", w[1]) - 0.12, 0.25]);
          });
          var c = el(svg, "text", { x: 400, y: 620, "font-size": 78, "font-weight": 600, fill: RED, "text-anchor": "middle", "letter-spacing": "-0.03em" }, "Ça vous concerne");
          popIn(c, wordAt("hook", "concerne") - 0.4);
        })();

        // ---------- l'analogie : vous prêtez à un ami ----------
        var P = { you: [170, 300], ami: [630, 110], ins: [630, 490] };
        (function () {
          var s = sc("ami"), svg = $("ch-ami");
          node(svg, P.you[0], P.you[1], "Vous", s.start + 0.05);
          node(svg, P.ami[0], P.ami[1], "Votre ami", wordAt("ami", "ami") - 0.15);
          var tP = wordAt("ami", "prêtez") - 0.1;
          arrow(svg, 250, 260, 540, 150, tP, 0.6);
          var m = el(svg, "text", { x: 380, y: 170, class: "val", "font-size": 44, "text-anchor": "middle", transform: "rotate(-21 380 170)" }, "1 000 €");
          fadeIn(m, tP + 0.4, 0.4, 0);
          var q = el(svg, "text", { x: 720, y: 80, "font-size": 96, "font-weight": 600, fill: RED, "text-anchor": "middle" }, "?");
          popIn(q, wordAt("ami", "totalement") - 0.25);
        })();

        // ---------- l'assureur ----------
        (function () {
          var s = sc("assur"), svg = $("ch-assur");
          var a = node(svg, P.ami[0], P.ami[1], "Votre ami", null); a.setAttribute("opacity", 0.35);
          el(svg, "path", { d: "M250 260 L540 150", class: "arw", opacity: 0.35 });
          node(svg, P.you[0], P.you[1], "Vous", null);
          node(svg, P.ins[0], P.ins[1], "Assureur", wordAt("assur", "assureur") - 0.15, "bank");
          var tP = wordAt("assur", "paie") - 0.4;
          arrow(svg, 540, 470, 260, 370, tP, 0.6, "arw-c", "12 10");
          var l1 = el(svg, "text", { x: 360, y: 470, "font-size": 30, "font-weight": 600, style: "fill:var(--cyan)", "text-anchor": "middle" }, "il vous rembourse");
          fadeIn(l1, tP + 0.3, 0.4, 0);
          var tM = wordAt("assur", "prime") - 0.15;
          arrow(svg, 250, 340, 545, 440, tM, 0.6);
          var l2 = el(svg, "text", { x: 440, y: 360, class: "val", "font-size": 34, "text-anchor": "middle" }, "prime / an");
          fadeIn(l2, tM + 0.35, 0.4, 0);
        })();

        // ---------- même chose pour la France ----------
        (function () {
          var s = sc("pays"), svg = $("ch-pays");
          node(svg, P.you[0], P.you[1], "Investisseurs", wordAt("pays", "investisseurs") - 0.15);
          node(svg, P.ami[0], P.ami[1], "France", wordAt("pays", "France") - 0.2, "flag");
          var tP = wordAt("pays", "prêtent") - 0.1;
          arrow(svg, 250, 260, 540, 150, tP, 0.6);
          var m = el(svg, "text", { x: 380, y: 170, class: "val", "font-size": 44, "text-anchor": "middle", transform: "rotate(-21 380 170)" }, "€");
          fadeIn(m, tP + 0.4, 0.3, 0);
          var tA = wordAt("pays", "s'assurent") - 0.15;
          node(svg, P.ins[0], P.ins[1], "Assureur", tA, "bank");
          arrow(svg, 250, 340, 545, 440, tA + 0.2, 0.6);
          var l2 = el(svg, "text", { x: 440, y: 360, class: "val", "font-size": 34, "text-anchor": "middle" }, "prime / an");
          fadeIn(l2, tA + 0.6, 0.4, 0);
        })();

        // ---------- risque ↑ = prix ↑ ----------
        (function () {
          var s = sc("prix"), svg = $("ch-prix");
          [["RISQUE", 200, wordAt("prix", "risque") - 0.1, "var(--ink)"], ["PRIX DE L'ASSURANCE", 600, wordAt("prix", "cher") - 0.35, RED]].forEach(function (c) {
            var p = el(svg, "path", { d: "M" + c[1] + " 470 L" + c[1] + " 150", style: "stroke:" + c[3] + ";stroke-width:14;fill:none" });
            drawIn(p, c[2], 0.6, "power2.out");
            var h = el(svg, "path", { d: "M" + (c[1] - 50) + " 190 L" + c[1] + " 120 L" + (c[1] + 50) + " 190", style: "stroke:" + c[3] + ";stroke-width:14;fill:none" });
            fadeIn(h, c[2] + 0.45, 0.2, 0);
            var l = el(svg, "text", { x: c[1], y: 540, class: "cap", "font-size": 28, "text-anchor": "middle" }, c[0]);
            fadeIn(l, c[2], 0.4, 0);
          });
          var eq = el(svg, "text", { x: 400, y: 330, class: "val", "font-size": 90, "text-anchor": "middle" }, "=");
          fadeIn(eq, wordAt("prix", "cher") - 0.6, 0.3, 0);
        })();

        // ---------- 3 500 € → 8 000 € ----------
        (function () {
          var s = sc("chiffres"), svg = $("ch-chiffres"), base = 560, k = 0.052;
          el(svg, "line", { x1: 60, x2: 740, y1: base, y2: base, class: "axis" });
          var tS = wordAt("chiffres", "septembre") - 0.1, tA = wordAt("chiffres", "Aujourd'hui") - 0.1;
          [[140, 3500, "DÉBUT SEPT.", "var(--ink)", tS], [460, 8000, "AUJOURD'HUI", RED, tA]].forEach(function (b) {
            var r = el(svg, "rect", { x: b[0], y: base - b[1] * k, width: 200, height: b[1] * k, style: "fill:" + b[3] });
            var v = el(svg, "text", { x: b[0] + 100, y: base - b[1] * k - 26, "font-size": 56, "font-weight": 600, "text-anchor": "middle", style: "fill:" + b[3] }, "0 €");
            var l = el(svg, "text", { x: b[0] + 100, y: base + 46, class: "cap", "font-size": 22, "text-anchor": "middle" }, b[2]);
            growY(r, b[4], 0.9); fadeIn(l, b[4], 0.3, 0); fadeIn(v, b[4] + 0.1, 0.3, 0);
            counter(v, b[4] + 0.1, b[1], 0.9, " €");
          });
          chip(svg, 400, 50, "PLUS HAUT DEPUIS 2013", wordAt("chiffres", "2013") - 0.25, RED, true);
        })();

        // ---------- le nom : CDS, et sa courbe ----------
        (function () {
          var s = sc("nom"), t = wordAt("nom", "Credit");
          tl.fromTo("#cds-big", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, t - 0.25);
          fadeIn($("cds-sub"), t, 0.35);
          tl.fromTo("#shot", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.5)" }, t + 0.3);
          SFX.push(["pop", t - 0.25, 0.35]);
        })();

        // ---------- pourquoi : dette, budget, politique ----------
        (function () {
          fadeIn($("w1"), wordAt("pourquoi", "dette") - 0.15, 0.4);
          fadeIn($("w2"), wordAt("pourquoi", "budget") - 0.15, 0.4);
          fadeIn($("w3"), wordAt("pourquoi", "politique") - 0.15, 0.4);
        })();

        // ---------- pas une faillite, mais un signal ----------
        (function () {
          var s = sc("signal"), svg = $("ch-signal");
          var f = el(svg, "text", { x: 400, y: 150, class: "val", "font-size": 110, "text-anchor": "middle" }, "Faillite");
          fadeIn(f, wordAt("signal", "faillite") - 0.3, 0.35);
          var st = el(svg, "line", { x1: 150, x2: 650, y1: 115, y2: 115, stroke: RED, "stroke-width": 10 });
          growX(st, wordAt("signal", "faillite") + 0.2, 0.35);
          var tC = wordAt("signal", "confiance") - 0.2;
          var c = el(svg, "text", { x: 400, y: 400, class: "val", "font-size": 110, "text-anchor": "middle" }, "Confiance");
          fadeIn(c, tC - 0.3, 0.35);
          arrow(svg, 400, 440, 400, 590, tC, 0.4, "arw-r");
        })();

        // ---------- la France emprunte plus cher… deux raisons ----------
        (function () {
          var s = sc("impact"), svg = $("ch-impact");
          var t1 = el(svg, "text", { x: 60, y: 60, class: "cap", "font-size": 26 }, "TAUX D'EMPRUNT DE LA FRANCE");
          fadeIn(t1, wordAt("impact", "France") - 0.2, 0.4, 0);
          var ln = el(svg, "path", { d: "M60 300 L240 280 L420 240 L600 170 L740 100", style: "stroke:" + RED + ";stroke-width:8;fill:none" });
          drawIn(ln, wordAt("impact", "emprunter") - 0.4, 0.8, "power2.out");
          var tR = wordAt("impact", "deux") - 0.1;
          [["1", 250], ["2", 550]].forEach(function (n, i) {
            var g = el(svg, "g", {});
            el(g, "rect", { x: n[1] - 70, y: 400, width: 140, height: 140, style: "fill:var(--ink)" });
            el(g, "text", { x: n[1], y: 500, "font-size": 90, "font-weight": 600, fill: "#00194b", "text-anchor": "middle" }, n[0]);
            popIn(g, tR + i * 0.15);
          });
        })();

        // ---------- raison 1 : les intérêts de la dette ----------
        (function () {
          var s = sc("r1"), svg = $("ch-r1");
          var t2 = el(svg, "text", { x: 60, y: 120, class: "cap", "font-size": 26 }, "BUDGET DE L'ÉTAT");
          fadeIn(t2, s.start + 0.1, 0.4, 0);
          var bg = el(svg, "rect", { x: 60, y: 150, width: 680, height: 110, style: "fill:var(--ink)" });
          growX(bg, s.start + 0.1, 0.5);
          var tI = wordAt("r1", "d'intérêts") - 0.2;
          var it = el(svg, "rect", { x: 60, y: 150, width: 260, height: 110, fill: RED });
          growX(it, tI, 0.9);
          var l = el(svg, "text", { x: 190, y: 218, "font-size": 32, "font-weight": 600, fill: "#fff", "text-anchor": "middle" }, "Intérêts");
          fadeIn(l, tI + 0.6, 0.3, 0);
          var l2 = el(svg, "text", { x: 530, y: 218, "font-size": 32, "font-weight": 600, fill: "#fff", "text-anchor": "middle" }, "Autres dépenses");
          fadeIn(l2, wordAt("r1", "d'autres") - 0.2, 0.3, 0);
          var ar = arrow(svg, 330, 330, 520, 330, wordAt("r1", "détriment") - 0.2, 0.5, "arw-r");
          var l3 = el(svg, "text", { x: 400, y: 410, "font-size": 34, "font-weight": 600, fill: RED, "text-anchor": "middle" }, "moins pour le reste");
          fadeIn(l3, wordAt("r1", "détriment") + 0.2, 0.4, 0);
        })();

        // ---------- raison 2 : votre crédit immobilier ----------
        (function () {
          var s = sc("r2"), svg = $("ch-r2");
          var h = el(svg, "path", { d: "M200 330 L330 220 L460 330 M230 305 L230 470 L430 470 L430 305 M300 470 L300 390 L360 390 L360 470", class: "node", style: "stroke-width:6" });
          drawIn(h, s.start + 0.1, 0.9);
          var tT = wordAt("r2", "immobiliers") - 0.4;
          var t = el(svg, "text", { x: 620, y: 260, "font-size": 34, "font-weight": 600, "text-anchor": "middle", style: "fill:var(--ink)" }, "Taux de crédit");
          fadeIn(t, tT, 0.4, 0);
          arrow(svg, 620, 470, 620, 300, tT + 0.2, 0.5, "arw-r");
          var c = el(svg, "text", { x: 400, y: 600, "font-size": 56, "font-weight": 600, fill: RED, "text-anchor": "middle" }, "Emprunter coûte plus cher");
          fadeIn(c, wordAt("r2", "coûter") - 0.4, 0.4, 0);
        })();

        // ---------- fin : profil Instagram, bouton calé sur « abonnez-vous » ----------
        (function () {
          var c = sc("cta"), tA = wordAt("cta", "abonnez-vous");
          tl.fromTo("#end", { opacity: 0 }, { opacity: 1, duration: 0.4 }, c.start);
          tl.fromTo("#avatar .pic", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, c.start + 0.05);
          drawIn($("ring"), c.start + 0.25, 0.8, "power2.inOut");
          fadeIn($("wordmark"), c.start + 0.5, 0.45);
          var tB = tA - 0.9, tC = tA + 0.08;
          tl.fromTo("#btn", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, tB);
          tl.to("#btn", { scale: 0.94, duration: 0.1, ease: "power1.in" }, tC);
          tl.to("#btn", { scale: 1, duration: 0.2, ease: "back.out(2)" }, tC + 0.1);
          tl.to("#btn", { backgroundColor: "#363a45", boxShadow: "0 18px 40px rgba(0,0,0,0.35)", duration: 0.3 }, tC + 0.05);
          tl.set("#btn .t1", { display: "none" }, tC + 0.1);
          tl.set("#btn .t2", { display: "inline" }, tC + 0.1);
          tl.set("#btn svg", { display: "block" }, tC + 0.1);
          drawIn(document.querySelector("#btn svg path"), tC + 0.12, 0.2);
          SFX.push(["click", tC - 0.02, 0.5]);
        })();

        // ---------- sous-titres (3 mots max, blancs, fond gris translucide) ----------
        (function () {
          var box = $("captions");
          R.chunks.forEach(function (c) {
            var div = document.createElement("div");
            div.className = "cap-line";
            var inner = document.createElement("div");
            inner.className = "cap-box";
            inner.textContent = c.words.map(function (w) { return w.text; }).join(" ");
            div.appendChild(inner);
            box.appendChild(div);
            tl.fromTo(div, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.1, ease: "power2.out" }, c.start - 0.06);
            tl.to(div, { opacity: 0, duration: 0.01 }, c.end - 0.035);
          });
        })();

        window.__SFX = SFX.map(function (c) { return { name: c[0], t: +c[1].toFixed(3), gain: c[2] }; });
        tl.set({}, {}, R.total);
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
