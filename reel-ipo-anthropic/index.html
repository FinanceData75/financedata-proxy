<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/vo-words.js"></script>
    <style>
      /* Reel « L'IPO d'Anthropic : mieux vaut être patient » (72,64 s). Fond blanc FinanceData, bleu sombre pour les moments forts. */
      @font-face { font-family: "Display"; src: url("assets/fonts/inter-display-latin-var.woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f6f8fc; }
      #root { width: 1080px; height: 1920px; position: relative; overflow: hidden; font-family: "Display", sans-serif; color: #00194b; background: #f6f8fc; font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; }
      #bg { position: absolute; inset: 0; background: #f6f8fc; }
      #bg .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,25,75,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,25,75,.05) 1px, transparent 1px); background-size: 48px 48px; background-position: 12px 0;
        -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); }
      .a { position: absolute; }
      .scene { position: absolute; inset: 0; opacity: 0; }
      .navy { background: #00194b; }
      .navy .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 48px 48px; background-position: 12px 0;
        -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); }
      svg { position: absolute; overflow: visible; }
      svg text { font-family: "Display"; font-feature-settings: "tnum" 1; }
      .cap-line { position: absolute; left: 100px; right: 100px; top: 1400px; text-align: center; opacity: 0; }
      .cap-box { display: inline-block; padding: 8px 22px 13px; border-radius: 4px; background: rgba(30,34,42,.78); font-weight: 700; font-size: 52px; line-height: 1.12; letter-spacing: -.05em; color: #fff; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="72.64" data-width="1080" data-height="1920">
      <audio id="vo" src="assets/voix.mp3" data-start="0" data-duration="72.64" data-track-index="1"></audio>
      <div id="bgs" class="clip" data-start="0" data-duration="72.64" data-track-index="2" style="position:absolute; inset:0"><div id="bg"><div class="grid"></div></div></div>
      <div id="stage" class="clip" data-start="0" data-duration="72.64" data-track-index="3" style="position:absolute; inset:0"></div>
      <div id="top" class="clip" data-start="0" data-duration="72.64" data-track-index="5" style="position:absolute; inset:0; pointer-events:none"></div>
    </div>
    <script>
      (function () {
        var NS = "http://www.w3.org/2000/svg", tl = gsap.timeline({ paused: true }), END = 72.64;
        var st = document.getElementById("stage"), top = document.getElementById("top");
        var INK = "#00194b", SOFT = "#5b6b8a", DN = "#ff1744", DNT = "#d50f35", GR = "#00b85c", GRT = "#00843f", CY = "#7dd0f5";
        function div(p, html, style, cls) { var d = document.createElement("div"); d.className = cls || "a"; d.innerHTML = html; d.setAttribute("style", style || ""); p.appendChild(d); return d; }
        function el(s, tag, a, text) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; s.appendChild(e); return e; }
        function svg(p, x, y, w, h) { var g = document.createElementNS(NS, "svg"); g.setAttribute("width", w); g.setAttribute("height", h); g.style.left = x + "px"; g.style.top = y + "px"; p.appendChild(g); return g; }
        function inn(n, t, d, y) { tl.fromTo(n, { opacity: 0, y: y == null ? 12 : y }, { opacity: 1, y: 0, duration: d || .4, ease: "power2.out", immediateRender: false }, t); return n; }
        function out(n, t, d) { tl.to(n, { opacity: 0, duration: d || .2 }, t); return n; }
        function scene(t0, t1, cls) { var s = div(st, "", "", "scene" + (cls ? " " + cls : "")); if (cls === "navy") div(s, "", "", "grid"); tl.set(s, { opacity: 1 }, t0); tl.set(s, { opacity: 0 }, t1); return s; }

        // transitions fluides : fondu court + léger glissement, images fixes (pas de zoom sur les photos)
        function sc(t0, t1, cls) { var s = div(st, "", "", "scene" + (cls ? " " + cls : "")); tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: .18, ease: "power1.out", immediateRender: false }, t0); tl.set(s, { opacity: 0 }, t1 + .18); return s; }
        function full(s, src, pos, dark) { div(s, "<img src='assets/img/" + src + "' style='width:1080px; height:1920px; object-fit:cover; object-position:" + (pos || "50% 50%") + "; display:block'>", "inset:0"); if (dark) div(s, "", "inset:0; background:" + dark); }
        function rise(n, t, d) { tl.fromTo(n, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: d || .4, ease: "power3.out", immediateRender: false }, t); return n; }

        // 1. « N'achetez pas l'action » (0 → 0,88) : la tour Nasdaq
        (function () { var s = sc(0, 0.88); s.style.opacity = 1; full(s, "nasdaq-tour.jpg", "50% 35%", "linear-gradient(180deg, rgba(0,12,40,.25), rgba(0,12,40,0) 40%, rgba(0,12,40,.3))"); })();
        // 2. « d'Anthropic aujourd'hui » (0,88 → 2,0) : Claude + Anthropic
        (function () { var s = sc(0.88, 2.0);
          var c = div(s, "<img src='assets/img/claude.png' style='width:200px; display:block'>", "left:440px; top:600px"); rise(c, 0.9, .45);
          var a = div(s, "<img src='assets/img/anthropic.png' style='width:720px; display:block'>", "left:180px; top:880px"); rise(a, 1.0, .45);
          var d = div(s, "Entre en Bourse aujourd'hui", "left:0; right:0; top:1010px; text-align:center; font-size:46px; font-weight:700; letter-spacing:-.04em; color:" + SOFT + "; opacity:0"); rise(d, 1.42, .35); })();
        // 3. « sans connaître ce qu'a découvert » (2,0 → 3,3) : la fête de l'introduction, 81 $
        (function () { var s = sc(2.0, 3.3); full(s, "nasdaq-fete.jpg", "50% 50%", "linear-gradient(180deg, rgba(0,12,40,.55), rgba(0,12,40,.75))");
          var p = div(s, "81 $", "left:0; right:0; top:700px; text-align:center; font-size:220px; font-weight:700; letter-spacing:-.06em; line-height:1; color:#fff; text-shadow:0 8px 40px rgba(0,0,0,.4)"); rise(p, 2.05, .4);
          var q = div(s, "par action · 1<sup style='font-size:.6em'>re</sup> cotation", "left:0; right:0; top:950px; text-align:center; font-size:44px; font-weight:700; letter-spacing:-.04em; color:#e6ecf7; opacity:0"); rise(q, 2.3, .35); })();
        // 4. « ce chercheur américain. Lui, c'est Jay Ritter » (3,3 → 7,6) : la photo, fixe, bords droits
        (function () { var s = sc(3.3, 7.6);
          var ph = div(s, "<img src='assets/img/ritter.jpg' style='width:760px; height:760px; object-fit:cover; display:block'>", "left:160px; top:430px"); rise(ph, 3.3, .45);
          var n = div(s, "Jay Ritter", "left:0; right:0; top:1225px; text-align:center; font-size:84px; font-weight:700; letter-spacing:-.055em; color:" + INK + "; opacity:0"); rise(n, 5.1, .35);
          var r = div(s, "Professeur à l'université de Floride", "left:0; right:0; top:1325px; text-align:center; font-size:38px; font-weight:600; letter-spacing:-.03em; color:" + SOFT + "; opacity:0"); rise(r, 5.95, .35); })();

        // ===== sous-titres : 3 mots max =====
        var W = window.VO.words, groups = [], cur = [];
        W.forEach(function (t, k) { cur.push(t); if (/[,.?:!…]$/.test(t.w) || cur.length >= 3 || !W[k + 1]) { groups.push(cur); cur = []; } });
        var SKIP = [[5.0, 7.6]];
        groups.forEach(function (gp, k) {
          var t0 = gp[0].s, t1 = k + 1 < groups.length ? groups[k + 1][0].s : END;
          if (SKIP.some(function (r) { return t0 >= r[0] && t0 < r[1]; })) return;
          var lim = SKIP.reduce(function (m, r) { return r[0] > t0 && r[0] < m ? r[0] : m; }, END);
          var d = div(top, "<span class='cap-box'>" + gp.map(function (t) { return t.w.replace(/^18$/, "18 %").replace(/^50$/, "50 %"); }).join(" ") + "</span>", "", "cap-line");
          tl.fromTo(d, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .1, ease: "power2.out", immediateRender: false }, Math.max(0, t0 - .06));
          tl.set(d, { opacity: 0 }, Math.min(t1, gp[gp.length - 1].e + .6, lim) - .035);
        });

        tl.set({}, {}, END);
        window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; tl.seek(0);
      })();
    </script>
  </body>
</html>
