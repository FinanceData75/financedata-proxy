<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Carte de série « Le dessous des marchés » (3 s), façon générique de film : fond blanc, homme de dos devant un tableau de cotations,
         bandes cinéma qui s'ouvrent, mise au point, titre révélé ligne par ligne, grain de pellicule. Changer EPISODE ci-dessous. */
      @font-face { font-family: "Display"; src: url("assets/fonts/inter-display-latin-var.woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #fff; font-family: "Display", sans-serif; font-variation-settings: "opsz" 32; -webkit-font-smoothing: antialiased; color: #0a105e; }
      .a { position: absolute; }
      .mask { position: absolute; left: 0; right: 0; overflow: hidden; text-align: center; }
      .mask span { display: inline-block; font-weight: 800; font-size: 150px; letter-spacing: -.06em; line-height: 1.08; padding: 0 20px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="3" data-track-index="0" style="position:absolute; inset:0"></div>
    </div>
    <script>
      (function () {
        var EPISODE = 3, END = 3, tl = gsap.timeline({ paused: true }), st = document.getElementById("stage");
        function div(p, html, style) { var d = document.createElement("div"); d.className = "a"; d.innerHTML = html; d.setAttribute("style", style || ""); p.appendChild(d); return d; }

        // image : homme de dos, bords fondus dans le blanc
        var cam = div(st, "", "left:0; top:250px; width:1080px; height:900px; overflow:hidden");
        var img = div(cam, "", "inset:0; background:url(assets/homme-bourse.jpg) center 30%/cover no-repeat; -webkit-mask-image:radial-gradient(ellipse 62% 58% at 50% 46%, #000 55%, transparent 100%); mask-image:radial-gradient(ellipse 62% 58% at 50% 46%, #000 55%, transparent 100%)");
        div(cam, "", "left:0; right:0; bottom:0; height:260px; background:linear-gradient(180deg, rgba(255,255,255,0), #fff)");
        tl.fromTo(img, { opacity: 0, scale: 1.16, filter: "blur(16px) saturate(.4)" }, { opacity: 1, scale: 1.05, filter: "blur(0px) saturate(1)", duration: 1.3, ease: "power3.out" }, 0);
        tl.to(img, { scale: 1, duration: END - 1.3, ease: "none" }, 1.3);

        // épisode
        var ep = div(st, "Épisode " + EPISODE, "left:0; right:0; top:1150px; text-align:center; font-weight:600; font-size:40px; letter-spacing:.32em; text-transform:uppercase; color:#3d5afe");
        var rule = div(st, "", "left:490px; top:1218px; width:100px; height:4px; background:#3d5afe");
        tl.fromTo(ep, { opacity: 0, scaleX: 1.35 }, { opacity: 1, scaleX: 1, duration: .9, ease: "power3.out" }, .45);
        tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: .6, ease: "power3.inOut" }, .6);

        // titre, ligne par ligne derrière un masque
        var l1 = div(st, "<span>Le dessous</span>", "top:1250px", ""), l2 = div(st, "<span>des marchés</span>", "top:1412px", "");
        l1.className = l2.className = "mask";
        tl.fromTo(l1.firstChild, { yPercent: 105 }, { yPercent: 0, duration: .75, ease: "power4.out" }, .7);
        tl.fromTo(l2.firstChild, { yPercent: 105 }, { yPercent: 0, duration: .75, ease: "power4.out" }, .85);

        // bandes cinéma qui s'ouvrent + flash d'exposition
        var top = div(st, "", "left:0; top:0; width:1080px; height:960px; background:#05070f; transform-origin:50% 0");
        var bot = div(st, "", "left:0; top:960px; width:1080px; height:960px; background:#05070f; transform-origin:50% 100%");
        tl.fromTo(top, { scaleY: 1 }, { scaleY: .14, duration: .55, ease: "power3.inOut" }, 0);
        tl.fromTo(bot, { scaleY: 1 }, { scaleY: .14, duration: .55, ease: "power3.inOut" }, 0);
        tl.to([top, bot], { scaleY: 0, duration: .7, ease: "power3.inOut" }, 1.9);
        // grain de pellicule + vignette légère
        var grain = div(st, "", "left:-256px; top:-256px; width:1592px; height:2432px; background:url(assets/grain.png); opacity:.07; mix-blend-mode:multiply");
        tl.fromTo(grain, { x: 0, y: 0 }, { x: 240, y: 170, duration: END, ease: "steps(72)" }, 0);
        div(st, "", "inset:0; background:radial-gradient(ellipse 90% 75% at 50% 50%, rgba(10,16,94,0) 60%, rgba(10,16,94,.10) 100%)");

        tl.set({}, {}, END);
        window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; tl.seek(0);
      })();
    </script>
  </body>
</html>
