<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Générique « Le dessous des marchés » calé sur la voix (2,8 s) : le générique fourni (0,3 → 3,1 s),
         avec une lente poussée de caméra, du grain et une fuite de lumière bleue à l'ouverture. Le numéro d'épisode est celui du générique fourni. */
      @font-face { font-family: "Display"; src: url("assets/fonts/inter-display-latin-var.woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0a1020; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0a1020; font-family: "Display", sans-serif; -webkit-font-smoothing: antialiased; }
      .a { position: absolute; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.8" data-width="1080" data-height="1920">
      <div id="cam" style="position:absolute; inset:0">
        <video id="gen" class="clip" src="assets/generique.mp4" data-start="0" data-duration="2.8" data-track-index="1" muted playsinline style="position:absolute; left:0; top:0; width:1080px; height:1920px; object-fit:cover"></video>
      </div>
      <div id="stage" class="clip" data-start="0" data-duration="2.8" data-track-index="0" style="position:absolute; inset:0"></div>
    </div>
    <script>
      (function () {
                var END = 2.8, tl = gsap.timeline({ paused: true }), st = document.getElementById("stage"), cam = document.getElementById("cam");
        function div(p, html, style, cls) { var d = document.createElement("div"); d.className = cls || "a"; d.innerHTML = html; d.setAttribute("style", style || ""); p.appendChild(d); return d; }

        // caméra : lente poussée
        tl.fromTo(cam, { scale: 1.0 }, { scale: 1.07, duration: END, ease: "none", transformOrigin: "50% 40%" }, 0);
        // fuite de lumière bleue qui traverse l'image à l'ouverture
        var leak = div(st, "", "left:-700px; top:-200px; width:900px; height:2400px; background:linear-gradient(90deg, rgba(61,90,254,0), rgba(61,120,254,.55), rgba(180,200,255,.35), rgba(61,90,254,0)); mix-blend-mode:screen; transform:rotate(12deg)");
        tl.fromTo(leak, { x: 0, opacity: 1 }, { x: 2100, duration: 1.1, ease: "power2.inOut" }, .05);
        tl.to(leak, { opacity: 0, duration: .2 }, 1.0);

        // grain, vignette
        var grain = div(st, "", "left:-256px; top:-256px; width:1592px; height:2432px; background:url(assets/grain.png); opacity:.14; mix-blend-mode:overlay");
        tl.fromTo(grain, { x: 0, y: 0 }, { x: 250, y: 190, duration: END, ease: "steps(84)" }, 0);
        div(st, "", "inset:0; background:radial-gradient(ellipse 85% 70% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%)");
        // deux images noires puis ouverture, comme une coupe de pellicule
        var cut = div(st, "", "inset:0; background:#000");
        tl.set(cut, { opacity: 1 }, 0); tl.set(cut, { opacity: 0 }, 2 / 30);

        tl.set({}, {}, END);
        window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; tl.seek(0);
      })();
    </script>
  </body>
</html>
