    <style>

         contenu réduit à 82 % pour la zone sûre Instagram / TikTok, sous-titres 3 mots max calés sur la voix. */
      @font-face { font-family: "Display"; src: url("assets/fonts/inter-display-latin-var.woff2"); font-weight: 100 900; }

      .tile { position: absolute; left: 96px; width: 888px; height: 300px; border-radius: 4px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 2px rgba(255,255,255,.12); color: #fff; }
      .lbl { position: absolute; left: 48px; top: 48px; font-size: 34px; font-weight: 700; color: rgba(255,255,255,.55); letter-spacing: -.02em; }
      .big { position: absolute; left: 48px; top: 110px; font-size: 96px; font-weight: 700; letter-spacing: -.055em; line-height: 1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="61.05" data-width="1080" data-height="1920">
      <audio id="vo" src="assets/voix.mp3" data-start="0" data-duration="61.05" data-track-index="1"></audio>
      <video id="v-ws" class="clip" src="assets/video/wall-street-nuit.mp4" data-start="11.31" data-duration="4.56" data-track-index="2" muted playsinline style="position:absolute; left:0; top:0; width:1080px; height:1920px; object-fit:cover"></video>
      <div id="bgl" class="clip" data-start="0" data-duration="61.05" data-track-index="4" style="position:absolute; inset:0"></div>
      <div id="stage" class="clip" data-start="0" data-duration="61.05" data-track-index="0" style="position:absolute; inset:0"></div>
    </div>
    <script>
      (function () {
        var NS = "http://www.w3.org/2000/svg", tl = gsap.timeline({ paused: true });
        var st = document.getElementById("stage"), bgl = document.getElementById("bgl");
        var NAVY = "#0a105e", BLUE = "#3d5afe", RED = "#d9161e", GREEN = "#1f9d55", GRID = "#d5dae5", AX = "#6b7290", PALE = "#c5cad9";
        function div(p, html, style, cls) { var d = document.createElement("div"); d.className = cls || "a"; d.innerHTML = html; d.setAttribute("style", style || ""); p.appendChild(d); return d; }
        function el(s, tag, a, text) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; s.appendChild(e); return e; }
        function T(s, x, y, str, size, fill, w, anchor) { return el(s, "text", { x: x, y: y, "font-size": size, fill: fill, "font-weight": w || 600, "text-anchor": anchor || "start" }, str); }
        function fr(v, d) { return v.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }).replace(/[  ]/g, " "); }
        function svg(p, x, y, w, h) { var g = document.createElementNS(NS, "svg"); g.setAttribute("width", w); g.setAttribute("height", h); g.style.left = x + "px"; g.style.top = y + "px"; p.appendChild(g); return g; }
        function idx(S, date) { for (var i = 0; i < S.length; i++) if (S[i][0] >= date) return i; return S.length - 1; }
        function pathOf(S, X, Y, i0, i1) { var s = ""; for (var i = i0; i <= i1; i++) s += (i > i0 ? "L" : "M") + X(i).toFixed(1) + " " + Y(S[i][1]).toFixed(1); return s; }
        function draw(p, t, d, ease) { var L = p.getTotalLength(); p.style.strokeDasharray = L + " " + L; tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: d, ease: ease || "power2.inOut" }, t); }
        function fadeIn(e, t, d, y) { tl.fromTo(e, { opacity: 0, y: y == null ? 16 : y }, { opacity: 1, y: 0, duration: d || .35, ease: "power3.out" }, t); return e; }

        // scènes : chacune visible sur son créneau ; fond plein cadre à part (non réduit)
        function scene(t0, t1, bg) {
          var s = div(st, "", "", "sc"); tl.set(s, { opacity: 1 }, t0); tl.set(s, { opacity: 0 }, t1);
          if (bg) { var b = div(bgl, "", "background:" + bg, "full"); tl.set(b, { opacity: 1 }, t0); tl.set(b, { opacity: 0 }, t1); b.sc = s; s.bg = b; }
          return s;
        }
        var FOCAL = "radial-gradient(ellipse 75% 55% at 50% 44%, #ffffff 0%, #f2f3f7 50%, #c3c7d2 100%)", LIGHT = "#eef1f5", NIGHT = "#000b22";

        // ---- graphique boursier « The Economist version FinanceData » : courbe marine, zone de tracé séparée de la gouttière des valeurs ----
        function chart(p, o) {
          var S = window.COURS[o.sym].filter(function (r) { return r[0] >= o.from && r[0] <= o.to; }), n = S.length, W = 888, PW = 760, H = o.H;
          var g = svg(p, 96, o.top, W, H + 70);
          var X = function (i) { return i / (n - 1) * PW; }, Y = function (v) { return H - (v - o.ymin) / (o.ymax - o.ymin) * H; };
          var axis = [];
          o.ticks.forEach(function (v) { axis.push(el(g, "line", { x1: 0, x2: W, y1: Y(v), y2: Y(v), stroke: GRID, "stroke-width": 2 })); axis.push(T(g, W, Y(v) - 12, fr(v, 0) + " $", 30, AX, 500, "end")); });
          axis.push(el(g, "line", { x1: 0, x2: W, y1: H, y2: H, stroke: NAVY, "stroke-width": 3 }));
          o.xt.forEach(function (m) { var x = X(idx(S, m[0])); axis.push(el(g, "line", { x1: x, x2: x, y1: H, y2: H + 14, stroke: NAVY, "stroke-width": 3 })); axis.push(T(g, x + 8, H + 50, m[1], 30, AX, 500)); });
          tl.fromTo(axis, { opacity: 0 }, { opacity: 1, duration: .3 }, o.t);
          var segs = o.segs || [[0, n - 1, NAVY]], lines = [];
          segs.forEach(function (sg, k) {
            var a = typeof sg[0] === "string" ? idx(S, sg[0]) : sg[0], b = typeof sg[1] === "string" ? idx(S, sg[1]) : sg[1];
            var pth = el(g, "path", { d: pathOf(S, X, Y, a, b), fill: "none", stroke: sg[2], "stroke-width": sg[2] === NAVY ? 5 : 8, "stroke-linejoin": "round", "stroke-linecap": "round" });
            lines.push([pth, (b - a) / (n - 1)]);
          });
          var t = o.t + .05; lines.forEach(function (l) { var d = Math.max(.2, o.dur * l[1]); draw(l[0], t, d, "none"); t += d; });
          return { g: g, S: S, X: X, Y: Y, H: H, PW: PW, i: function (dt) { return idx(S, dt); } };
        }
        function note(c, x, y, str, color, anchor, size, w) { return T(c.g, x, y, str, size || 34, color || NAVY, w || 700, anchor || "start"); }
        // l'achat : point vif avec halo, étiquette pleine en bleu FinanceData, jour repéré sous l'axe
        function buy(c, dt, label, t, side, noDay) {
          var i = c.i(dt), x = c.X(i), y = c.Y(c.S[i][1]), g = c.g, parts = [];
          parts.push(el(g, "line", { x1: x, x2: x, y1: y + 18, y2: c.H, stroke: BLUE, "stroke-width": 3, "stroke-dasharray": "8 7" }));
          var halo = el(g, "circle", { cx: x, cy: y, r: 30, fill: BLUE, opacity: .22 }); parts.push(halo);
          parts.push(el(g, "circle", { cx: x, cy: y, r: 15, fill: BLUE, stroke: "#fff", "stroke-width": 4 }));
          if (!noDay) parts.push(T(g, x, c.H + 50, dt.slice(8, 10).replace(/^0/, ""), 30, BLUE, 800, "middle"));
          var tx = T(g, 0, 0, label, 34, "#fff", 700, "start"), w = label.length * 18.6 + 44, bx = side === "right" ? x + 34 : x - 34 - w, by = Math.max(4, y - 96);
          tx.setAttribute("x", bx + 22); tx.setAttribute("y", by + 46);
          var pill = el(g, "rect", { x: bx, y: by, width: w, height: 66, rx: 3, fill: BLUE }); g.insertBefore(pill, tx);
          parts.push(pill, tx);
          tl.fromTo(parts, { opacity: 0 }, { opacity: 1, duration: .25 }, t);
          tl.fromTo(halo, { attr: { r: 15 } }, { attr: { r: 42 }, duration: .9, ease: "power2.out", repeat: 2 }, t);
          return parts;
        }
        var FOCAL = "radial-gradient(ellipse 75% 55% at 50% 44%, #ffffff 0%, #f2f3f7 50%, #c3c7d2 100%)", LIGHT = "#eef1f5", NIGHT = "#000b22";
        function scene(t0, t1, bg) {
          var s = div(st, "", "", "sc"); tl.set(s, { opacity: 1 }, t0); tl.set(s, { opacity: 0 }, t1);
          if (bg) { var b = div(bgl, "", "background:" + bg, "full"); tl.set(b, { opacity: 1 }, t0); tl.set(b, { opacity: 0 }, t1); }
          return s;
        }
        // logos officiels : Amazon (orange), Google (G multicolore), Netflix (rouge)
        var CO = { AMZN: ["Amazon", "NASDAQ: AMZN"], GOOGL: ["Alphabet", "NASDAQ: GOOGL"], NFLX: ["Netflix", "NASDAQ: NFLX"] };
        function logo(sym, size) {
          if (sym === "GOOGL") return "<img src='assets/img/google-g.svg' style='width:" + size + "px; height:" + size + "px; display:block'>";
          var p = sym === "AMZN" ? window.LOGOS.amazon : window.LOGOS.netflix, c = sym === "AMZN" ? "#ff9900" : "#e50914";
          return "<svg width='" + size + "' height='" + size + "' viewBox='0 0 24 24' style='display:block; position:static; flex:none'><path d='" + p + "' fill='" + c + "'/></svg>";
        }
        function header(p, sym, top) { return div(p, "<div style='position:absolute; left:0; top:4px'>" + logo(sym, 84) + "</div><div style='position:absolute; left:112px; top:0; font-size:58px; font-weight:700; letter-spacing:-.05em; line-height:1'>" + CO[sym][0] + "</div><div style='position:absolute; left:112px; top:64px; font-size:34px; font-weight:600; color:#6b7290; letter-spacing:-.02em'>" + CO[sym][1] + "</div>", "left:96px; top:" + top + "px; width:888px; height:100px"); }
        function titled(p, sym, text) { div(p, (sym ? logo(sym, 58) : "") + "<span>" + text + "</span>", "display:flex; align-items:center; gap:22px", "ttl"); }
        function peakOf(sym, from, to) { var S = window.COURS[sym].filter(function (r) { return r[0] >= from && r[0] <= to; }), m = S[0]; S.forEach(function (r) { if (r[1] > m[1]) m = r; }); return m; }
        var LAST = "2026-10-29", MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
        function chute(sym, from, t0, t1, ymin, ymax, ticks, xt) {
          // 1 écran = 1 action : logo, chute depuis le sommet en très grand, courbe du sommet à aujourd'hui
          var s = scene(t0, t1, FOCAL), pk = peakOf(sym, from, LAST);
          fadeIn(header(s, sym, 330), t0, .25, 12);
          var c = chart(s, { sym: sym, from: from, to: LAST, top: 730, H: 420, ymin: ymin, ymax: ymax, ticks: ticks, xt: xt, t: t0, dur: .8, segs: [[0, pk[0], NAVY], [pk[0], LAST, RED]] });
          var last = c.S[c.S.length - 1][1], drop = (pk[1] - last) / pk[1] * 100;
          var pc = div(s, "−0 %", "left:92px; top:470px; font-size:200px; font-weight:700; letter-spacing:-.06em; line-height:1; color:" + RED + "; font-feature-settings:'tnum' 1");
          var o = { v: 0 }; tl.fromTo(o, { v: 0 }, { v: drop, duration: .7, ease: "power2.out", onUpdate: function () { pc.textContent = "−" + fr(o.v, 0) + " %"; } }, t0 + .1);
          tl.fromTo(pc, { opacity: 0 }, { opacity: 1, duration: .12 }, t0 + .05);
          var ip = c.i(pk[0]), d = pk[0].split("-"), lab = "Sommet " + MOIS[+d[1] - 1] + " " + d[0];
          var pd = el(c.g, "circle", { cx: c.X(ip), cy: c.Y(pk[1]), r: 10, fill: "#eef1f5", stroke: NAVY, "stroke-width": 4 });
          var pt = note(c, c.X(ip) + (ip > c.S.length / 2 ? -18 : 18), c.Y(pk[1]) - 22, lab, NAVY, ip > c.S.length / 2 ? "end" : "start", 30);
          var ld = el(c.g, "circle", { cx: c.X(c.S.length - 1), cy: c.Y(last), r: 12, fill: RED, stroke: "#fff", "stroke-width": 4 });
          tl.fromTo([pd, pt], { opacity: 0 }, { opacity: 1, duration: .15 }, t0 + .2); tl.fromTo(ld, { opacity: 0 }, { opacity: 1, duration: .15 }, t0 + .8);
          fadeIn(div(s, "Cours de clôture, en dollars · Source : Yahoo Finance", "top:1262px", "src"), t0 + .1, .2, 0);
          return s;
        }

        // ===== 1. « C'est l'hécatombe » (0 → 1,17) : les trois logos, une flèche rouge sous chacun =====
        (function () {
          var s = scene(0, 1.17, FOCAL);
          ["AMZN", "GOOGL", "NFLX"].forEach(function (sym, k) {
            var x = 96 + k * 316;
            var b = div(s, "<div style='display:flex; justify-content:center'>" + logo(sym, 150) + "</div><div style='margin-top:40px; text-align:center; font-size:110px; font-weight:700; color:" + RED + "; line-height:1'>▼</div>", "left:" + x + "px; top:620px; width:256px");
            tl.fromTo(b, { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: .3, ease: "back.out(2)" }, .05 + k * .1);
            tl.fromTo(b.lastChild, { y: -30 }, { y: 30, duration: .7, ease: "power2.in" }, .35 + k * .1);
          });
        })();

        // ===== 2-4. Amazon, Google, Netflix : la chute depuis le sommet =====
        chute("AMZN", "2025-10-29", 1.17, 2.35, 150, 310, [175, 225, 275], [["2026-01-02", "2026"]]);
        chute("GOOGL", "2025-10-29", 2.35, 3.68, 200, 430, [250, 300, 350, 400], [["2026-01-02", "2026"]]);
        chute("NFLX", "2025-01-02", 3.68, 5.08, 40, 145, [50, 75, 100, 125], [["2025-01-02", "2025"], ["2026-01-02", "2026"]]);

        // ===== 5. Plus de 2 000 milliards envolés (5,08 → 8,09) =====
        (function () {
          var s = scene(5.08, 8.09, FOCAL);
          var row = div(s, ["AMZN", "GOOGL", "NFLX"].map(function (k) { return logo(k, 96); }).join(""), "left:96px; top:420px; display:flex; gap:40px; align-items:center");
          fadeIn(row, 5.1, .3, 12);
          var n = div(s, "−0 Md$", "left:88px; top:600px; font-size:160px; font-weight:700; letter-spacing:-.06em; line-height:1; color:" + RED + "; font-feature-settings:'tnum' 1");
          var o = { v: 0 }; tl.fromTo(o, { v: 0 }, { v: 2000, duration: 1.2, ease: "power3.out", onUpdate: function () { n.textContent = "−" + fr(Math.round(o.v / 10) * 10, 0) + " Md$"; } }, 5.56);
          tl.fromTo(n, { opacity: 0 }, { opacity: 1, duration: .15 }, 5.5);
          var l = div(s, "de valeur en Bourse, depuis leurs sommets", "left:96px; top:810px; font-size:44px; font-weight:700; letter-spacing:-.04em");
          fadeIn(l, 7.0, .3, 12);
          fadeIn(div(s, "Baisse de la capitalisation boursière depuis le sommet de chaque action · Calcul FinanceData d'après Yahoo Finance", "top:1262px; width:888px", "src"), 5.6, .3, 0);
        })();

        // ===== 6. Le S&P 500 à deux doigts de ses records (8,09 → 11,31) =====
        (function () {
          var s = scene(8.09, 11.31, LIGHT);
          titled(s, null, "S&P 500");
          var c = chart(s, { sym: "SPX", from: "2025-10-29", to: LAST, top: 440, H: 700, ymin: 5500, ymax: 8200, ticks: [6000, 6500, 7000, 7500, 8000], xt: [["2026-01-02", "2026"], ["2026-04-01", "avr."], ["2026-07-01", "juil."], ["2026-10-01", "oct."]], t: 8.1, dur: 1.0 });
          var pk = peakOf("SPX", "2025-10-29", LAST), ip = c.i(pk[0]);
          var lvl = el(c.g, "line", { x1: 0, x2: c.PW, y1: c.Y(pk[1]), y2: c.Y(pk[1]), stroke: BLUE, "stroke-width": 3, "stroke-dasharray": "10 8" });
          var rec = note(c, c.X(ip) - 20, c.Y(pk[1]) - 22, "Record · à −1 % aujourd'hui", BLUE, "end", 34);
          var dot = el(c.g, "circle", { cx: c.X(c.S.length - 1), cy: c.Y(c.S[c.S.length - 1][1]), r: 13, fill: BLUE, stroke: "#fff", "stroke-width": 4 });
          tl.fromTo([lvl, rec, dot], { opacity: 0 }, { opacity: 1, duration: .3 }, 10.17);
          fadeIn(div(s, "Clôtures, en points · Source : Yahoo Finance", "top:1262px", "src"), 8.2, .3, 0);
          c.g.querySelectorAll("text").forEach(function (t) { if (/ \$$/.test(t.textContent)) t.textContent = t.textContent.replace(" $", ""); });
        })();

        // ===== 7. Comment c'est possible ? Le tri (11,31 → 15,87) : vraie vidéo =====
        (function () {
          scene(11.31, 15.87, null);
          var veil = div(bgl, "", "background:linear-gradient(180deg, rgba(0,11,34,.3), rgba(0,11,34,.6))", "full");
          tl.set(veil, { opacity: 1 }, 11.31); tl.set(veil, { opacity: 0 }, 15.87);
          tl.fromTo("#v-ws", { scale: 1 }, { scale: 1.08, duration: 4.56, ease: "none" }, 11.31);
          var s = st.lastChild;
          var tri = div(s, "Le tri", "left:96px; top:760px; padding:14px 28px; background:" + BLUE + "; color:#fff; font-size:72px; font-weight:700; letter-spacing:-.05em; border-radius:3px");
          tl.fromTo(tri, { opacity: 0, scale: 1.3, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: .35, ease: "back.out(2)" }, 15.21);
        })();

        // ===== 8. Google : −30 % puis la trésorerie qui passe sous zéro (15,87 → 23,93) =====
        (function () {
          var s = scene(15.87, 18.67, LIGHT);
          titled(s, "GOOGL", "Cours de l'action");
          var pk = peakOf("GOOGL", "2025-10-29", LAST);
          var c = chart(s, { sym: "GOOGL", from: "2025-10-29", to: LAST, top: 440, H: 700, ymin: 200, ymax: 430, ticks: [250, 300, 350, 400], xt: [["2026-01-02", "2026"], ["2026-04-01", "avr."], ["2026-07-01", "juil."], ["2026-10-01", "oct."]], t: 15.9, dur: 1.0 });
          var ip = c.i(pk[0]), n = c.S.length, last = c.S[n - 1][1];
          var br = el(c.g, "path", { d: "M" + c.X(ip) + " " + c.Y(pk[1]) + " H" + (c.PW + 20) + " V" + c.Y(last), fill: "none", stroke: RED, "stroke-width": 3, "stroke-dasharray": "10 8" });
          var a = note(c, 20, c.Y(215), "−" + fr((pk[1] - last) / pk[1] * 100, 0) + " % depuis le sommet", RED, "start", 40);
          tl.fromTo([br, a], { opacity: 0 }, { opacity: 1, duration: .3 }, 17.07);
          fadeIn(div(s, "Cours de clôture, en dollars · Source : Yahoo Finance", "top:1262px", "src"), 16, .3, 0);

          var s2 = scene(18.67, 23.93, LIGHT);
          titled(s2, "GOOGL", "Trésorerie disponible");
          var g = svg(s2, 0, 420, 1080, 860), Y = function (v) { return 60 + (30 - v) / 40 * 640; }, Z = Y(0);
          var axis = [];
          [-10, 0, 10, 20, 30].forEach(function (v) { axis.push(el(g, "line", { x1: 96, x2: 984, y1: Y(v), y2: Y(v), stroke: v ? GRID : NAVY, "stroke-width": v ? 2 : 3 })); axis.push(T(g, 984, Y(v) - 12, String(v).replace("-", "−"), 28, AX, 500, "end")); });
          tl.fromTo(axis, { opacity: 0 }, { opacity: 1, duration: .3 }, 18.7);
          var r1 = el(g, "rect", { x: 190, y: Y(24.5), width: 260, height: Z - Y(24.5), fill: PALE });
          tl.fromTo(r1, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: .5, ease: "power3.out" }, 18.8);
          var v1 = T(g, 320, Y(24.5) - 24, "+24,5", 50, AX, 700, "middle"), l1 = T(g, 320, 800, "T3 2025", 32, AX, 600, "middle");
