        function tag(g, x, y, txt, bg, fg) { var w = txt.length * 17 + 26, gg = el(g, "g", {}); el(gg, "rect", { x: x, y: y - 22, width: w, height: 44, rx: 6, fill: bg }); T(gg, x + w / 2, y + 10, txt, 28, fg || NAVY, 600, "middle"); return gg; }

        // ===== terminal : bougies + panneau RSI(14), révélés de gauche à droite avec curseur =====
        function terminal(s, rows, o) {
          o = o || {}; var id = "c" + (++uid), n = rows.length, PW = 690, W = 800;
          var top = o.top || 0, PH = o.ph || 400, GAP = 56, RH = o.rh || 220, showPrice = o.price !== false;
          var g = svg(s, 0, top, W, (showPrice ? PH + GAP : 0) + RH + 60);
          var defs = el(g, "defs", {}), cp = el(defs, "clipPath", { id: id }), cr = el(cp, "rect", { x: -10, y: -40, width: 0, height: 2000 });
          var X = function (i) { return 10 + i / (n - 1) * (PW - 20); }, cw = Math.max(3, (PW - 20) / n * .62);
          var lo = Math.min.apply(0, rows.map(function (r) { return r[3]; })), hi = Math.max.apply(0, rows.map(function (r) { return r[2]; })), pad = (hi - lo) * .08; lo -= pad; hi += pad;
          var Y = function (v) { return PH - (v - lo) / (hi - lo) * PH; };

          ax.push(el(g, "line", { x1: 0, x2: PW, y1: YR(0), y2: YR(0), stroke: "#ffffff", "stroke-opacity": .12, "stroke-width": 1.5 }));

          var body = el(g, "g", { "clip-path": "url(#" + id + ")" });
          if (showPrice) rows.forEach(function (r, i) {
            var up = r[4] >= r[1], c = up ? UP : DN, x = X(i);

            el(body, "rect", { x: x - cw / 2, y: Y(Math.max(r[1], r[4])), width: cw, height: Math.max(1.5, Math.abs(Y(r[1]) - Y(r[4]))), fill: c });
          });

          var api = { g: g, X: X, Y: Y, YR: YR, n: n, PW: PW, r0: r0, RH: RH, ax: ax, body: body, rows: rows, idx: function (d) { for (var i = 0; i < n; i++) if (rows[i][0] >= d) return i; return n - 1; } };

        // ===== 1. Titre de série (0 → 8,34) : intro animée (vidéo) =====

        // ===== 2. Définition (8,34 → 17,90) : S&P 500, 60 dernières séances, RSI dessous =====
        (function () {

          c.reveal(b, 44.0, 1.6);
          var p0 = rows[a][4], p1 = rows[b][4];
          var ln = el(c.g, "line", { x1: c.X(a), y1: c.Y(p0), x2: c.X(b), y2: c.Y(p1), stroke: DN, "stroke-width": 3, "stroke-dasharray": "8 6" });
          drawIn(ln, 45.2, .45);
          var loss = tag(c.g, c.X(b) - 150, c.Y(p1) + 50, "−" + Math.round((1 - p1 / p0) * 100) + " %", DN, "#fff");
          popIn(loss, 45.69);
          c.hideCursor(45.8);
        })();

        // ===== jauge « compteur de vitesse » =====
        function gauge(s, top, at, target, tNeedle) {
          var g = svg(s, 0, top, 800, 520), cx = 400, cy = 420, R = 330;
          function P(v, r) { var a = Math.PI * (1 - v / 100); return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; }
          function arc(v0, v1, r) { var a = P(v0, r), b = P(v1, r); return "M" + a[0] + " " + a[1] + " A" + r + " " + r + " 0 0 1 " + b[0] + " " + b[1]; }
          var base = el(g, "path", { d: arc(0, 100, R), fill: "none", stroke: "#ffffff", "stroke-opacity": .1, "stroke-width": 26, "stroke-linecap": "butt" });
          var zc = el(g, "path", { d: arc(0, 30, R), fill: "none", stroke: CYAN, "stroke-opacity": .8, "stroke-width": 26 });
          var zr = el(g, "path", { d: arc(70, 100, R), fill: "none", stroke: RED, "stroke-opacity": .85, "stroke-width": 26 });
          var ticks = [];
          for (var v = 0; v <= 100; v += 5) { var a = P(v, R - 30), b = P(v, R - (v % 10 ? 44 : 58)); ticks.push(el(g, "line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: INK, "stroke-opacity": v % 10 ? .35 : .8, "stroke-width": v % 10 ? 2 : 3 })); }
          [0, 30, 50, 70, 100].forEach(function (v) { var p = P(v, R - 92); ticks.push(T(g, p[0], p[1] + 10, String(v), 30, SOFT, 600, "middle")); });
          var nd = el(g, "g", {});
          el(nd, "path", { d: "M" + (cx - 9) + " " + cy + " L" + cx + " " + (cy - R + 70) + " L" + (cx + 9) + " " + cy + " Z", fill: INK });
          el(g, "circle", { cx: cx, cy: cy, r: 22, fill: NAVY, stroke: INK, "stroke-width": 5 });
          var val = T(g, cx, cy + 90, "0", 72, INK, 600, "middle");
          tl.fromTo([base, zc, zr].concat(ticks), { opacity: 0 }, { opacity: 1, duration: .35 }, at);
          drawIn(base, at, .5);
          tl.fromTo(nd, { rotation: -90, svgOrigin: cx + " " + cy }, { rotation: -90 + 180 * target / 100, svgOrigin: cx + " " + cy, duration: 1.1, ease: "back.out(1.3)" }, tNeedle);
          var o = { v: 0 }; tl.fromTo(o, { v: 0 }, { v: target, duration: 1.1, ease: "back.out(1.3)", onUpdate: function () { val.textContent = String(Math.round(o.v)); } }, tNeedle);
          show(val, tNeedle, .2);
          return { g: g, nd: nd, cx: cx, cy: cy, val: val };
        }

        // ===== 6. Bonne lecture (47,50 → 54,65) : compteur de vitesse dans le rouge =====
        (function () {
          var s = scene(47.5, 54.65);
          var G = gauge(s, 160, 47.55, 84, 51.2);
          // petite courbe de tendance qui monte, sous la jauge
          var g = svg(s, 0, 720, 800, 120), pts = [];
          for (var i = 0; i <= 40; i++) pts.push([60 + i * 17, 100 - i * 2 - Math.sin(i * .9) * 8]);
          var ln = el(g, "path", { d: "M" + pts.map(function (p) { return p.join(" "); }).join("L"), fill: "none", stroke: UP, "stroke-width": 4, "stroke-linejoin": "round" });
          drawIn(ln, 52.4, 1.4, "power1.out");
        })();

        // ===== 7. La divergence (54,65 → 63,30) : S&P 500, janv.–fév. 2020 =====
        (function () {
          var s = scene(54.65, 63.3), rows = D.spx20.filter(function (r) { return r[0] <= "2020-03-23"; });
          var c = terminal(s, rows, { top: 60, ph: 400, rh: 220, label: "S&P 500 · quotidien", at: 54.65 });
          var a = c.idx("2020-01-17"), b = c.idx("2020-02-19"), z = c.n - 1;
          c.reveal(b, 54.75, 2.4);
          var lp = el(c.g, "line", { x1: c.X(a), y1: c.Y(rows[a][2]) - 14, x2: c.X(b), y2: c.Y(rows[b][2]) - 14, stroke: UP, "stroke-width": 4 });
          var lr = el(c.g, "line", { x1: c.X(a), y1: c.YR(rows[a][5]) - 10, x2: c.X(b), y2: c.YR(rows[b][5]) - 10, stroke: DN, "stroke-width": 4 });
          var pa = el(c.g, "circle", { cx: c.X(a), cy: c.Y(rows[a][2]) - 14, r: 7, fill: UP }), pb = el(c.g, "circle", { cx: c.X(b), cy: c.Y(rows[b][2]) - 14, r: 7, fill: UP });
          var ra = el(c.g, "circle", { cx: c.X(a), cy: c.YR(rows[a][5]) - 10, r: 7, fill: DN }), rb = el(c.g, "circle", { cx: c.X(b), cy: c.YR(rows[b][5]) - 10, r: 7, fill: DN });
          popIn(pa, 57.5); drawIn(lp, 57.7, .5); popIn(pb, 58.14);
          popIn(ra, 59.0); drawIn(lr, 60.0, .5); popIn(rb, 60.67);
          var up = el(c.g, "path", { d: "M" + (c.X(b) + 22) + " " + (c.Y(rows[b][2]) - 4) + " l14 -22 l14 22", fill: "none", stroke: UP, "stroke-width": 4 });
          var dn = el(c.g, "path", { d: "M" + (c.X(b) + 22) + " " + (c.YR(rows[b][5]) - 26) + " l14 22 l14 -22", fill: "none", stroke: DN, "stroke-width": 4 });
          show(up, 58.3, .2); show(dn, 60.9, .2);
          // la suite : la hausse s'essouffle, puis la chute
          c.reveal(z, 62.0, 1.2); c.hideCursor(63.1);
        })();

        // ===== 8. À retenir (63,30 → 67,30) : compteur de vitesse, pas panneau stop =====
        (function () {
          var s = scene(63.3, 67.3);
          var G = gauge(s, 120, 63.35, 78, 64.9);
          var stop = div(s, "<svg width='150' height='150' viewBox='0 0 100 100'><polygon points='30,2 70,2 98,30 98,70 70,98 30,98 2,70 2,30' fill='" + DN + "'/><text x='50' y='60' font-size='26' font-weight='700' fill='#fff' text-anchor='middle' font-family='Inter UI'>STOP</text><line x1='12' y1='88' x2='88' y2='12' stroke='#fff' stroke-width='8'/></svg>", "left:325px; top:690px; width:150px; height:150px");
          popIn(stop, 66.34);
        })();

        // ===== 9. CTA (67,30 → 69,19) =====
        (function () {
          var t0 = 67.3;
          var av = div(st, "<svg viewBox='0 0 360 360' style='position:absolute; inset:0; width:100%; height:100%'><defs><linearGradient id='gStory' x1='0' y1='1' x2='1' y2='0'><stop offset='0' stop-color='#feda75'/><stop offset='.3' stop-color='#fa7e1e'/><stop offset='.6' stop-color='#d62976'/><stop offset='1' stop-color='#962fbf'/></linearGradient></defs><circle id='ring' cx='180' cy='180' r='170' fill='none' stroke='url(#gStory)' stroke-width='12' transform='rotate(-90 180 180)'/></svg><div class='pic'><img src='assets/img/logo-financedata.png'></div>", "", "");
          av.id = "avatar";
          tl.fromTo(av, { opacity: 0, scale: .85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: .4, ease: "power3.out" }, t0);
          drawIn(document.getElementById("ring"), t0 + .1, .6);
          fadeIn(div(st, "finance_data", "left:0; right:0; top:860px; text-align:center; font-size:72px; font-weight:600; letter-spacing:-.04em; color:#fff"), t0 + .2, .35, 10);
          var btn = div(st, "<span class='b1'>S'abonner</span><span class='b2' style='display:none'>✓ Abonné</span>", "left:0; right:0; margin:auto; width:400px; top:990px; height:100px; line-height:96px; text-align:center; border-radius:10px; background:#0095f6; color:#fff; font-size:44px; font-weight:600; letter-spacing:-.02em; box-shadow:0 18px 40px rgba(0,60,140,.4)");
          tl.fromTo(btn, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .35, ease: "power3.out" }, t0 + .3);
          var tc = 68.3;
          tl.to(btn, { scale: .94, duration: .1 }, tc); tl.to(btn, { scale: 1, duration: .2, ease: "back.out(2)" }, tc + .1);
          tl.to(btn, { backgroundColor: "#363a45", duration: .25 }, tc + .05);
          tl.set(btn.querySelector(".b1"), { display: "none" }, tc + .1); tl.set(btn.querySelector(".b2"), { display: "inline" }, tc + .1);
        })();

        // ===== sous-titres : dès « le RSI », 3 mots max =====
        var W = window.VO.words, groups = [], cur = [];
        W.forEach(function (t, k) { cur.push(t); if (/[,.?:!…]$/.test(t.w) || cur.length >= 3 || !W[k + 1]) { groups.push(cur); cur = []; } });
        var SKIP = [[0, 3.25]];
        groups.forEach(function (gp, k) {
          var t0 = gp[0].s, t1 = k + 1 < groups.length ? groups[k + 1][0].s : END;
          if (SKIP.some(function (r) { return t0 >= r[0] && t0 < r[1]; })) return;
          var txt = gp.map(function (t) { return t.w === "34" ? "34 %" : t.w === "24" ? "24 %" : t.w; }).join(" ");
          var d = div(st, "<span class='cap-box'>" + txt + "</span>", "", "cap-line");
          tl.fromTo(d, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .1, ease: "power2.out" }, Math.max(0, t0 - .06));
          tl.set(d, { opacity: 0 }, Math.min(t1, gp[gp.length - 1].e + .6) - .035);
        });

        tl.set({}, {}, END);
        window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; tl.seek(0);
      })();
    </script>
