<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/vo-words.js"></script>
    <style>
      /* Reel « Les indicateurs pour investir expliqués, partie 1 : le RSI » (69,19 s). DA « data intelligence » FinanceData, minimaliste. */
      @font-face { font-family: "Inter UI"; src: url("assets/fonts/Inter-Regular.otf") format("opentype"); font-weight: 400; }
      @font-face { font-family: "Inter UI"; src: url("assets/fonts/Inter-Medium.otf") format("opentype"); font-weight: 500; }
      @font-face { font-family: "Inter UI"; src: url("assets/fonts/Inter-SemiBold.otf") format("opentype"); font-weight: 600; }
      :root { --bg: #00194b; --ink: #eaf1fb; --soft: #8fa3c7; --cyan: #7dd0f5; --red: #ff2e24; --green: #35d07f; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { width: 1080px; height: 1920px; position: relative; overflow: hidden; font-family: "Inter UI", sans-serif; color: var(--ink); background: var(--bg); font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; }
      #bg-dark { position: absolute; inset: 0; }
      #bg-dark .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 38% at 50% 46%, #0b3480 0%, rgba(0, 25, 75, 0) 72%); }
      #bg-dark .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 48px 48px; background-position: 12px 0;
        -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); }
      #bg-dark .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 65% at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,5,22,.6) 100%); }
      #bg-light { position: absolute; inset: 0; opacity: 0; background: #f6f8fc; }
      #bg-light::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(0,25,75,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0,25,75,.06) 1px, transparent 1px); background-size: 48px 48px; background-position: 12px 0;
        -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); }
      #bg-light::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 65% at 50% 46%, rgba(255,255,255,0) 55%, rgba(0,25,75,.08) 100%); }
      .a { position: absolute; }
      .full { position: absolute; inset: 0; opacity: 0; }
      /* scène : bloc centré dans la zone sûre (x 140–940, y 440–1290) */
      .scene { position: absolute; left: 140px; top: 440px; width: 800px; height: 850px; opacity: 0; text-align: center; color: var(--ink); }
      .scene.light { --ink: #00194b; --soft: #5b6b8a; --cyan: #0b6fd0; --green: #12924f; }
      .title { font-size: 60px; font-weight: 600; letter-spacing: -.035em; line-height: 1.04; white-space: nowrap; }
      .sub { margin-top: 12px; font-size: 26px; color: var(--soft); }
      .kick { font-size: 46px; font-weight: 600; letter-spacing: -.04em; color: var(--ink); text-align: left; }
      .hl { display: inline-block; font-size: 96px; font-weight: 600; letter-spacing: -.05em; line-height: 1; padding: 6px 18px 18px; background: var(--ink); color: var(--bg); }
      .scene.light .hl { color: #fff; }
      .big { font-weight: 600; letter-spacing: -.05em; line-height: 1; white-space: nowrap; }
      .chip { position: absolute; padding: 8px 20px 12px; font-weight: 600; font-size: 40px; letter-spacing: -.03em; white-space: nowrap; opacity: 0; }
      .src { position: absolute; left: 0; right: 0; font-size: 22px; color: var(--soft); }
      svg { position: absolute; overflow: visible; }
      svg text { font-family: "Inter UI", sans-serif; font-feature-settings: "tnum" 1; }
      .ov { position: absolute; left: 0; right: 0; text-align: center; color: #fff; font-weight: 600; letter-spacing: -.045em; line-height: 1.02; text-shadow: 0 2px 24px rgba(0,10,40,.45); }
      /* sous-titres : blanc, fond gris translucide */
      .cap-line { position: absolute; left: 80px; right: 80px; top: 1330px; text-align: center; opacity: 0; }
      .cap-box { display: inline-block; padding: 8px 22px 13px; border-radius: 4px; background: rgba(30,34,42,.74); font-weight: 600; font-size: 54px; line-height: 1.12; letter-spacing: -.045em; word-spacing: -.02em; color: #fff; white-space: nowrap; }
      /* fin */
      #avatar { position: absolute; left: 360px; top: 470px; width: 360px; height: 360px; opacity: 0; }
      #avatar .pic { position: absolute; left: 22px; top: 22px; width: 316px; height: 316px; border-radius: 50%; overflow: hidden; border: 8px solid #00194b; box-shadow: 0 20px 50px rgba(0,5,25,.5); }
      #avatar .pic img { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="69.19" data-width="1080" data-height="1920">
      <audio id="vo" src="assets/voix.mp3" data-start="0" data-duration="69.19" data-track-index="1"></audio>
      <div id="bgs" class="clip" data-start="0" data-duration="69.19" data-track-index="2" style="position:absolute; inset:0">
        <div id="bg-dark"><div class="glow"></div><div class="grid"></div><div class="vig"></div></div>
        <div id="bg-light"></div>
      </div>
      <video id="v-intro" class="clip" src="assets/intro.mp4" data-start="0" data-duration="8.34" data-track-index="3" muted playsinline style="position:absolute; left:0; top:0; width:1080px; height:1920px; object-fit:cover"></video>
      <div id="stage" class="clip" data-start="0" data-duration="69.19" data-track-index="6" style="position:absolute; inset:0"></div>
    </div>
    <script>
      (function () {
        var NS = "http://www.w3.org/2000/svg", tl = gsap.timeline({ paused: true }), END = 69.19;
        var root = document.getElementById("root"), st = document.getElementById("stage"), bgL = document.getElementById("bg-light");
        var INK = "#eaf1fb", SOFT = "#8fa3c7", CYAN = "#7dd0f5", RED = "#ff2e24", GREEN = "#35d07f", NAVY = "#00194b", NSOFT = "#5b6b8a";
        function div(p, html, style, cls) { var d = document.createElement("div"); d.className = cls || "a"; d.innerHTML = html; d.setAttribute("style", style || ""); p.appendChild(d); return d; }
        function el(s, tag, a, text) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; s.appendChild(e); return e; }
        function T(s, x, y, str, size, fill, w, anchor) { return el(s, "text", { x: x, y: y, "font-size": size, fill: fill, "font-weight": w || 500, "text-anchor": anchor || "start", "letter-spacing": "-0.02em" }, str); }
        function svg(p, x, y, w, h) { var g = document.createElementNS(NS, "svg"); g.setAttribute("width", w); g.setAttribute("height", h); g.style.left = x + "px"; g.style.top = y + "px"; p.appendChild(g); return g; }
        function drawIn(n, at, dur, ease) { var L = n.getTotalLength(); n.style.strokeDasharray = L + " " + L; tl.fromTo(n, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.inOut" }, at); }
        function fadeIn(n, at, dur, y) { tl.fromTo(n, { opacity: 0, y: y == null ? 16 : y }, { opacity: 1, y: 0, duration: dur || .45, ease: "power2.out" }, at); return n; }
        function popIn(n, at) { tl.fromTo(n, { opacity: 0, scale: .85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: .35, ease: "back.out(2)" }, at); return n; }
        function count(e, t, d, v0, v1, f) { var o = { v: v0 }; tl.fromTo(o, { v: v0 }, { v: v1, duration: d, ease: "power3.out", onUpdate: function () { e.textContent = f(o.v); } }, t); }
        function scene(t0, t1, mode) {
          var s = div(st, "", "", "scene" + (mode === "light" ? " light" : ""));
          tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: .25, ease: "power1.out" }, t0); tl.set(s, { opacity: 0 }, t1);
          if (mode === "light") { tl.set(bgL, { opacity: 1 }, t0); tl.set(bgL, { opacity: 0 }, t1); }
          return s;
        }
        function path(pts) { return "M" + pts.map(function (p) { return p[0].toFixed(1) + " " + p[1].toFixed(1); }).join("L"); }

        // ===== 1. Titre de série (0 → 8,34) : l'intro animée (vidéo) =====

        // ===== 2. Définition (8,34 → 17,90) : un prix, ses 14 dernières variations, une note sur 100 =====
        (function () {
          var s = scene(8.34, 17.9, "dark");
          // prix (exemple) : 40 séances
          var P = [100, 101.2, 100.6, 102.1, 103.4, 102.8, 104.2, 105.1, 104.3, 103.6, 104.9, 106.3, 107.0, 106.2, 107.8, 109.1, 108.4, 107.5, 108.9, 110.4, 111.2, 110.1, 109.4, 110.8, 112.3, 113.1, 112.2, 113.8, 115.0, 114.1, 113.2, 114.6, 116.1, 117.3, 116.4, 117.9, 119.2, 118.5, 120.1, 121.4];
          var n = P.length, X = function (i) { return 20 + i / (n - 1) * 760; }, Y = function (v) { return 330 - (v - 98) / 25 * 300; };
          var g = svg(s, 0, 40, 800, 360);
          var pts = P.map(function (v, i) { return [X(i), Y(v)]; });
          var ln = el(g, "path", { d: path(pts), fill: "none", stroke: INK, "stroke-width": 4, "stroke-linejoin": "round", "stroke-linecap": "round" });
          drawIn(ln, 8.4, 1.6, "power1.inOut");
          var dot = el(g, "circle", { cx: X(n - 1), cy: Y(P[n - 1]), r: 9, fill: INK });
          tl.fromTo(dot, { opacity: 0 }, { opacity: 1, duration: .2 }, 9.9);
          // les 14 dernières séances : crochet cyan au-dessus de la courbe
          var x0 = X(n - 15), x1 = X(n - 1);
          var br = el(g, "path", { d: "M" + x0 + " 18 V4 H" + x1 + " V18", fill: "none", stroke: CYAN, "stroke-width": 3 });
          var bl = T(g, (x0 + x1) / 2, -14, "14 séances", 30, CYAN, 600, "middle");
          var sh = el(g, "rect", { x: x0, y: 20, width: x1 - x0, height: 320, fill: CYAN, "fill-opacity": .08 });
          g.insertBefore(sh, g.firstChild);
          tl.fromTo([br, bl, sh], { opacity: 0 }, { opacity: 1, duration: .3 }, 13.94);
          // barres des variations : hausses en vert, baisses en rouge
          var B = svg(s, 0, 440, 800, 300), up = [], dn = [], gain = 0, loss = 0;
          var bw = 760 / 14 - 10;
          el(B, "line", { x1: 20, x2: 780, y1: 150, y2: 150, stroke: SOFT, "stroke-width": 1.5, opacity: .5 });
          for (var k = 0; k < 14; k++) {
            var ch = P[n - 14 + k] - P[n - 15 + k], h = Math.abs(ch) * 70, x = 20 + k * (760 / 14) + 5;
            var r = el(B, "rect", { x: x, y: ch >= 0 ? 150 - h : 150, width: bw, height: h, fill: ch >= 0 ? GREEN : RED, rx: 2 });
            (ch >= 0 ? up : dn).push(r); if (ch >= 0) gain += ch; else loss -= ch;
          }
          tl.fromTo(up, { scaleY: 0, transformOrigin: "50% 100%", transformBox: "fill-box" }, { scaleY: 1, duration: .35, stagger: .04, ease: "power3.out" }, 12.74);
          tl.fromTo(dn, { scaleY: 0, transformOrigin: "50% 0%", transformBox: "fill-box" }, { scaleY: 1, duration: .35, stagger: .05, ease: "power3.out" }, 13.38);
          // la note sur 100
          var RSI = 100 * gain / (gain + loss);
          tl.to(B, { opacity: 0, y: -20, duration: .3 }, 15.4);
          var big = div(s, "0", "left:0; right:0; top:450px; font-size:200px; color:" + INK, "a big");
          tl.fromTo(big, { opacity: 0, scale: 1.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: .3, ease: "power3.out" }, 15.54);
          count(big, 15.54, 1.0, 0, RSI, function (x) { return String(Math.round(x)); });
          var sc = svg(s, 0, 720, 800, 120);
          var bar = el(sc, "rect", { x: 40, y: 40, width: 720, height: 10, rx: 5, fill: SOFT, "fill-opacity": .35 });
          var fill = el(sc, "rect", { x: 40, y: 40, width: 720 * RSI / 100, height: 10, rx: 5, fill: CYAN });
          var l0 = T(sc, 40, 100, "0", 34, SOFT, 600, "middle"), l100 = T(sc, 760, 100, "100", 34, SOFT, 600, "middle");
          tl.fromTo(bar, { opacity: 0 }, { opacity: 1, duration: .25 }, 16.4);
          tl.fromTo(fill, { scaleX: 0, transformOrigin: "0% 50%", transformBox: "fill-box" }, { scaleX: 1, duration: .8, ease: "power3.out" }, 16.5);
          tl.fromTo(l0, { opacity: 0 }, { opacity: 1, duration: .2 }, 16.98); tl.fromTo(l100, { opacity: 0 }, { opacity: 1, duration: .2 }, 17.68);
        })();

        // ===== 3. 70 / 30 (17,90 → 24,4) : la courbe du RSI et ses deux zones =====
        (function () {
          var s = scene(17.9, 24.4, "dark");
          var R = [55, 61, 66, 72, 77, 81, 78, 74, 69, 63, 57, 51, 45, 40, 34, 28, 24, 22, 26, 31, 38, 45, 52, 58, 63, 68, 73, 76, 72, 66];
          var n = R.length, X = function (i) { return 20 + i / (n - 1) * 720; }, Y = function (v) { return 600 - v * 6; };
          var g = svg(s, 0, 100, 800, 620);
          var zH = el(g, "rect", { x: 0, y: Y(100), width: 800, height: Y(70) - Y(100), fill: RED, "fill-opacity": .12 });
          var zL = el(g, "rect", { x: 0, y: Y(30), width: 800, height: Y(0) - Y(30), fill: CYAN, "fill-opacity": .12 });
          var h70 = el(g, "line", { x1: 0, x2: 800, y1: Y(70), y2: Y(70), stroke: RED, "stroke-width": 2.5, "stroke-dasharray": "10 8" });
          var h30 = el(g, "line", { x1: 0, x2: 800, y1: Y(30), y2: Y(30), stroke: CYAN, "stroke-width": 2.5, "stroke-dasharray": "10 8" });
          var t70 = T(g, 800, Y(70) - 14, "70", 44, RED, 600, "end"), t30 = T(g, 800, Y(30) + 50, "30", 44, CYAN, 600, "end");
          var ln = el(g, "path", { d: path(R.map(function (v, i) { return [X(i), Y(v)]; })), fill: "none", stroke: INK, "stroke-width": 4, "stroke-linejoin": "round" });
          drawIn(ln, 17.95, 1.2, "power1.inOut");
          tl.fromTo([zH, h70, t70], { opacity: 0 }, { opacity: 1, duration: .3 }, 18.4);
          tl.fromTo([zL, h30, t30], { opacity: 0 }, { opacity: 1, duration: .3 }, 22.37);
          var r1 = el(g, "circle", { cx: X(5), cy: Y(81), r: 20, fill: "none", stroke: RED, "stroke-width": 4 });
          var r2 = el(g, "circle", { cx: X(17), cy: Y(22), r: 20, fill: "none", stroke: CYAN, "stroke-width": 4 });
          drawIn(r1, 20.12, .35); drawIn(r2, 23.29, .35);
        })();

        // ===== sous-titres : 3 mots max =====
        var W = window.VO.words, groups = [], cur = [];
        W.forEach(function (t, k) { cur.push(t); if (/[,.?:!…]$/.test(t.w) || cur.length >= 3 || !W[k + 1]) { groups.push(cur); cur = []; } });
        var SKIP = [[0, 8.3]];
        groups.forEach(function (gp, k) {
          var t0 = gp[0].s, t1 = k + 1 < groups.length ? groups[k + 1][0].s : END;
          if (SKIP.some(function (r) { return t0 >= r[0] && t0 < r[1]; })) return;
          var d = div(st, "<span class='cap-box'>" + gp.map(function (t) { return t.w; }).join(" ") + "</span>", "", "cap-line");
          tl.fromTo(d, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .1, ease: "power2.out" }, Math.max(0, t0 - .06));
          tl.set(d, { opacity: 0 }, Math.min(t1, gp[gp.length - 1].e + .6) - .035);
        });

        tl.set({}, {}, END);
        window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; tl.seek(0);
      })();
    </script>
  </body>
</html>
