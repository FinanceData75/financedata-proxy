<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ---------- FinanceData palette ----------
const C = {
  navy: '#00194b', navyDeep: '#000c26', navyMid: '#0a2a6e',
  tileTop: '#ffffff', tileBot: '#dfe7f7', ink: '#00194b',
  pill: '#06173f', pillBorder: 'rgba(140,170,230,0.28)', pillLabel: '#8fa6d6',
  blue: '#4d8bff', red: '#ff5a5f', green: '#2ecc8f', white: '#ffffff',
};
const W = 1080, H = 1920, DUR = 9.0;
const cv = document.getElementById('c'), x = cv.getContext('2d');

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const backOut = t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function fadeWin(t, a, b, f = .25) { return Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b)); }

function rr(px, py, w, h, r) { x.beginPath(); x.roundRect(px, py, w, h, r); }

function bg(t, dark) {
  const g = x.createRadialGradient(W / 2, H * 0.42, 60, W / 2, H * 0.42, H * 0.75);
  g.addColorStop(0, dark ? '#020a1f' : C.navyMid);
  g.addColorStop(0.55, dark ? '#01061a' : C.navy);
  g.addColorStop(1, '#000716');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // subtle grid
  x.save(); x.globalAlpha = dark ? 0.0 : 0.05; x.strokeStyle = '#8fb0ff'; x.lineWidth = 1;
  for (let gx = 0; gx <= W; gx += 90) { x.beginPath(); x.moveTo(gx, 0); x.lineTo(gx, H); x.stroke(); }
  for (let gy = 0; gy <= H; gy += 90) { x.beginPath(); x.moveTo(0, gy); x.lineTo(W, gy); x.stroke(); }
  x.restore();
}

// Raised tile: white/ice gradient, navy icon + label (FinanceData take on the gold tiles)
function tile(cx, cy, w, h, label, icon, alpha = 1, scale = 1) {
  if (alpha <= 0) return;
  x.save(); x.globalAlpha = alpha; x.translate(cx, cy); x.scale(scale, scale);
  const r = h * 0.12;
  x.shadowColor = 'rgba(0,0,0,0.55)'; x.shadowBlur = 40; x.shadowOffsetY = 18;
  const g = x.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, C.tileTop); g.addColorStop(1, C.tileBot);
  rr(-w / 2, -h / 2, w, h, r); x.fillStyle = g; x.fill();
  x.shadowColor = 'transparent';
  // bevel highlight + bottom edge
  rr(-w / 2 + 3, -h / 2 + 3, w - 6, h - 6, r - 2); x.strokeStyle = 'rgba(255,255,255,0.9)'; x.lineWidth = 3; x.stroke();
  x.beginPath(); x.moveTo(-w / 2 + r, h / 2 - 2); x.lineTo(w / 2 - r, h / 2 - 2);
  x.strokeStyle = 'rgba(0,25,75,0.25)'; x.lineWidth = 4; x.stroke();
  // icon
  const s = h * 0.36;
  icon && icon(0, -h * 0.1, s);
  // label
  x.fillStyle = C.ink; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = `800 ${Math.round(h * 0.17)}px Inter`;
  x.fillText(label, 0, h * 0.3);
  x.restore();
}

// Icons (navy, filled)
function iconGauge(cx, cy, s, needle = 0.78) {
  x.save(); x.translate(cx, cy + s * 0.25);
  x.lineCap = 'round';
  const R = s * 0.9;
  // three zones
  const seg = [[Math.PI, Math.PI * 1.3, C.green], [Math.PI * 1.3, Math.PI * 1.7, C.ink], [Math.PI * 1.7, Math.PI * 2, C.red]];
  x.lineWidth = s * 0.22;
  for (const [a, b, col] of seg) { x.beginPath(); x.arc(0, 0, R, a + 0.06, b - 0.06); x.strokeStyle = col; x.stroke(); }
  const ang = Math.PI + Math.PI * needle;
  x.strokeStyle = C.ink; x.lineWidth = s * 0.12;
  x.beginPath(); x.moveTo(0, 0); x.lineTo(Math.cos(ang) * R * 0.78, Math.sin(ang) * R * 0.78); x.stroke();
  x.fillStyle = C.ink; x.beginPath(); x.arc(0, 0, s * 0.15, 0, Math.PI * 2); x.fill();
  x.restore();
}
function iconCandles(cx, cy, s) {
  x.save(); x.translate(cx, cy); x.fillStyle = C.ink; x.strokeStyle = C.ink; x.lineWidth = s * 0.07;
  const cs = [[-0.6, 0.3, 0.55], [-0.2, -0.05, 0.6], [0.2, -0.35, 0.5], [0.6, -0.6, 0.55]];
  for (const [dx, dy, hh] of cs) {
    x.beginPath(); x.moveTo(dx * s, (dy - hh * 0.75) * s); x.lineTo(dx * s, (dy + hh * 0.75) * s); x.stroke();
    rr(dx * s - s * 0.13, (dy - hh / 2) * s, s * 0.26, hh * s, s * 0.04); x.fill();
  }
  x.restore();
}
function iconPrice(cx, cy, s) {
  x.save(); x.translate(cx, cy); x.strokeStyle = C.ink; x.lineWidth = s * 0.14; x.lineJoin = 'round'; x.lineCap = 'round';
  x.beginPath(); x.moveTo(-s * 0.9, s * 0.5); x.lineTo(-s * 0.35, -s * 0.05); x.lineTo(s * 0.05, s * 0.25); x.lineTo(s * 0.8, -s * 0.55); x.stroke();
  x.beginPath(); x.moveTo(s * 0.4, -s * 0.6); x.lineTo(s * 0.85, -s * 0.6); x.lineTo(s * 0.85, -s * 0.15); x.stroke();
  x.restore();
}

// Dark pill (label + value), like the reference's chocolate badges, in navy
function pill(cx, cy, label, value, alpha = 1, accent = C.white, scale = 1, w = 300) {
  if (alpha <= 0) return;
  x.save(); x.globalAlpha = alpha; x.translate(cx, cy); x.scale(scale, scale);
  const h = 128;
  x.shadowColor = 'rgba(0,0,0,0.5)'; x.shadowBlur = 24; x.shadowOffsetY = 10;
  rr(-w / 2, -h / 2, w, h, 22); x.fillStyle = C.pill; x.fill();
  x.shadowColor = 'transparent';
  x.strokeStyle = C.pillBorder; x.lineWidth = 2.5; x.stroke();
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = C.pillLabel; x.font = '700 26px Inter'; x.fillText(label, 0, -h * 0.2);
  x.fillStyle = accent; x.font = '800 50px Inter'; x.fillText(value, 0, h * 0.17);
  x.restore();
}

function subtitle(text, alpha) {
  if (alpha <= 0) return;
  x.save(); x.globalAlpha = alpha; x.fillStyle = C.white; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '500 40px Inter';
  // wrap
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const tst = cur ? cur + ' ' + w : w; if (x.measureText(tst).width > 820) { lines.push(cur); cur = w; } else cur = tst; }
  lines.push(cur);
  lines.forEach((l, i) => x.fillText(l, W / 2, 1530 + i * 54));
  x.restore();
}

// ---------- data: price + real RSI(14) ----------
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const r = rng(97), N_WARM = 20, N = 60, PEAK = 34;
const prices = []; let p = 100;
for (let i = 0; i < N_WARM + N; i++) {
  const k = i - N_WARM;
  let drift;
  if (k < 16) drift = (r() - 0.5) * 3;
  else if (k <= PEAK) drift = 0.9 + (r() - 0.5) * 3.2;
  else drift = -0.7 + (r() - 0.5) * 3;
  p += drift; prices.push(p);
}
function rsiSeries(pr, n = 14) {
  const out = []; let ag = 0, al = 0;
  for (let i = 1; i < pr.length; i++) {
    const d = pr[i] - pr[i - 1], g = Math.max(d, 0), l = Math.max(-d, 0);
    if (i <= n) { ag += g / n; al += l / n; out.push(null); continue; }
    ag = (ag * (n - 1) + g) / n; al = (al * (n - 1) + l) / n;
    out.push(100 - 100 / (1 + ag / (al || 1e-9)));
  }
  out.unshift(null); return out;
}
const rsiAll = rsiSeries(prices);
const P = prices.slice(N_WARM), R = rsiAll.slice(N_WARM);
// peak of RSI near price peak
let rsiPeakIdx = 0; for (let i = 0; i <= PEAK + 2; i++) if (R[i] != null) if (R[i] > R[rsiPeakIdx]) rsiPeakIdx = i;
const pMin = Math.min(...P), pMax = Math.max(...P);

// chart layout
const CH = { x0: 110, x1: 970, py0: 560, py1: 960, ry0: 1090, ry1: 1390 };
const px = i => lerp(CH.x0, CH.x1, i / (N - 1));
const py = v => lerp(CH.py1, CH.py0, (v - pMin) / (pMax - pMin));
const ry = v => lerp(CH.ry1, CH.ry0, v / 100);

function drawLine(arr, ymap, upto, color, width, glow) {
  x.save(); x.strokeStyle = color; x.lineWidth = width; x.lineJoin = 'round'; x.lineCap = 'round';
  if (glow) { x.shadowColor = color; x.shadowBlur = 18; }
  x.beginPath(); let started = false;
  const last = Math.floor(upto), frac = upto - last;
  for (let i = 0; i <= Math.min(last, N - 1); i++) {
    if (arr[i] == null) continue;
    const X = px(i), Y = ymap(arr[i]);
    started ? x.lineTo(X, Y) : x.moveTo(X, Y); started = true;
  }
  if (last < N - 1 && arr[last] != null && arr[last + 1] != null && frac > 0) {
    x.lineTo(lerp(px(last), px(last + 1), frac), lerp(ymap(arr[last]), ymap(arr[last + 1]), frac));
  }
  x.stroke(); x.restore();
}
function headPoint(arr, ymap, upto) {
  const last = Math.min(Math.floor(upto), N - 2), f = clamp(upto - last);
  return [lerp(px(last), px(last + 1), f), lerp(ymap(arr[last]), ymap(arr[last + 1]), f)];
}
function ball(X, Y, color, a = 1) {
  x.save(); x.globalAlpha = a; x.shadowColor = color; x.shadowBlur = 30;
  x.fillStyle = color; x.beginPath(); x.arc(X, Y, 13, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#fff'; x.beginPath(); x.arc(X - 4, Y - 4, 4.5, 0, Math.PI * 2); x.fill();
  x.restore();
}

// ---------- timeline ----------
const T = { intro: [0, 1.5], big: [1.5, 3.7], chart: [3.7, 9.0] };
const DRAW_A = 4.1, DRAW_B = 8.6;            // line drawing window
const drawIdx = t => (N - 1) * easeInOut(prog(t, DRAW_A, DRAW_B));
// time at which the RSI peak gets drawn (inverse of easeInOut, numeric)
let tPeak = DRAW_A; for (let tt = DRAW_A; tt < DRAW_B; tt += 0.005) { if (drawIdx(tt) >= rsiPeakIdx) { tPeak = tt; break; } }

const SUBS = [
  [1.65, 3.6, "Le RSI, c'est le thermomètre d'une action."],
  [3.85, 5.1, "Il va de 0 à 100."],
  [5.15, tPeak + 0.05, "Plus le prix monte vite, plus il chauffe."],
  [tPeak + 0.1, 7.75, "Au-dessus de 70 : l'action est en surchauffe."],
  [7.8, 9.0, "Mais faut-il vendre pour autant ?"],
];

function render(t) {
  x.clearRect(0, 0, W, H);
  const introA = 1 - prog(t, 1.25, 1.55);
  bg(t, false);
  if (introA > 0) { x.save(); x.globalAlpha = introA; bg(t, true); x.restore(); }

  // ---- Intro card: series title (mirrors the "Partie 1 : La holding" opener)
  if (t < 1.6) {
    const a = Math.min(prog(t, 0.0, 0.35), introA);
    const s = lerp(0.85, 1, backOut(prog(t, 0, 0.6)));
    tile(W / 2, 760, 300, 260, 'BOURSE', iconCandles, a, s);
    x.save(); x.globalAlpha = Math.min(prog(t, 0.25, 0.6), introA); x.textAlign = 'center';
    x.fillStyle = C.pillLabel; x.font = '600 34px Inter';
    x.fillText('LES INDICATEURS TECHNIQUES EXPLIQUÉS', W / 2, 1010);
    x.fillStyle = C.white; x.font = '800 76px Inter';
    x.fillText('Partie 1 : Le RSI', W / 2, 1110);
    x.restore();
  }

  // ---- Big RSI tile, then it shrinks to the top
  if (t >= 1.45) {
    const aIn = prog(t, 1.45, 1.75);
    const grow = backOut(prog(t, 1.45, 2.0));
    const mv = easeInOut(prog(t, 3.65, 4.25));
    const cy = lerp(860, 300, mv), w = lerp(480, 300, mv), h = lerp(400, 250, mv);
    const needle = lerp(0.5, 0.82, easeInOut(prog(t, 2.2, 3.3)));
    tile(W / 2, cy, w, h, 'RSI', (a, b, s) => iconGauge(a, b, s, needle), aIn, lerp(0.6, 1, grow));
  }

  // ---- Chart phase
  if (t >= 3.8) {
    const aPanel = easeOut(prog(t, 3.8, 4.3));
    x.save(); x.globalAlpha = aPanel;
    // panel labels (small tiles' little brothers)
    x.textAlign = 'left'; x.textBaseline = 'middle'; x.font = '800 30px Inter'; x.fillStyle = C.pillLabel;
    x.fillText('PRIX', CH.x0, CH.py0 - 50);
    x.fillText('RSI', CH.x0, CH.ry0 - 50);
    // baselines
    x.strokeStyle = 'rgba(140,170,230,0.18)'; x.lineWidth = 2;
    x.beginPath(); x.moveTo(CH.x0, CH.py1 + 20); x.lineTo(CH.x1, CH.py1 + 20); x.stroke();
    // RSI box
    rr(CH.x0 - 10, CH.ry0 - 10, CH.x1 - CH.x0 + 20, CH.ry1 - CH.ry0 + 20, 16);
    x.fillStyle = 'rgba(0,10,35,0.55)'; x.fill(); x.strokeStyle = 'rgba(140,170,230,0.18)'; x.stroke();
    x.restore();

    // 0 / 100 scale (appears with "Il va de 0 à 100")
    const aScale = easeOut(prog(t, 3.95, 4.4));
    x.save(); x.globalAlpha = aScale; x.textAlign = 'right'; x.font = '700 26px Inter'; x.fillStyle = C.pillLabel;
    x.fillText('100', CH.x0 - 22, CH.ry0 + 4); x.fillText('0', CH.x0 - 22, CH.ry1 - 4);
    x.restore();

    // 70 / 30 zones
    const aZones = easeOut(prog(t, 4.4, 4.9));
    const hot = easeOut(prog(t, tPeak, tPeak + 0.4));
    x.save(); x.globalAlpha = aZones;
    x.fillStyle = `rgba(255,90,95,${0.08 + 0.17 * hot})`; x.fillRect(CH.x0, ry(100), CH.x1 - CH.x0, ry(70) - ry(100));
    x.fillStyle = 'rgba(46,204,143,0.08)'; x.fillRect(CH.x0, ry(30), CH.x1 - CH.x0, ry(0) - ry(30));
    x.setLineDash([12, 12]); x.lineWidth = 3;
    x.strokeStyle = C.red; x.beginPath(); x.moveTo(CH.x0, ry(70)); x.lineTo(CH.x1, ry(70)); x.stroke();
    x.strokeStyle = C.green; x.beginPath(); x.moveTo(CH.x0, ry(30)); x.lineTo(CH.x1, ry(30)); x.stroke();
    x.setLineDash([]); x.textAlign = 'left'; x.font = '800 28px Inter';
    x.fillStyle = C.red; x.fillText('70', CH.x1 + 14, ry(70) + 2);
    x.fillStyle = C.green; x.fillText('30', CH.x1 + 14, ry(30) + 2);
    x.restore();

    // lines
    const di = drawIdx(t);
    if (di > 0) {
      drawLine(P, py, di, C.white, 6, false);
      const firstR = R.findIndex(v => v != null);
      if (di > firstR) drawLine(R, ry, di, C.blue, 5, true);
      const [bx, by] = headPoint(P, py, di);
      const [rx, ryy] = headPoint(R, ry, Math.max(di, firstR));
      const rv = R[Math.min(Math.round(di), N - 1)];
      const col = rv > 70 ? C.red : (rv < 30 ? C.green : C.blue);
      if (di < N - 1.01) { ball(bx, by, '#ffffff'); ball(rx, ryy, col); }
    }

    // Peak callout: "SURACHAT / RSI 7x" pill + marker
    const aPk = prog(t, tPeak, tPeak + 0.3);
    if (aPk > 0) {
      const pX = px(rsiPeakIdx), pY = ry(R[rsiPeakIdx]), pP = py(P[rsiPeakIdx]);
      const pop = backOut(aPk);
      // ring on price peak
      x.save(); x.globalAlpha = aPk; x.strokeStyle = C.red; x.lineWidth = 4;
      x.beginPath(); x.arc(pX, pP, 26 + 6 * Math.sin(t * 6), 0, Math.PI * 2); x.stroke();
      x.beginPath(); x.arc(pX, pY, 20, 0, Math.PI * 2); x.stroke();
      // connector between the two panels
      x.setLineDash([8, 10]); x.globalAlpha = aPk * 0.7; x.beginPath(); x.moveTo(pX, pP + 30); x.lineTo(pX, pY - 24); x.stroke();
      x.restore();
      pill(pX - 250, pP + 10, 'SURACHAT', 'RSI ' + Math.round(R[rsiPeakIdx]), aPk, C.red, lerp(0.6, 1, pop), 290);
    }

    // final tension: question badge
    const aQ = prog(t, 7.85, 8.15);
    if (aQ > 0) pill(Math.min(W - 180, px(rsiPeakIdx) + 250), py(P[rsiPeakIdx]) + 10, 'SIGNAL', 'VENDRE ?', aQ, C.white, lerp(0.6, 1, backOut(aQ)), 300);
  }

  // ---- subtitles
  for (const [a, b, s] of SUBS) { const al = fadeWin(t, a, b, 0.15); if (al > 0) subtitle(s, al); }

  // watermark
  x.save(); x.globalAlpha = 0.55 * (1 - introA * 0.4); x.fillStyle = C.white; x.textAlign = 'center';
  x.font = '700 28px Inter'; x.fillText('FinanceData', W / 2, 1800); x.restore();
}
window.render = render; window.DUR = DUR;
window.info = { rsiPeak: R[rsiPeakIdx], rsiPeakIdx, tPeak };
render(parseFloat(new URLSearchParams(location.search).get('t') || '0'));
</script>
</body></html>
