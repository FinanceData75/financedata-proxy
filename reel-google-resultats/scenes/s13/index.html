<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/gemini.js"></script>
    <style>
      /* Scène 13 (54,06 → 58,50 s) « Alors l'IA rapportera-t-elle assez pour justifier ces milliards ? C'est justement là toute la question ».
         Portrait noir et blanc de Sundar Pichai (lente poussée), carte blanche à angles droits comme la scène 1 :
         vrai logo Gemini, puis la question « Rentable ? » en bleu FinanceData, seule couleur. */
      @font-face { font-family: "Display"; src: url("assets/fonts/inter-display-latin-var.woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000b22; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000b22; color: #0a105e; font-family: "Display", sans-serif; font-variation-settings: "opsz" 32; -webkit-font-smoothing: antialiased; }
      .a { position: absolute; }
      .cap { position: absolute; left: 0; right: 0; text-align: center; opacity: 0; }
      .cap span { display: inline-block; font-family: "Display"; font-variation-settings: "opsz" 32; font-weight: 700; font-size: 66px; letter-spacing: -.055em; word-spacing: .02em; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.35), 0 6px 24px rgba(0,0,0,.45); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.44" data-width="1080" data-height="1920">
      <audio id="vo" src="assets/voix.mp3" data-start="0" data-duration="4.44" data-track-index="1"></audio>
      <div id="stage" class="clip" data-start="0" data-duration="4.44" data-track-index="0" style="position:absolute; inset:0"></div>
    </div>
    <script>
      (function () {
        var tl = gsap.timeline({ paused: true }), st = document.getElementById("stage"), BLUE = "#3d5afe";
        function div(p, html, style, cls) { var d = document.createElement("div"); d.className = cls || "a"; d.innerHTML = html; d.setAttribute("style", style); p.appendChild(d); return d; }

        // portrait : lente poussée, voile bleu nuit en bas pour la carte et les sous-titres
        var ph = div(st, "<img src='assets/img/pichai-nb.jpg' style='width:100%; height:100%; display:block; object-fit:cover'>", "inset:0");
        tl.fromTo(ph, { scale: 1 }, { scale: 1.06, transformOrigin: "40% 30%", duration: 4.44, ease: "none" }, 0);
        div(st, "", "inset:0; background:linear-gradient(180deg, rgba(0,11,34,0) 45%, rgba(0,11,34,.6) 100%)");

        // carte blanche : Gemini, puis la question sur « ces milliards »
        var gem = "<svg width='80' height='80' viewBox='0 0 24 24'><defs><linearGradient id='gem' x1='0' y1='1' x2='1' y2='0'><stop offset='0' stop-color='#4796e3'/><stop offset='.6' stop-color='#9177c7'/><stop offset='1' stop-color='#d96570'/></linearGradient></defs><path d='" + window.GEMINI + "' fill='url(#gem)'/></svg>";
        var card = div(st, "<div style='position:absolute; left:48px; top:44px'>" + gem + "</div>" +
          "<div style='position:absolute; left:156px; top:40px; font-size:52px; font-weight:700; letter-spacing:-.055em; line-height:1'>Gemini</div>" +
          "<div style='position:absolute; left:156px; top:100px; font-size:32px; font-weight:600; color:#6b7290; letter-spacing:-.02em'>L'IA de Google</div>" +
          "<div class='q' style='position:absolute; left:44px; top:168px; font-size:100px; font-weight:700; letter-spacing:-.06em; line-height:1; color:" + BLUE + "; opacity:0'>Rentable ?</div>",
          "left:60px; top:990px; width:620px; height:300px; background:#fff; border-radius:4px; box-shadow:0 18px 50px rgba(0,11,34,.3)");
        tl.fromTo(card, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .45, ease: "power3.out" }, .3);
        tl.fromTo(card.querySelector(".q"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .35, ease: "power3.out" }, 2.4);

        // sous-titres (3 mots max)
        [["Alors l'IA", 0, .68], ["rapportera-t-elle assez", .68, 1.84], ["pour justifier", 1.84, 2.40], ["ces milliards ?", 2.40, 3.02], ["C'est justement là", 3.02, 3.68], ["toute la question.", 3.68, 4.44]].forEach(function (c) {
          var d = div(st, "<span>" + c[0] + "</span>", "top:1335px", "cap");
          tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: .06 }, c[1]); tl.set(d, { opacity: 0 }, c[2] - .02);
        });
        tl.set({}, {}, 4.44);
        window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; tl.seek(0);
      })();
    </script>
  </body>
</html>
