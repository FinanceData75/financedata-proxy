<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Scène 7 (22,86 → 30,56 s) « Aujourd'hui, Google construit des data centers… plus de 50 milliards en trois mois… l'an prochain, ce sera encore plus ».
         Même graphique que la scène 2 : fond #EEF1F5, titre en haut à gauche, quadrillage léger, axe à droite, colonnes à angles droits.
         T3 2025 en gris, T3 2026 en bleu FinanceData (×2), puis une colonne en pointillés pour 2027. Période, unité et source sous le graphique. */
      @font-face { font-family: "Display"; src: url("assets/fonts/inter-display-latin-var.woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #eef1f5; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #eef1f5; color: #0a105e; font-family: "Display", sans-serif; font-variation-settings: "opsz" 32; -webkit-font-smoothing: antialiased; }
      .a { position: absolute; }
      svg { position: absolute; overflow: visible; }
      svg text { font-family: "Display"; font-variation-settings: "opsz" 32; font-feature-settings: "tnum" 1; letter-spacing: -1px; }
      .cap { position: absolute; left: 0; right: 0; text-align: center; opacity: 0; }
      .cap span { display: inline-block; font-family: "Display"; font-variation-settings: "opsz" 32; font-weight: 700; font-size: 66px; letter-spacing: -.055em; word-spacing: .02em; color: #0a105e; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.7" data-width="1080" data-height="1920">
      <audio id="vo" src="assets/voix.mp3" data-start="0" data-duration="7.7" data-track-index="1"></audio>
      <div id="stage" class="clip" data-start="0" data-duration="7.7" data-track-index="0" style="position:absolute; inset:0"></div>
    </div>
    <script>
      (function () {
        var NS = "http://www.w3.org/2000/svg", tl = gsap.timeline({ paused: true }), st = document.getElementById("stage");
        var NAVY = "#0a105e", BLUE = "#3d5afe", PALE = "#c5cad9", GRID = "#d5dae5", AX = "#6b7290";
        function div(p, html, style, cls) { var d = document.createElement("div"); d.className = cls || "a"; d.innerHTML = html; d.setAttribute("style", style); p.appendChild(d); return d; }
        function el(s, tag, a, text) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; s.appendChild(e); return e; }
        function T(s, x, y, str, size, fill, w, anchor) { return el(s, "text", { x: x, y: y, "font-size": size, fill: fill, "font-weight": w || 600, "text-anchor": anchor || "start" }, str); }
        function fr(v, d) { return v.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }).replace(/[  ]/g, " "); }

        // titre en haut à gauche (logo officiel + titre)
        var lg = div(st, "<img src='assets/img/google-g.svg' style='width:100%; height:100%; display:block'>", "left:96px; top:292px; width:64px; height:64px");
        var ti = div(st, "Investissements", "left:180px; top:286px; font-weight:700; font-size:72px; letter-spacing:-.055em; line-height:1");
        tl.fromTo([lg, ti], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .35, ease: "power3.out", stagger: .05 }, 0);

        // graphique : quadrillage 0–75, axe à droite, trois colonnes
        var g = document.createElementNS(NS, "svg"); g.setAttribute("width", 1080); g.setAttribute("height", 820); g.style.left = "0px"; g.style.top = "420px"; st.appendChild(g);
        var Y = function (v) { return 740 - v / 75 * 640; }, BASE = Y(0);
        var grid = [];
        [0, 25, 50, 75].forEach(function (v) { grid.push(el(g, "line", { x1: 96, x2: 984, y1: Y(v), y2: Y(v), stroke: v ? GRID : NAVY, "stroke-width": v ? 2 : 3 })); grid.push(T(g, 984, Y(v) - 12, String(v), 28, AX, 500, "end")); });
        tl.fromTo(grid, { opacity: 0 }, { opacity: 1, duration: .3 }, .1);
        var W = 210, X = [120, 380, 640];

        // T3 2025 : 24 Md$ (gris)
        var r1 = el(g, "rect", { x: X[0], y: Y(24), width: W, height: BASE - Y(24), fill: PALE });
        tl.fromTo(r1, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: .55, ease: "power3.out" }, .4);
        var v1 = T(g, X[0] + W / 2, Y(24) - 24, "24,0", 50, AX, 700, "middle"), l1 = T(g, X[0] + W / 2, BASE + 52, "T3 2025", 32, AX, 600, "middle");
        tl.fromTo([v1, l1], { opacity: 0 }, { opacity: 1, duration: .2 }, .7);

        // T3 2026 : 51,4 Md$ (bleu), sur « plus de cinquante milliards »
        var r2 = el(g, "rect", { x: X[1], y: Y(51.4), width: W, height: BASE - Y(51.4), fill: BLUE });
        tl.fromTo(r2, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: .8, ease: "power3.out" }, 2.6);
        var v2 = T(g, X[1] + W / 2, Y(51.4) - 24, "0,0", 50, NAVY, 700, "middle"), l2 = T(g, X[1] + W / 2, BASE + 52, "T3 2026", 32, NAVY, 600, "middle");
        tl.fromTo([v2, l2], { opacity: 0 }, { opacity: 1, duration: .2 }, 2.6);
        var o = { v: 0 }; tl.fromTo(o, { v: 0 }, { v: 51.4, duration: .8, ease: "power3.out", onUpdate: function () { v2.textContent = fr(o.v, 1); } }, 2.6);
        // « en seulement trois mois » : ×2 écrit dans la colonne
        var x2 = T(g, X[1] + W / 2, Y(51.4) + 92, "×2", 70, "#fff", 700, "middle");
        tl.fromTo(x2, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .3, ease: "power3.out" }, 4.4);

        // « l'an prochain, ce sera encore plus » : colonne 2027 en pointillés, plus haute
        var r3 = el(g, "rect", { x: X[2] + 2, y: Y(70), width: W - 4, height: BASE - Y(70) - 2, fill: "rgba(61,90,254,.08)", stroke: BLUE, "stroke-width": 4, "stroke-dasharray": "14 10" });
        tl.fromTo(r3, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: .7, ease: "power3.out" }, 6.32);
        var v3 = T(g, X[2] + W / 2, Y(70) - 24, "?", 50, BLUE, 700, "middle"), l3 = T(g, X[2] + W / 2, BASE + 52, "2027", 32, NAVY, 600, "middle");
        tl.fromTo([v3, l3], { opacity: 0 }, { opacity: 1, duration: .2 }, 6.7);

        var src = div(st, "Par trimestre, en milliards de dollars · Source : Alphabet", "left:96px; top:1262px; font-size:28px; font-weight:500; color:#6b7290; letter-spacing:-.02em");
        tl.fromTo(src, { opacity: 0 }, { opacity: 1, duration: .3 }, .5);

        // sous-titres (3 mots max)
        [["Aujourd'hui,", 0, .38], ["Google construit", .38, .96], ["des data centers", .96, 1.74], ["à une vitesse", 1.74, 2.26], ["folle.", 2.26, 2.60], ["Plus de", 2.60, 2.80], ["50 milliards", 2.80, 3.44], ["de dollars", 3.44, 3.96], ["dépensés", 3.96, 4.34], ["en seulement", 4.34, 4.66], ["trois mois.", 4.66, 5.24], ["Et la direction", 5.24, 5.78], ["prévient,", 5.78, 6.32], ["l'an prochain,", 6.32, 6.74], ["ce sera", 6.74, 7.02], ["encore plus.", 7.02, 7.7]].forEach(function (c) {
          var d = div(st, "<span>" + c[0] + "</span>", "top:1360px", "cap");
          tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: .06 }, c[1]); tl.set(d, { opacity: 0 }, c[2] - .02);
        });
        tl.set({}, {}, 7.7);
        // zone sûre Instagram / TikTok : fonds plein cadre à part, tout le reste réduit (×0,82) vers le centre utile
        (function () {
          var root = document.getElementById("root"), bgl = document.createElement("div");
          bgl.style.cssText = "position:absolute; inset:0"; root.insertBefore(bgl, st);
          [].slice.call(st.children).forEach(function (c) { if (/^\s*inset:\s*0/.test(c.getAttribute("style") || "")) bgl.appendChild(c); });
          st.style.transform = "scale(.82)"; st.style.transformOrigin = "540px 880px";
        })();
        window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; tl.seek(0);
      })();
    </script>
  </body>
</html>
