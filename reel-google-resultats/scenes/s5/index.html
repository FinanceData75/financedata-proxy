<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/logos.js"></script>
    <style>
      /* Scène 5 (16,18 → 18,68 s) « et cette fois-ci, les résultats étaient inférieurs aux attentes ».
         Version minimaliste : deux lignes (vrais logos Google Ads et YouTube), le chiffre publié en rouge, l'attendu en gris dessous. */
      @font-face { font-family: "Display"; src: url("assets/fonts/inter-display-latin-var.woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #eef1f5; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #eef1f5; color: #0a105e; font-family: "Display", sans-serif; font-variation-settings: "opsz" 32; -webkit-font-smoothing: antialiased; }
      .a { position: absolute; }
      .cap { position: absolute; left: 0; right: 0; text-align: center; opacity: 0; }
      .cap span { display: inline-block; font-family: "Display"; font-variation-settings: "opsz" 32; font-weight: 700; font-size: 66px; letter-spacing: -.055em; word-spacing: .02em; color: #0a105e; }
      .num { font-weight: 700; letter-spacing: -.055em; line-height: 1; font-feature-settings: "tnum" 1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.5" data-width="1080" data-height="1920">
      <audio id="vo" src="assets/voix.mp3" data-start="0" data-duration="2.5" data-track-index="1"></audio>
      <div id="stage" class="clip" data-start="0" data-duration="2.5" data-track-index="0" style="position:absolute; inset:0"></div>
    </div>
    <script>
      (function () {
        var tl = gsap.timeline({ paused: true }), st = document.getElementById("stage"), L = window.LOGOS, RED = "#e5484d";
        function div(p, html, style, cls) { var d = document.createElement("div"); d.className = cls || "a"; d.innerHTML = html; d.setAttribute("style", style); p.appendChild(d); return d; }
        function fr(v, d) { return v.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }).replace(/[  ]/g, " "); }
        function logo(name, fill, size) { return "<svg width='" + size + "' height='" + size + "' viewBox='0 0 24 24'><path d='" + L[name] + "' fill='" + fill + "'/></svg>"; }

        // titre en haut à gauche
        var ti = div(st, "Sous les attentes", "left:96px; top:300px; font-weight:700; font-size:76px; letter-spacing:-.055em; line-height:1");
        var sub = div(st, "Revenus publicitaires, T3 2026", "left:96px; top:396px; font-size:38px; font-weight:500; color:#3b4166; letter-spacing:-.03em");
        tl.fromTo([ti, sub], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .35, ease: "power3.out", stagger: .05 }, 0);

        // une ligne par activité : logo, nom, chiffre publié (rouge), attendu (gris)
        [["googleads", "#4285f4", "Google Ads", 82.01, 83.52, 540, .25], ["youtube", "#ff0000", "YouTube", 11.21, 11.34, 900, .45]].forEach(function (r) {
          var row = div(st, "<div style='position:absolute; left:0; top:6px'>" + logo(r[0], r[1], 96) + "</div><div style='position:absolute; left:130px; top:20px; font-size:50px; font-weight:700; letter-spacing:-.05em'>" + r[2] + "</div>", "left:96px; top:" + r[5] + "px; width:888px; height:330px");
          var n = div(row, fr(r[4], 1) + " Md$", "left:0; top:126px; font-size:112px; color:#9aa1b8", "a num");
          tl.to(n, { color: RED, duration: .3 }, 1.45);
          var exp = div(row, "attendu : " + fr(r[4], 1) + " Md$", "left:4px; top:256px; font-size:40px; font-weight:600; color:#6b7290; letter-spacing:-.03em");
          tl.fromTo(row, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .4, ease: "power3.out" }, r[6]);
          var o = { v: r[4] }; tl.fromTo(o, { v: r[4] }, { v: r[3], duration: .6, ease: "power3.out", onUpdate: function () { n.textContent = "▼ " + fr(o.v, 1) + " Md$"; } }, 1.45);
          tl.fromTo(exp, { opacity: 0 }, { opacity: 1, duration: .3 }, 1.9);
        });
        div(st, "<div style='display:flex; justify-content:space-between; width:888px; font-size:26px; color:#6b7290'><span>Sources : Alphabet ; consensus Zacks</span><b style='font-size:30px; font-weight:800; letter-spacing:-.04em; color:#0a105e'>FinanceData</b></div>", "left:96px; top:1262px");

        // sous-titres (3 mots max)
        [["et cette fois-ci,", 0, .78], ["les résultats", .78, 1.22], ["étaient inférieurs", 1.22, 1.90], ["aux attentes.", 1.90, 2.5]].forEach(function (c) {
          var d = div(st, "<span>" + c[0] + "</span>", "top:1360px", "cap");
          tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: .06 }, c[1]); tl.set(d, { opacity: 0 }, c[2] - .02);
        });
        tl.set({}, {}, 2.5);
        window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; tl.seek(0);
      })();
    </script>
  </body>
</html>
