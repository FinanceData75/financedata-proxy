<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* Scène 14 (58,50 → 60,66 s) « Et pour comprendre les marchés simplement, abonnez-vous ».
         Appel à l'abonnement : uniquement le logo, le nom et le bouton « S'abonner » (bleu FinanceData, angles presque droits),
         qui passe à « Abonné ✓ » sur « abonnez-vous ». Fond #EEF1F5. */
      @font-face { font-family: "Display"; src: url("assets/fonts/inter-display-latin-var.woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #eef1f5; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #eef1f5; color: #0a105e; font-family: "Display", sans-serif; font-variation-settings: "opsz" 32; -webkit-font-smoothing: antialiased; }
      .a { position: absolute; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.16" data-width="1080" data-height="1920">
      <audio id="vo" src="assets/voix.mp3" data-start="0" data-duration="2.16" data-track-index="1"></audio>
      <div id="stage" class="clip" data-start="0" data-duration="2.16" data-track-index="0" style="position:absolute; inset:0"></div>
    </div>
    <script>
      (function () {
        var tl = gsap.timeline({ paused: true }), st = document.getElementById("stage"), BLUE = "#3d5afe";
        function div(p, html, style) { var d = document.createElement("div"); d.className = "a"; d.innerHTML = html; d.setAttribute("style", style); p.appendChild(d); return d; }

        var logo = div(st, "<img src='assets/img/logo-financedata.png' style='width:100%; height:100%; display:block; border-radius:6px'>", "left:420px; top:640px; width:240px; height:240px; box-shadow:0 18px 50px rgba(10,16,94,.18); border-radius:6px");
        var name = div(st, "FinanceData", "left:0; right:0; top:930px; text-align:center; font-size:96px; font-weight:700; letter-spacing:-.055em; line-height:1");
        var btn = div(st, "<span class='b1' style='position:absolute; inset:0'>S'abonner</span><span class='b2' style='position:absolute; inset:0; opacity:0'>Abonné ✓</span>", "left:340px; top:1090px; width:400px; height:110px; border-radius:4px; background:" + BLUE + "; color:#fff; font-size:46px; font-weight:700; letter-spacing:-.03em; text-align:center; line-height:110px");
        tl.fromTo(logo, { opacity: 0, scale: .9 }, { opacity: 1, scale: 1, duration: .45, ease: "power3.out" }, 0);
        tl.fromTo(name, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .4, ease: "power3.out" }, .12);
        tl.fromTo(btn, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .4, ease: "power3.out" }, .24);

        // « abonnez-vous » : le bouton est pressé et passe à « Abonné ✓ »
        var tA = 1.74;
        tl.to(btn, { scale: .95, duration: .1 }, tA); tl.to(btn, { scale: 1, duration: .25, ease: "power2.out" }, tA + .1);
        tl.to(btn, { backgroundColor: "#d5dae5", color: "#0a105e", duration: .15 }, tA + .1);
        tl.set(btn.querySelector(".b1"), { opacity: 0 }, tA + .12); tl.set(btn.querySelector(".b2"), { opacity: 1 }, tA + .12);

        tl.set({}, {}, 2.16);
        window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; tl.seek(0);
      })();
    </script>
  </body>
</html>
