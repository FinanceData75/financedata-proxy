<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />

    <style>
      /* Démo « pages produit Apple » : blanc ou noir, texte #1D1D1F, gris #86868B pour la 2e phrase,
         typographie semi-grasse, beaucoup d'espace, tuiles #F5F5F7 aux coins arrondis, tracés fins, aucun dégradé.
         Animations sobres : fondu + légère montée, chiffres qui comptent, lignes qui se dessinent. Données réelles. */
      @font-face { font-family: "Display"; src: url("assets/fonts/inter-display-latin-var.woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; }

      .sc { position: absolute; inset: 0; opacity: 0; overflow: hidden; background: #fff; color: #1d1d1f; }
      .sc.noir { background: #000; color: #f5f5f7; }
      .t { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
      .eye { font-size: 40px; font-weight: 600; color: #86868b; letter-spacing: -.005em; }
      .hd { font-weight: 600; letter-spacing: -.03em; line-height: 1.05; }
      .g { color: #86868b; }
      .big { font-weight: 600; letter-spacing: -.045em; line-height: .95; font-feature-settings: "tnum" 1; }
      .tile { position: absolute; border-radius: 40px; background: #f5f5f7; }
      .noir .tile { background: #1d1d1f; }
      svg { position: absolute; overflow: visible; }
      svg text { font-family: "Display"; font-variation-settings: "opsz" 32; font-feature-settings: "tnum" 1; }
    </style>
  </head>

    </div>

        var h1 = fade(div(s, "t big", "0 %", "top:540px; font-size:300px"), .05, .6);

        g = svg(bar, 70, 70, 52, 35); el(el(g, "g", { transform: "scale(2.9)" }), "path", { d: G.logo, fill: "#1d1d1f" });
        var q = div(bar, "", "", "position:absolute; left:150px; top:42px; font-size:48px; font-weight:500; color:#1d1d1f; letter-spacing:-.015em");
        var Q = "billet avion Paris New York", o4 = { n: 0 };
        tl.fromTo(o4, { n: 0 }, { n: Q.length, duration: 1.0, ease: "none", onUpdate: function () { q.textContent = Q.slice(0, Math.round(o4.n)); } }, 7.9);
        fade(div(s, "", "<div style='font-size:30px; font-weight:600; color:#86868b'>Sponsorisé</div><div style='margin-top:12px; font-size:46px; font-weight:600; color:#0066cc; letter-spacing:-.015em'>Vols Paris – New York</div><div style='margin-top:8px; font-size:34px; color:#86868b'>Exemple d'annonce</div>", "position:absolute; left:150px; top:900px"), 8.9, .6);

        // 5. 9,6–12 les investissements IA, en fiche technique
        s = scene(9.6, 12);
        fade(div(s, "t eye", "Investis dans l'IA en trois mois", "top:520px"), 9.65);
        var h5 = fade(div(s, "t big", "0 Md$", "top:600px; font-size:205px"), 9.7);
        count(h5, 9.75, 0, 51.4, 1.3, function (v) { return v.toFixed(1).replace(".", ",") + " Md$"; });
        g = svg(s, 1080, 320, 0, 900);
        [["Il y a un an", 24, "#d2d2d7"], ["Ce trimestre", 51.4, "#1d1d1f"]].forEach(function (r, k) {
          var y = 40 + k * 140, w = r[1] / 51.4 * 888;
          el(g, "text", { x: 96, y: y, "font-size": 34, "font-weight": 600, fill: "#86868b" }, r[0]);
          var b = el(g, "rect", { x: 96, y: y + 22, width: w, height: 22, rx: 11, fill: r[2] });
          tl.fromTo(b, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 1, ease: "power3.out" }, 10.3 + k * .3);
          var v = el(g, "text", { x: 984, y: y, "font-size": 34, "font-weight": 600, fill: "#1d1d1f", "text-anchor": "end" }, String(r[1]).replace(".", ",") + " Md$");
