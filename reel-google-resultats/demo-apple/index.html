<!doctype html>
<html lang="fr" data-resolution="portrait">

    <style>
      /* Démo « style keynote » : noir profond ou blanc Apple, typographie géante, dégradés lumineux,

      @font-face { font-family: "Display"; src: url("assets/fonts/inter-display-latin-var.woff2"); font-weight: 100 900; }

      .t { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }

      .grad-red { background: linear-gradient(100deg, #ff375f 10%, #ff9f0a 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .grad-green { background: linear-gradient(100deg, #30d158 10%, #64d2ff 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .grad-blue { background: linear-gradient(100deg, #2997ff 0%, #a259ff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .glass { position: absolute; border-radius: 44px; background: rgba(255,255,255,.72); box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 40px 90px rgba(0,0,0,.12); backdrop-filter: blur(20px); }
      svg { position: absolute; overflow: visible; }
      svg text { font-family: "Display"; font-variation-settings: "opsz" 32; font-feature-settings: "tnum" 1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18.6" data-width="1080" data-height="1920">

    </div>

      (function () {
        var NS = "http://www.w3.org/2000/svg", tl = gsap.timeline({ paused: true }), stage = document.getElementById("stage"), G = window.GOOG;

        var dD = Dd.map(function (r, k) { return (k ? "L" : "M") + X2(k).toFixed(1) + " " + Y2(r[1]).toFixed(1); }).join(" ");

        var l1 = el(g, "path", { d: dD, fill: "none", stroke: "url(#lb)", "stroke-width": 18, opacity: .5, filter: "url(#gb)" });
        var l2 = el(g, "path", { d: dD, fill: "none", stroke: "url(#lb)", "stroke-width": 6, "stroke-linejoin": "round" });

        tl.fromTo([pkd, pkt], { opacity: 0 }, { opacity: 1, duration: .3 }, 6.0);
        var en = el(g, "circle", { cx: X2(Dd.length - 1), cy: Y2(291.64), r: 12, fill: "#ff375f" });
        tl.fromTo(en, { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: .35, ease: "back.out(3)" }, 6.75);

        // 4. 7,4–9,6 la publicité : barre de recherche en verre, résultat « Sponsorisé »
        s = scene(7.4, 9.6, "blanc");
        rise(div(s, "t hd", "La pub,<br>le cœur de Google.", "top:330px; font-size:96px; white-space:normal"), 7.45);
        var bar = div(s, "glass", "", "left:96px; top:680px; width:888px; height:150px; border-radius:75px");
        rise(bar, 7.6);
        g = svg(bar, 90, 90, 50, 30); var gl = el(g, "g", { transform: "scale(3.75)" }); el(gl, "path", { d: G.logo, fill: "#1d1d1f" });
        var q = div(bar, "", "", "position:absolute; left:170px; top:44px; font-size:52px; font-weight:500; color:#1d1d1f; letter-spacing:-.02em");
        var Q = "billet avion Paris New York", o4 = { n: 0 };
        tl.fromTo(o4, { n: 0 }, { n: Q.length, duration: 1.1, ease: "none", onUpdate: function () { q.textContent = Q.slice(0, Math.round(o4.n)) + "|"; } }, 7.9);
        var card = div(s, "glass", "<div style='font-size:30px; font-weight:700; color:#1d1d1f; letter-spacing:.02em'>SPONSORISÉ</div><div style='margin-top:14px; font-size:48px; font-weight:600; color:#0a5bd8; letter-spacing:-.02em'>Vols Paris – New York dès 389 €</div><div style='margin-top:10px; font-size:34px; color:#6e6e73'>www.compagnie-exemple.com</div>", "left:96px; top:900px; width:888px; height:270px; padding:46px 56px; border-radius:36px");
        rise(card, 8.9, .6);

          var l = el(g, "text", { x: x + 140, y: 660, "font-size": 36, "font-weight": 600, fill: "#86868b", "text-anchor": "middle" }, r[0]);
