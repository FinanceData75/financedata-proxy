    <style>
      /* Reel « Le dessous des marchés, épisode 3 : Uber » (84,25 s). DA « data intelligence » de FinanceData (reprise du reel VIX) :
         bleu #00194B quadrillé avec halo, alterné avec un blanc cassé quadrillé ; Inter ; blanc, cyan et rouge ; photos HD plein cadre
         avec nom en typographie, petites images posées sur fond bleu avec légende ; fin : logo FinanceData dans l'anneau story. */
      @font-face { font-family: "Inter UI"; src: url("assets/fonts/Inter-Regular.otf") format("opentype"); font-weight: 400; }
      @font-face { font-family: "Inter UI"; src: url("assets/fonts/Inter-Medium.otf") format("opentype"); font-weight: 500; }
      @font-face { font-family: "Inter UI"; src: url("assets/fonts/Inter-SemiBold.otf") format("opentype"); font-weight: 600; }
      :root { --bg: #00194b; --ink: #eaf1fb; --soft: #8fa3c7; --cyan: #7dd0f5; --red: #ff2e24; --green: #35d07f; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { width: 1080px; height: 1920px; position: relative; overflow: hidden; font-family: "Inter UI", sans-serif; color: var(--ink); background: var(--bg); font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; }
      #bg-dark { position: absolute; inset: 0; }
      #bg-dark .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 38% at 50% 46%, #0b3480 0%, rgba(0, 25, 75, 0) 72%); }
      #bg-dark .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 48px 48px; background-position: 12px 0;
        -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); }
      #bg-dark .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 65% at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,5,22,.6) 100%); }
      #bg-light { position: absolute; inset: 0; opacity: 0; background: #f6f8fc; }
      #bg-light::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(0,25,75,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0,25,75,.06) 1px, transparent 1px); background-size: 48px 48px; background-position: 12px 0;
        -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); }
      #bg-light::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 65% at 50% 46%, rgba(255,255,255,0) 55%, rgba(0,25,75,.08) 100%); }
      .a { position: absolute; }
      .full { position: absolute; inset: 0; opacity: 0; }
      /* scène : bloc centré dans la zone sûre (x 140–940, y 440–1290) */
      .scene { position: absolute; left: 140px; top: 440px; width: 800px; height: 850px; opacity: 0; text-align: center; color: var(--ink); }
      .scene.light { --ink: #00194b; --soft: #5b6b8a; --cyan: #0b6fd0; --green: #12924f; }
      .title { font-size: 60px; font-weight: 600; letter-spacing: -.035em; line-height: 1.04; white-space: nowrap; }
      .sub { margin-top: 12px; font-size: 26px; color: var(--soft); }
      .kick { font-size: 46px; font-weight: 600; letter-spacing: -.04em; color: var(--ink); text-align: left; }
      .hl { display: inline-block; font-size: 96px; font-weight: 600; letter-spacing: -.05em; line-height: 1; padding: 6px 18px 18px; background: var(--ink); color: var(--bg); }
      .scene.light .hl { color: #fff; }
      .big { font-weight: 600; letter-spacing: -.05em; line-height: 1; white-space: nowrap; }
      .chip { position: absolute; padding: 8px 20px 12px; font-weight: 600; font-size: 40px; letter-spacing: -.03em; white-space: nowrap; opacity: 0; }
      .src { position: absolute; left: 0; right: 0; font-size: 22px; color: var(--soft); }
      svg { position: absolute; overflow: visible; }
      svg text { font-family: "Inter UI", sans-serif; font-feature-settings: "tnum" 1; }
      .ov { position: absolute; left: 0; right: 0; text-align: center; color: #fff; font-weight: 600; letter-spacing: -.045em; line-height: 1.02; text-shadow: 0 2px 24px rgba(0,10,40,.45); }
      /* sous-titres : blanc, fond gris translucide */
      .cap-line { position: absolute; left: 80px; right: 80px; top: 1330px; text-align: center; opacity: 0; }
      .cap-box { display: inline-block; padding: 8px 22px 13px; border-radius: 4px; background: rgba(30,34,42,.74); font-weight: 600; font-size: 54px; line-height: 1.12; letter-spacing: -.045em; word-spacing: -.02em; color: #fff; white-space: nowrap; }
      /* fin */
      #avatar { position: absolute; left: 360px; top: 470px; width: 360px; height: 360px; opacity: 0; }
      #avatar .pic { position: absolute; left: 22px; top: 22px; width: 316px; height: 316px; border-radius: 50%; overflow: hidden; border: 8px solid #00194b; box-shadow: 0 20px 50px rgba(0,5,25,.5); }
      #avatar .pic img { width: 100%; height: 100%; display: block; }
    </style>

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="84.25" data-width="1080" data-height="1920">

      <div id="bgs" class="clip" data-start="0" data-duration="84.25" data-track-index="2" style="position:absolute; inset:0">
        <div id="bg-dark"><div class="glow"></div><div class="grid"></div><div class="vig"></div></div>

      <video id="v-wm" class="clip" src="assets/video/waymo.mp4" data-start="58.5" data-duration="7.55" data-track-index="5" muted playsinline style="position:absolute; left:0; top:0; width:1080px; height:1920px; object-fit:cover"></video>
      <div id="stage" class="clip" data-start="0" data-duration="84.25" data-track-index="6" style="position:absolute; inset:0"></div>
    </div>
    <script>
      (function () {
        var NS = "http://www.w3.org/2000/svg", tl = gsap.timeline({ paused: true }), END = 84.25;
        var st = document.getElementById("stage"), ph = document.getElementById("photos"), bgL = document.getElementById("bg-light");
        var INK = "#eaf1fb", SOFT = "#8fa3c7", CYAN = "#7dd0f5", RED = "#ff2e24", GREEN = "#35d07f", NAVY = "#00194b", NSOFT = "#5b6b8a";
        function div(p, html, style, cls) { var d = document.createElement("div"); d.className = cls || "a"; d.innerHTML = html; d.setAttribute("style", style || ""); p.appendChild(d); return d; }
        function el(s, tag, a, text) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; s.appendChild(e); return e; }
        function T(s, x, y, str, size, fill, w, anchor) { return el(s, "text", { x: x, y: y, "font-size": size, fill: fill, "font-weight": w || 500, "text-anchor": anchor || "start", "letter-spacing": "-0.02em" }, str); }
        function svg(p, x, y, w, h) { var g = document.createElementNS(NS, "svg"); g.setAttribute("width", w); g.setAttribute("height", h); g.style.left = x + "px"; g.style.top = y + "px"; p.appendChild(g); return g; }
        function fr(v, d) { return v.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }).replace(/[  ]/g, " "); }
        function drawIn(n, at, dur, ease) { var L = n.getTotalLength(); n.style.strokeDasharray = L + " " + L; tl.fromTo(n, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.inOut" }, at); }
        function fadeIn(n, at, dur, y) { tl.fromTo(n, { opacity: 0, y: y == null ? 16 : y }, { opacity: 1, y: 0, duration: dur || .45, ease: "power2.out" }, at); return n; }
        function popIn(n, at) { tl.fromTo(n, { opacity: 0, scale: .85, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: .35, ease: "back.out(2)" }, at); return n; }
        function count(e, t, d, v0, v1, f) { var o = { v: v0 }; tl.fromTo(o, { v: v0 }, { v: v1, duration: d, ease: "power3.out", onUpdate: function () { e.textContent = f(o.v); } }, t); }
        // scène : mode "dark" (fond bleu quadrillé), "light" (blanc cassé quadrillé) ou "photo" (le fond est une photo ou une vidéo)
        function scene(t0, t1, mode) {
          var s = div(st, "", "", "scene" + (mode === "light" ? " light" : ""));
          tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: .25, ease: "power1.out" }, t0); tl.set(s, { opacity: 0 }, t1);
          if (mode === "light") { tl.set(bgL, { opacity: 1 }, t0); tl.set(bgL, { opacity: 0 }, t1); }
          return s;
        }
        // photo HD plein cadre (lent zoom), voile bas pour le texte
        function photo(img, t0, t1, pos) {
          var w = div(ph, "", "", "full"), im = div(w, "", "position:absolute; inset:0; background:url(assets/img/" + img + ") " + (pos || "center") + "/cover");
          div(w, "", "position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,10,30,.25) 0%, rgba(0,10,30,0) 30%, rgba(0,10,30,0) 50%, rgba(0,20,60,.8) 100%)");
          tl.fromTo(w, { opacity: 0 }, { opacity: 1, duration: .3 }, t0); tl.set(w, { opacity: 0 }, t1);
          tl.fromTo(im, { scale: 1.02 }, { scale: 1.1, duration: t1 - t0, ease: "none" }, t0);
          return w;
        }
        function chip(p, txt, x, y, at, bg, color) { var c = div(p, txt, "left:" + x + "px; top:" + y + "px; background:" + bg + "; color:" + (color || "#fff"), "chip"); popIn(c, at); return c; }
        function logo(h, color) { return "<svg width='" + h + "' height='" + h + "' viewBox='0 0 24 24' style='position:static; display:inline-block; vertical-align:middle'><path d='" + window.LOGOS.uber + "' fill='" + (color || "#fff") + "'/></svg>"; }

        // ===== 1. HOOK (0 → 5,24) : la fiche boursière d'Uber, puis ses bénéfices à plat =====
        (function () {
          var s = scene(0, 5.24, "dark");
          var lg = div(s, logo(330), "left:0; right:0; top:60px; text-align:center");
          var tk = div(s, "NYSE : UBER", "left:0; right:0; top:380px; font-size:40px; font-weight:500; letter-spacing:.02em; color:" + SOFT);
          var px = div(s, "71,17 USD", "left:0; right:0; top:450px; font-size:104px", "a big");
          popIn(lg, 0); fadeIn(tk, .15, .35, 10); fadeIn(px, .25, .35, 10);
          // les bénéfices : une ligne plate
          var g = svg(s, 100, 600, 600, 160);
          var ln = el(g, "path", { d: "M0 70 L600 66", fill: "none", stroke: INK, "stroke-width": 5, "stroke-linecap": "round" });
          var a = el(g, "circle", { cx: 0, cy: 70, r: 9, fill: INK }), b = el(g, "circle", { cx: 600, cy: 66, r: 9, fill: INK });
          var lb = T(g, 300, 140, "bénéfice net 2024 → 2025", 30, SOFT, 500, "middle");
          tl.fromTo([a, lb], { opacity: 0 }, { opacity: 1, duration: .2 }, 1.3); drawIn(ln, 1.35, .7); tl.fromTo(b, { opacity: 0 }, { opacity: 1, duration: .2 }, 2.0);
          var no = div(s, "Croissance : 0 %", "left:0; right:0; top:772px; font-size:44px; font-weight:600; letter-spacing:-.03em; color:" + SOFT);
          fadeIn(no, 3.4, .3, 8);
          tl.to(no, { color: RED, duration: .15 }, 4.65);
          var ring = div(s, "", "left:200px; top:754px; width:400px; height:96px; border:4px solid " + RED + "; border-radius:48px");
          tl.fromTo(ring, { opacity: 0, scale: 1.25, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: .25, ease: "power3.out" }, 4.65);
        })();

        // ===== 2. Le patron (5,24 → 9,44) : photo HD plein cadre, nom en typographie, puis 10 M$ =====
        (function () {
          photo("dara-hd.jpg", 5.24, 9.44, "50% 30%");
          var s = scene(5.24, 9.44, "photo");
          var n1 = div(s, "Dara", "left:0; right:0; top:560px; font-size:96px; font-weight:400; letter-spacing:-.05em", "ov");
          var n2 = div(s, "Khosrowshahi", "left:0; right:0; top:668px; font-size:112px", "ov");
          var n3 = div(s, "Directeur général d'Uber", "left:0; right:0; top:800px; font-size:38px; font-weight:500; letter-spacing:-.02em", "ov");
          fadeIn(n1, 5.35, .4, 14); fadeIn(n2, 5.45, .4, 14); fadeIn(n3, 5.6, .4, 10);
          tl.to([n1, n2, n3], { opacity: 0, duration: .2 }, 6.7);
          var v = div(s, "0 M$", "left:0; right:0; top:560px; font-size:200px", "ov");
          tl.fromTo(v, { opacity: 0, scale: 1.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: .3, ease: "power3.out" }, 6.88);
          count(v, 6.88, .7, 0, 10, function (x) { return Math.round(x) + " M$"; });
          fadeIn(div(s, "de sa poche, dans l'action", "left:0; right:0; top:790px; font-size:52px", "ov"), 8.1, .35, 12);
        })();

        // ===== 3. « Parce qu'il regarde un autre chiffre » (9,44 → 11,34) : image posée sur fond bleu + légende =====
        (function () {
          var s = scene(9.44, 11.34, "dark");
          var lg = div(s, "Ce qu'il regarde", "left:0; right:0; top:0; font-size:30px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:" + SOFT);
          var fr_ = div(s, "<img src='assets/img/dara-carte.jpg' style='width:100%; height:100%; object-fit:cover; object-position:50% 30%; display:block'>", "left:120px; top:70px; width:560px; height:620px; box-shadow:0 30px 60px rgba(0,5,25,.55); outline:1px solid rgba(255,255,255,.18)");
          fadeIn(lg, 9.5, .35, 8);
          tl.fromTo(fr_, { opacity: 0, y: 30, scale: .96 }, { opacity: 1, y: 0, scale: 1, duration: .5, ease: "power3.out" }, 9.5);
          tl.to(fr_, { scale: 1.03, duration: 1.4, ease: "none" }, 10.0);
          var q = div(s, "?", "left:0; right:0; top:720px; font-size:110px; color:" + CYAN, "a big");
          popIn(q, 10.6);
        })();

        // ===== 4. Générique (11,34 → 14,14) : la vidéo couvre tout =====

        // ===== 5. Ce que tout le monde regarde (14,14 → 28,60) : les bénéfices, gonflés par le fisc =====
        (function () {
          var s = scene(14.14, 28.6, "light");
          fadeIn(div(s, "Ce que tout le monde regarde", "left:0; top:0", "a kick"), 14.16, .35, 10);
          fadeIn(div(s, "<span class='hl'>Les bénéfices</span>", "left:-6px; top:66px; text-align:left"), 14.4, .35, 10);
          var Z = 760, U = 34, BW = 240, X = [130, 430];
          div(s, "", "left:40px; top:" + Z + "px; width:720px; height:3px; background:" + NAVY);
          var tax = [], vals = [], rest = [];
          [["2024", 9.86, 6.4, 16.44], ["2025", 10.05, 5.0, 18.62]].forEach(function (c, i) {
            var x = X[i], real = c[1] - c[2];
            var b = div(s, "", "left:" + x + "px; top:" + (Z - real * U) + "px; width:" + BW + "px; height:" + (real * U) + "px; background:" + NAVY);
            var t = div(s, "", "left:" + x + "px; top:" + (Z - c[1] * U) + "px; width:" + BW + "px; height:" + (c[2] * U - 3) + "px; background:" + NAVY);
            var v = div(s, "0", "left:" + x + "px; width:" + BW + "px; top:" + (Z - c[1] * U - 88) + "px; font-size:68px; color:" + NAVY, "a big");
            var l = div(s, c[0], "left:" + x + "px; width:" + BW + "px; top:" + (Z + 18) + "px; font-size:34px; font-weight:600; color:" + NAVY);
            var r = div(s, fr(real, 1), "left:" + x + "px; width:" + BW + "px; top:" + (Z - real * U + 28) + "px; font-size:56px; color:#fff", "a big");
            tl.fromTo(b, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: .5, ease: "power3.out" }, c[3]);
            tl.fromTo(t, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: .4, ease: "power3.out" }, c[3] + .35);
            tl.fromTo([v, l], { opacity: 0 }, { opacity: 1, duration: .1 }, c[3]); count(v, c[3], .9, 0, c[1], function (x) { return fr(x, 1); });
            tax.push(t); vals.push(v); rest.push(r);
          });
          var flat = div(s, "", "left:250px; top:" + (Z - 10 * U - 112) + "px; width:300px; height:0; border-top:3px dashed " + NSOFT);
          tl.fromTo(flat, { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: .35 }, 20.3);
          var cf = chip(s, "À plat", 330, Z - 10 * U - 150, 20.46, NSOFT);
          tl.to([flat, cf], { opacity: 0, duration: .2 }, 23.1);
          var HATCH = "repeating-linear-gradient(135deg, #9aa6bf 0 10px, #e6eaf2 10px 20px)";
          tl.set(tax, { background: HATCH }, 23.38);
          var c1 = chip(s, "Cadeau fiscal : + 11,4 Md$", 160, Z - 10 * U - 150, 23.4, RED);
          tl.to(tax, { opacity: .3, duration: .4 }, 25.7); tl.to(vals, { opacity: 0, duration: .25 }, 25.7);
          tl.fromTo(rest, { opacity: 0 }, { opacity: 1, duration: .3 }, 26.2);
          tl.to(c1, { opacity: 0, duration: .15 }, 26.8);
          chip(s, "De l'argent sur le papier", 175, Z - 10 * U - 150, 26.92, NAVY);
          fadeIn(div(s, "Bénéfice net, en milliards de dollars. Reprises de provisions fiscales : 6,4 Md$ (2024), 5,0 Md$ (2025) · Source : Uber", "top:" + (Z + 80) + "px", "src"), 23.5, .3, 0);
        })();

        // ===== 6. Ce qu'il faut regarder : le cash (28,60 → 42,97) =====
        (function () {
          var s = scene(28.6, 42.97, "dark");
          fadeIn(div(s, "Ce qu'il faut regarder", "left:0; top:0", "a kick"), 28.64, .35, 10);
          fadeIn(div(s, "<span class='hl'>Le cash</span>", "left:-6px; top:66px; text-align:left"), 29.4, .35, 10);
          fadeIn(div(s, "free cash flow, en milliards de dollars", "left:0; top:200px; text-align:left; font-size:28px; color:" + SOFT), 30.6, .35, 6);
          var Z = 760, U = 32, BW = 150, GAP = 40, X0 = 50;
          div(s, "", "left:40px; top:" + Z + "px; width:720px; height:2px; background:rgba(234,241,251,.6)");
          [["2023", 3.36, 32.83], ["2024", 6.9, 34.65], ["2025", 9.76, 36.04], ["2027*", 13.1, 39.3]].forEach(function (c, i) {
            var x = X0 + i * (BW + GAP), est = i === 3;
            var b = div(s, "", "left:" + x + "px; top:" + (Z - c[1] * U) + "px; width:" + BW + "px; height:" + (c[1] * U) + "px; " + (est ? "border:3px dashed " + CYAN + "; border-bottom:none" : "background:" + INK));
            var v = div(s, "0", "left:" + x + "px; width:" + BW + "px; top:" + (Z - c[1] * U - 76) + "px; font-size:58px; color:" + (est ? CYAN : INK), "a big");
            var l = div(s, c[0], "left:" + x + "px; width:" + BW + "px; top:" + (Z + 16) + "px; font-size:30px; color:" + SOFT);
            tl.fromTo(b, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: .55, ease: "power3.out" }, c[2]);
            tl.fromTo([v, l], { opacity: 0 }, { opacity: 1, duration: .1 }, c[2]);
            count(v, c[2], .6, 0, c[1], function (x) { return est ? fr(x, 0) : fr(x, 1); });
          });
          var g = svg(s, 0, 0, 800, 800);
          var arr = el(g, "path", { d: "M125 " + (760 - 3.36 * 32 - 100) + " C 300 " + (760 - 6 * 32 - 160) + ", 500 " + (760 - 12 * 32 - 150) + ", 610 " + (760 - 13.1 * 32 - 105), fill: "none", stroke: CYAN, "stroke-width": 4, "stroke-dasharray": "2 10", "stroke-linecap": "round" });
          drawIn(arr, 40.9, .7);
          chip(s, "× 4", 300, 300, 41.3, CYAN, NAVY);
          fadeIn(div(s, "* prévision moyenne des analystes · Source : Uber, Simply Wall St", "top:830px", "src"), 39.4, .3, 0);
        })();

        // ===== 7. « Ce n'est pas le seul signal » (42,97 → 44,32) =====
        (function () {
          var s = scene(42.97, 44.32, "dark");
          fadeIn(div(s, "3 signaux verts", "left:0; right:0; top:120px", "a title"), 42.99, .3, 10);
          ["Le cash", "Le support", "Le prix"].forEach(function (n, i) {
            var y = 300 + i * 130, on = i === 0;
            var c = div(s, on ? "✓" : String(i + 1), "left:190px; top:" + y + "px; width:88px; height:88px; border-radius:50%; text-align:center; line-height:84px; font-size:46px; font-weight:600; color:" + (on ? NAVY : GREEN) + "; " + (on ? "background:" + GREEN : "border:3px solid " + GREEN));
            var t = div(s, n, "left:310px; top:" + (y + 12) + "px; font-size:56px; font-weight:600; letter-spacing:-.04em; color:" + (on ? SOFT : INK));
            tl.fromTo([c, t], { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: .3, ease: "power3.out" }, 43.1 + i * .15);
          });
        })();
