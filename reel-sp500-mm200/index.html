<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/vo-words.js"></script>
    <script src="assets/data.js"></script>
    <style>
      /* Reel « Le guide de la culture financière, épisode 9 » : le S&P 500 sous sa moyenne mobile à 200 jours. Aperçu du hook (0 → 15,13 s). Fond clair, comme l'épisode 8. */
      @font-face { font-family: "Display"; src: url("assets/fonts/inter-display-latin-var.woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      #root { width: 1080px; height: 1920px; position: relative; overflow: hidden; font-family: "Display", sans-serif; color: #0b1f44; background: #ffffff; font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; }
      #bg { position: absolute; inset: 0; background: #ffffff; } #bg .grid { display: none; }
      #bg .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,25,75,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,25,75,.05) 1px, transparent 1px); background-size: 48px 48px; background-position: 12px 0;
        -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); }
      .a { position: absolute; }
      .scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
      svg { position: absolute; overflow: visible; }
      svg text { font-family: "Display"; font-feature-settings: "tnum" 1; }
      .src { position: absolute; left: 100px; right: 100px; font-size: 22px; font-weight: 500; color: #6b7280; }
      .cap-line { position: absolute; left: 100px; right: 100px; top: 1400px; text-align: center; opacity: 0; }
      .cap-box { display: inline-block; padding: 8px 22px 13px; border-radius: 4px; background: rgba(30,34,42,.78); font-weight: 700; font-size: 52px; line-height: 1.12; letter-spacing: -.05em; color: #fff; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.13" data-width="1080" data-height="1920">
      <audio id="vo" src="assets/voix.mp3" data-start="0" data-duration="15.13" data-track-index="1"></audio>
      <div id="bgs" class="clip" data-start="0" data-duration="15.13" data-track-index="2" style="position:absolute; inset:0"><div id="bg"><div class="grid"></div></div></div>
      <div id="stage" class="clip" data-start="0" data-duration="15.13" data-track-index="3" style="position:absolute; inset:0"></div>
      <div id="top" class="clip" data-start="0" data-duration="15.13" data-track-index="5" style="position:absolute; inset:0; pointer-events:none"></div>
    </div>
    <script>
      (function () {
        var NS = "http://www.w3.org/2000/svg", tl = gsap.timeline({ paused: true }), END = 15.13;
        var st = document.getElementById("stage"), top = document.getElementById("top");
        var INK = "#0b1f44", SOFT = "#6b7280", RULE = "#d9dce3", VERT = "#10b981", ROUGE = "#e5484d", OR2 = "#e0a526", ACC = VERT, CLARET = ROUGE, DN = INK, DNT = ROUGE, GR = VERT, GRT = VERT, OR = OR2;
        function div(p, html, style, cls) { var d = document.createElement("div"); d.className = cls || "a"; d.innerHTML = html; d.setAttribute("style", style || ""); p.appendChild(d); return d; }
        function el(s, tag, a, text) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; s.appendChild(e); return e; }
        function svg(p, x, y, w, h) { var g = document.createElementNS(NS, "svg"); g.setAttribute("width", w); g.setAttribute("height", h); g.style.left = x + "px"; g.style.top = y + "px"; p.appendChild(g); return g; }
        function fade(n, t, d) { tl.fromTo(n, { opacity: 0 }, { opacity: 1, duration: d || .3, ease: "power1.out", immediateRender: false }, t); return n; }
        function rise(n, t, d) { tl.fromTo(n, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: d || .4, ease: "power3.out", immediateRender: false }, t); return n; }
        function sc(t0, t1) { var s = div(st, "", "", "scene"); tl.set(s, { opacity: 1 }, t0); tl.set(s, { opacity: 0 }, t1); return s; }
        function full(p, src, pos, dark) { div(p, "<img src='assets/img/" + src + "' style='width:1080px; height:1920px; object-fit:cover; object-position:" + (pos || "50% 50%") + "; display:block'>", "inset:0"); if (dark) div(p, "", "inset:0; background:" + dark); }
        function montage(list) { list.forEach(function (m) { var s = sc(m[1], m[2]); full(s, m[0], m[3] || "50% 40%", "linear-gradient(180deg, rgba(0,12,40,.1), rgba(0,12,40,.45))"); }); }
        function draw(p, t, d, ease) { var L = p.getTotalLength(); p.style.strokeDasharray = L + " " + L; p.style.strokeDashoffset = L; tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: d, ease: ease || "power1.inOut", immediateRender: false }, t); return p; }
        function fr(v, dec) { var s = v.toFixed(dec || 0).split("."); return s[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (s[1] ? "," + s[1] : ""); }
        var MO = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
        function at(R, d) { for (var i = 0; i < R.length; i++) if (R[i][0] >= d) return i; return R.length - 1; }

        // graphique éditorial (style presse financière) : filet en tête, titre, sous-titre, cours, une seule couleur d'accent, repères horizontaux fins
        function stock(s, o) {
          var R = o.R, L = R.length - 1, PX = 100, PY = 500, PW = 760, PH = 760, P = at(R, o.peak), lo = o.lo, hi = o.hi;
          var X = function (i) { return PX + i / (L + 6) * PW; }, Y = function (v) { return PY + PH - (v - lo) / (hi - lo) * PH; };
          if (o.logo) div(s, "<img src='" + o.logo + "' style='height:64px; display:block'>", "left:100px; top:300px");
          else div(s, o.name, "left:100px; top:290px; font-size:78px; font-weight:800; letter-spacing:-.04em; line-height:1");
          div(s, o.sub, "left:100px; top:390px; font-size:34px; font-weight:500; color:" + SOFT);
          // un seul chiffre, sur la ligne du nom, aligné à droite
          var tk = div(s, "", "right:100px; top:294px; font-size:78px; font-weight:700; letter-spacing:-.04em; line-height:1; white-space:nowrap; color:" + o.col);
          var g = svg(s, 0, 0, 1080, 1920), cid = "c" + Math.random().toString(36).slice(2), cp = el(el(g, "defs", {}), "clipPath", { id: cid });
          el(cp, "rect", { x: PX - 6, y: PY - 30, width: PW + 12, height: PH + 30 });
          var cam = el(el(g, "g", { "clip-path": "url(#" + cid + ")" }), "g", {});
          o.ticks.forEach(function (v) { var y = Y(v); el(g, "line", { x1: PX, x2: 980, y1: y, y2: y, stroke: RULE, "stroke-width": 1.5, class: "tk" });
            el(g, "text", { x: 980, y: y - 12, "font-size": 28, fill: SOFT, "font-weight": 600, "text-anchor": "end" }, fr(v) + (o.unit || "")); });
          el(g, "line", { x1: PX, x2: 980, y1: PY + PH, y2: PY + PH, stroke: INK, "stroke-width": 2.5 });
          var lx = -1e9; for (var i = 1; i <= L; i++) { if (R[i][0].slice(5, 7) === R[i - 1][0].slice(5, 7)) continue; var mo = +R[i][0].slice(5, 7); if (mo % 2) continue;
            if (X(i) - lx > 110 && X(i) > PX + 30) { lx = X(i); el(g, "line", { x1: X(i), x2: X(i), y1: PY + PH, y2: PY + PH + 12, stroke: INK, "stroke-width": 2, class: "tk" }); el(g, "text", { x: X(i), y: PY + PH + 50, "font-size": 28, fill: SOFT, "font-weight": 600, "text-anchor": "middle" }, MO[mo - 1]); } }
          function path(a, b, k) { var d = ""; for (var i = a; i <= b; i++) d += (d ? "L" : "M") + X(i).toFixed(1) + " " + Y(R[i][k || 1]).toFixed(1); return d; }
          var mainP = el(cam, "path", { d: path(0, L - 1), fill: "none", stroke: INK, "stroke-width": 7, "stroke-linejoin": "round" });
          // ce qu'on montre garde la couleur, le reste passe en gris
          tl.fromTo(mainP, { attr: { stroke: INK } }, { attr: { stroke: "#c5cad3" }, duration: .4, ease: "power1.inOut", immediateRender: false }, o.tUp - .1);
          var up = draw(el(cam, "path", { d: "M" + X(L - 1) + " " + Y(R[L - 1][1]) + "L" + X(L) + " " + Y(R[L][1]), fill: "none", stroke: ACC, "stroke-width": 9, "stroke-linecap": "round" }), o.tUp, .5, "power2.out");
          tl.set(up, { strokeDasharray: "none" }, o.tUp + .52);
          var dot = el(cam, "circle", { cx: X(L), cy: Y(R[L][1]), r: 14, fill: ACC, opacity: 0 }); fade(dot, o.tUp + .45, .1);
          var ob = { p: 0 }, pf = function (v) { return (v > 0 ? "+" : v < 0 ? "−" : "") + fr(Math.abs(v), 1) + " %"; };
          tk.textContent = pf(0); tk.style.opacity = 0; fade(tk, o.tUp, .15);
          tl.fromTo(ob, { p: 0 }, { p: o.pct, duration: .6, ease: "power2.out", immediateRender: false, onUpdate: function () { tk.textContent = pf(ob.p); } }, o.tUp);
          div(s, "Source : Yahoo Finance", "top:1330px; font-size:26px; font-weight:600", "src");
          // zoom : cadre les séances depuis i0 dans la zone du graphique ; les graduations de prix disparaissent (elles ne suivent pas)
          function zoom(i0, t, d, keys) { var xs = [], ys = []; for (var i = i0; i <= L; i++) { xs.push(X(i)); (keys || [1]).forEach(function (k) { ys.push(Y(R[i][k])); }); }
            var x0 = Math.min.apply(0, xs), x1 = Math.max.apply(0, xs), y0 = Math.min.apply(0, ys) - 50, y1 = Math.max.apply(0, ys) + 50;
            var ky = PH / (y1 - y0), kx = Math.min((PW - 140) / (x1 - x0), ky * 3), tx = PX + PW - 110 - X(L) * kx, ty = PY + (PH - (y1 - y0) * ky) / 2 - y0 * ky;
            cam.querySelectorAll("path, line").forEach(function (n) { n.setAttribute("vector-effect", "non-scaling-stroke"); });
            var z = { a: 1, b: 1, x: 0, y: 0 }; cam.setAttribute("transform", "translate(0,0) scale(1,1)");
            tl.fromTo(z, { a: 1, b: 1, x: 0, y: 0 }, { a: kx, b: ky, x: tx, y: ty, duration: d, ease: "power3.inOut", immediateRender: false, onUpdate: function () { cam.setAttribute("transform", "translate(" + z.x + "," + z.y + ") scale(" + z.a + "," + z.b + ")"); } }, t);
            tl.to(g.querySelectorAll(":scope > text, :scope > .tk"), { opacity: 0, duration: .2 }, t);
            // le point final reste rond : on le remplace par un point hors caméra
            tl.to(dot, { opacity: 0, duration: .1 }, t);
            var nd = el(g, "circle", { cx: X(L) * kx + tx, cy: Y(R[L][1]) * ky + ty, r: 14, fill: ACC, opacity: 0 }); fade(nd, t + d - .05, .15);
            return function (x, y) { return [x * kx + tx, y * ky + ty]; }; }
          return { g: g, cam: cam, X: X, Y: Y, L: L, path: path, PX: PX, PW: PW, zoom: zoom };
        }

        // ===== 1. « Le retour de Jensen Huang à la tête de Nvidia » : photo fixe =====
        // photo fixe, mise au point sur le visage : flou photographique autour, qui arrive en douceur
        (function () { var sh = sc(0, 1.45), img = "<img src='assets/img/jensen-hd.jpg' style='width:1080px; height:1920px; object-fit:cover; object-position:50% 15%; display:block'>";
          div(sh, img, "inset:0");
          var bl = div(sh, img, "inset:0; filter:blur(14px) brightness(.78); transform:scale(1.04); -webkit-mask-image:radial-gradient(ellipse 330px 430px at 510px 700px, transparent 55%, #000 100%); mask-image:radial-gradient(ellipse 330px 430px at 510px 700px, transparent 55%, #000 100%); opacity:0");
          tl.fromTo(bl, { opacity: 0 }, { opacity: 1, duration: .45, ease: "power1.out", immediateRender: false }, .05); })();
        montage([["jensen-scene.jpg", 1.45, 2.76, "50% 20%"]]);

        // ===== 2. « 11 jours après sa démission » : deux dates reliées par un trait fin =====
        (function () { var s = sc(2.76, 4.3), g = svg(s, 0, 0, 1080, 1920);
          draw(el(g, "line", { x1: 200, x2: 880, y1: 900, y2: 900, stroke: INK, "stroke-width": 3 }), 2.85, .9, "power2.inOut");
          [[200, "12 nov.", "Démission", 2.8, "#fff"], [880, "23 nov.", "Retour comme PDG", 3.6, INK]].forEach(function (e) {
            var c = el(g, "circle", { cx: e[0], cy: 900, r: 0, fill: e[4], stroke: INK, "stroke-width": 4 }); tl.fromTo(c, { attr: { r: 0 } }, { attr: { r: 14 }, duration: .25, ease: "power2.out", immediateRender: false }, e[3]);
            var a = div(s, "<span style='display:inline-block; transform:translateX(-50%)'>" + e[1] + "</span>", "left:" + e[0] + "px; top:800px; font-size:52px; font-weight:700; letter-spacing:-.035em; white-space:nowrap; opacity:0"); rise(a, e[3] + .05, .3);
            var b = div(s, "<span style='display:inline-block; transform:translateX(-50%)'>" + e[2] + "</span>", "left:" + e[0] + "px; top:940px; font-size:34px; font-weight:400; white-space:nowrap; color:" + SOFT + "; opacity:0"); rise(b, e[3] + .1, .3); });
          var n = div(s, "11 jours", "left:0; right:0; top:860px; text-align:center; font-size:30px; font-weight:500; color:" + SOFT + "; opacity:0"); fade(n, 3.3, .25); })();

        // ===== 3. « a fait exploser l'action de 31 % hier » : Nvidia =====
        (function () { var s = sc(4.3, 7.19);
          var c = stock(s, { R: window.NV, peak: "2026-10-06", lo: 100, hi: 260, ticks: [100, 150, 200, 250], unit: " $", dec: 2, name: "Nvidia", logo: "assets/img/nvidia-logo.svg", sub: "Cours de l'action, en dollars", pct: 31.5, col: VERT, tUp: 5.0, tBadge: 5.8,
            icon: "<circle cx='32' cy='32' r='32' fill='#76b900'/><text x='32' y='44' font-size='34' font-weight='800' fill='#fff' text-anchor='middle' font-family='Display'>N</text>",
            src: "Action Nvidia · Clôtures quotidiennes jusqu'au 23/11/2026 · Source : Yahoo Finance" });
          c.zoom(c.L - 9, 5.55, .9); })();

        // ===== 4. « et le S&P 500 a suivi. Mais il reste sous cette ligne… » : la ligne (non nommée) apparaît, on resserre =====
        (function () { var s = sc(7.19, 12.49), R = window.SPX;
          var c = stock(s, { R: R, peak: "2026-10-06", lo: 6200, hi: 8100, ticks: [6500, 7000, 7500, 8000], dec: 0, name: "S&P 500", sub: "Indice, en points", pct: 4.7, col: VERT, tUp: 7.3, tBadge: 7.9,
            icon: "<circle cx='32' cy='32' r='32' fill='#00194b'/><path d='M14 42 L26 30 L34 37 L50 20' fill='none' stroke='#fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/>",
            src: "Indice S&P 500 · Clôtures quotidiennes jusqu'au 23/11/2026 · Source : Yahoo Finance" });
          // la ligne : moyenne mobile à 200 jours, sans légende (elle n'est nommée qu'après le générique)
          var mid = "m" + Math.random().toString(36).slice(2), mr = el(el(c.g.querySelector("defs"), "clipPath", { id: mid }), "rect", { x: 0, y: 0, width: 0, height: 1920 });
          el(el(c.cam, "g", { "clip-path": "url(#" + mid + ")" }), "path", { d: c.path(0, c.L, 2), fill: "none", stroke: OR, "stroke-width": 6.5, "stroke-linecap": "round" });
          tl.fromTo(mr, { attr: { width: 0 } }, { attr: { width: 1080 }, duration: 1.0, ease: "power2.inOut", immediateRender: false }, 9.0);
          // « sous cette ligne » : on resserre sur les séances depuis le record, prix et ligne dans le cadre
          var T = c.zoom(at(R, "2026-10-01"), 10.15, 1.1, [1, 2]);
          var pL = T(c.X(c.L), c.Y(R[c.L][1])), mL = T(c.X(c.L), c.Y(R[c.L][2])), bx = pL[0] + 34;
          var br = el(c.g, "path", { d: "M" + (bx - 12) + " " + mL[1] + " H" + bx + " V" + pL[1] + " H" + (bx - 12), fill: "none", stroke: OR2, "stroke-width": 4, opacity: 0 }); fade(br, 11.2, .25);
          var gl = div(s, "<span style='display:block; font-size:52px; font-weight:700; letter-spacing:-.03em; color:" + ROUGE + "'>−1,5 %</span>", "left:" + (bx + 18) + "px; top:" + ((pL[1] + mL[1]) / 2 - 34) + "px; line-height:1.15; opacity:0"); fade(gl, 11.3, .25); })();

        // ===== 5. « car c'est un signal qui a précédé chaque grande crise » : photos fixes =====
        montage([["nyse.jpg", 12.49, 13.65], ["trader-panique.jpg", 13.65, 15.13, "50% 30%"]]);

        // ===== sous-titres : 3 mots max, masqués quand le même chiffre est à l'écran =====
        var W = window.VO.words.filter(function (w) { return w.s < END; }), groups = [], cur = [];
        W.forEach(function (t, k) { cur.push(t); if (/[,.?:!…]$/.test(t.w) || cur.length >= 3 || !W[k + 1]) { groups.push(cur); cur = []; } });
        var SKIP = [[5.7, 6.9]];
        groups.forEach(function (gp, k) {
          var t0 = gp[0].s, t1 = k + 1 < groups.length ? groups[k + 1][0].s : END;
          if (SKIP.some(function (r) { return t0 >= r[0] - .05 && t0 < r[1]; })) return;
          var d = div(top, "<span class='cap-box'>" + gp.map(function (t) { return t.w.replace(/^(31)$/, "$1 %"); }).join(" ") + "</span>", "", "cap-line");
          tl.fromTo(d, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .1, ease: "power2.out", immediateRender: false }, Math.max(0, t0 - .06));
          tl.set(d, { opacity: 0 }, Math.min(t1 - .07, gp[gp.length - 1].e + .6, END - .035));
        });

        tl.set({}, {}, END);
        window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; tl.seek(0);
      })();
    </script>
  </body>
</html>
