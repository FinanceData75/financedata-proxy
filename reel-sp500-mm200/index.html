<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/vo-words.js"></script>
    <script src="assets/data.js"></script>
    <style>
      /* Reel « Le guide de la culture financière, épisode 9 » : le S&P 500 sous sa moyenne mobile à 200 jours. Aperçu du hook (0 → 15,13 s). Fond clair, comme l'épisode 8. */
      @font-face { font-family: "Display"; src: url("assets/fonts/inter-display-latin-var.woff2"); font-weight: 100 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #f6f8fc; }
      #root { width: 1080px; height: 1920px; position: relative; overflow: hidden; font-family: "Display", sans-serif; color: #00194b; background: #f6f8fc; font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; }
      #bg { position: absolute; inset: 0; background: #f6f8fc; }
      #bg .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,25,75,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,25,75,.05) 1px, transparent 1px); background-size: 48px 48px; background-position: 12px 0;
        -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); }
      .a { position: absolute; }
      .scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
      svg { position: absolute; overflow: visible; }
      svg text { font-family: "Display"; font-feature-settings: "tnum" 1; }
      .src { position: absolute; left: 100px; right: 100px; font-size: 22px; font-weight: 600; color: #5b6b8a; }
      .cap-line { position: absolute; left: 100px; right: 100px; top: 1400px; text-align: center; opacity: 0; }
      .cap-box { display: inline-block; padding: 8px 22px 13px; border-radius: 4px; background: rgba(30,34,42,.78); font-weight: 700; font-size: 52px; line-height: 1.12; letter-spacing: -.05em; color: #fff; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.13" data-width="1080" data-height="1920">
      <audio id="vo" src="assets/voix.mp3" data-start="0" data-duration="15.13" data-track-index="1"></audio>
      <div id="bgs" class="clip" data-start="0" data-duration="15.13" data-track-index="2" style="position:absolute; inset:0"><div id="bg"><div class="grid"></div></div></div>
      <div id="stage" class="clip" data-start="0" data-duration="15.13" data-track-index="3" style="position:absolute; inset:0"></div>
      <div id="top" class="clip" data-start="0" data-duration="15.13" data-track-index="5" style="position:absolute; inset:0; pointer-events:none"></div>
    </div>
    <script>
      (function () {
        var NS = "http://www.w3.org/2000/svg", tl = gsap.timeline({ paused: true }), END = 15.13;
        var st = document.getElementById("stage"), top = document.getElementById("top");
        var INK = "#00194b", SOFT = "#5b6b8a", DN = "#ff1744", DNT = "#d50f35", GR = "#00b85c", GRT = "#00843f", OR = "#ff8a00";
        function div(p, html, style, cls) { var d = document.createElement("div"); d.className = cls || "a"; d.innerHTML = html; d.setAttribute("style", style || ""); p.appendChild(d); return d; }
        function el(s, tag, a, text) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; s.appendChild(e); return e; }
        function svg(p, x, y, w, h) { var g = document.createElementNS(NS, "svg"); g.setAttribute("width", w); g.setAttribute("height", h); g.style.left = x + "px"; g.style.top = y + "px"; p.appendChild(g); return g; }
        function fade(n, t, d) { tl.fromTo(n, { opacity: 0 }, { opacity: 1, duration: d || .3, ease: "power1.out", immediateRender: false }, t); return n; }
        function rise(n, t, d) { tl.fromTo(n, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: d || .4, ease: "power3.out", immediateRender: false }, t); return n; }
        function sc(t0, t1) { var s = div(st, "", "", "scene"); tl.set(s, { opacity: 1 }, t0); tl.set(s, { opacity: 0 }, t1); return s; }
        function full(p, src, pos, dark) { div(p, "<img src='assets/img/" + src + "' style='width:1080px; height:1920px; object-fit:cover; object-position:" + (pos || "50% 50%") + "; display:block'>", "inset:0"); if (dark) div(p, "", "inset:0; background:" + dark); }
        function montage(list) { list.forEach(function (m) { var s = sc(m[1], m[2]); full(s, m[0], m[3] || "50% 40%", "linear-gradient(180deg, rgba(0,12,40,.1), rgba(0,12,40,.45))"); }); }
        function draw(p, t, d, ease) { var L = p.getTotalLength(); p.style.strokeDasharray = L + " " + L; p.style.strokeDashoffset = L; tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: d, ease: ease || "power1.inOut", immediateRender: false }, t); return p; }
        function fr(v, dec) { var s = v.toFixed(dec || 0).split("."); return s[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (s[1] ? "," + s[1] : ""); }
        var MO = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
        function at(R, d) { for (var i = 0; i < R.length; i++) if (R[i][0] >= d) return i; return R.length - 1; }

        // graphique façon appli Bourse : en-tête (icône, nom, cours qui défile, badge), courbe noire puis chute rouge puis rebond vert
        function stock(s, o) {
          var R = o.R, L = R.length - 1, PX = 100, PY = 600, PW = 760, PH = 620, P = at(R, o.peak), lo = o.lo, hi = o.hi;
          var X = function (i) { return PX + i / (L + 6) * PW; }, Y = function (v) { return PY + PH - (v - lo) / (hi - lo) * PH; };
          div(s, "<svg width='48' height='48' viewBox='0 0 64 64' style='position:static; vertical-align:middle'>" + o.icon + "</svg><span style='vertical-align:middle; margin-left:14px; font-size:40px; font-weight:700; letter-spacing:-.04em'>" + o.name + "</span>", "left:100px; top:330px");
          var tk = div(s, "", "left:100px; top:400px; font-size:100px; font-weight:700; letter-spacing:-.055em; line-height:1; white-space:nowrap");
          var bd = div(s, o.badge, "right:100px; top:322px; padding:4px 16px 8px; border-radius:6px; background:rgba(0,184,92,.12); color:" + GRT + "; font-size:46px; font-weight:700; letter-spacing:-.04em; white-space:nowrap; opacity:0");
          div(s, "en une séance", "right:100px; top:392px; font-size:24px; font-weight:600; color:" + SOFT + "; opacity:0").className = "a lab";
          var g = svg(s, 0, 0, 1080, 1920), cam = el(g, "g", {});
          o.ticks.forEach(function (v) { var y = Y(v); el(cam, "line", { x1: PX, x2: PX + PW, y1: y, y2: y, stroke: INK, "stroke-opacity": .07, "stroke-width": 1.5 });
            el(g, "text", { x: 980, y: y + 8, "font-size": 24, fill: SOFT, "font-weight": 600, "text-anchor": "end" }, fr(v) + (o.unit || "")); });
          el(g, "line", { x1: PX, x2: PX + PW, y1: PY + PH, y2: PY + PH, stroke: SOFT, "stroke-opacity": .5, "stroke-width": 2 });
          var lx = -1e9; for (var i = 1; i <= L; i++) { if (R[i][0].slice(5, 7) === R[i - 1][0].slice(5, 7)) continue; var mo = +R[i][0].slice(5, 7); if (mo % 2) continue;
            if (X(i) - lx > 110 && X(i) > PX + 30) { lx = X(i); el(g, "text", { x: X(i), y: PY + PH + 46, "font-size": 24, fill: SOFT, "font-weight": 600, "text-anchor": "middle" }, MO[mo - 1]); } }
          function path(a, b, k) { var d = ""; for (var i = a; i <= b; i++) d += (d ? "L" : "M") + X(i).toFixed(1) + " " + Y(R[i][k || 1]).toFixed(1); return d; }
          el(cam, "path", { d: path(0, P), fill: "none", stroke: INK, "stroke-width": 4, "stroke-linejoin": "round" });
          el(cam, "path", { d: path(P, L - 1), fill: "none", stroke: DN, "stroke-width": 5, "stroke-linejoin": "round" });
          var up = draw(el(cam, "path", { d: "M" + X(L - 1) + " " + Y(R[L - 1][1]) + "L" + X(L) + " " + Y(R[L][1]), fill: "none", stroke: GR, "stroke-width": 7, "stroke-linecap": "round" }), o.tUp, .5, "power2.out");
          var dot = el(cam, "circle", { cx: X(L), cy: Y(R[L][1]), r: 11, fill: "#fff", stroke: GR, "stroke-width": 5, opacity: 0 }); fade(dot, o.tUp + .45, .1);
          var v0 = R[L - 1][1], v1 = R[L][1], ob = { p: 0 };
          tk.textContent = fr(v0, o.dec) + (o.unit || "");
          tl.fromTo(ob, { p: 0 }, { p: 1, duration: .5, ease: "power2.out", immediateRender: false, onUpdate: function () { tk.textContent = fr(v0 + (v1 - v0) * ob.p, o.dec) + (o.unit || ""); } }, o.tUp);
          tl.fromTo([bd, s.querySelector(".lab")], { opacity: 0, scale: .7, transformOrigin: "100% 50%" }, { opacity: 1, scale: 1, duration: .3, ease: "back.out(2.5)", immediateRender: false }, o.tBadge);
          div(s, o.src, "top:1300px", "src");
          return { g: g, cam: cam, X: X, Y: Y, L: L, path: path, PX: PX, PW: PW };
        }

        // ===== 1. « Le retour de Jensen Huang à la tête de Nvidia » : photo fixe =====
        montage([["jensen-hd.jpg", 0, 1.45, "50% 15%"], ["jensen-scene.jpg", 1.45, 2.76, "50% 20%"]]);

        // ===== 2. « 11 jours après sa démission » : deux dates reliées par un trait =====
        (function () { var s = sc(2.76, 4.3), g = svg(s, 0, 0, 1080, 1920);
          var l = draw(el(g, "line", { x1: 230, x2: 850, y1: 900, y2: 900, stroke: INK, "stroke-width": 5 }), 2.85, .9, "power2.inOut");
          [[230, "12 nov.", "Démission", DN, 2.8], [850, "23 nov.", "Retour", GR, 3.6]].forEach(function (e) {
            var c = el(g, "circle", { cx: e[0], cy: 900, r: 0, fill: e[3] }); tl.fromTo(c, { attr: { r: 0 } }, { attr: { r: 20 }, duration: .25, ease: "back.out(3)", immediateRender: false }, e[4]);
            var a = div(s, "<span style='display:inline-block; transform:translateX(-50%)'>" + e[1] + "</span>", "left:" + e[0] + "px; top:780px; font-size:56px; font-weight:700; letter-spacing:-.045em; white-space:nowrap; opacity:0"); rise(a, e[4] + .05, .3);
            var b = div(s, "<span style='display:inline-block; transform:translateX(-50%)'>" + e[2] + "</span>", "left:" + e[0] + "px; top:950px; font-size:40px; font-weight:700; letter-spacing:-.03em; white-space:nowrap; color:" + e[3] + "; opacity:0"); rise(b, e[4] + .1, .3); });
          var n = div(s, "11 jours", "left:0; right:0; top:1040px; text-align:center; font-size:44px; font-weight:700; letter-spacing:-.04em; color:" + SOFT + "; opacity:0"); fade(n, 3.3, .25); })();

        // ===== 3. « a fait exploser l'action de 31 % hier » : Nvidia =====
        (function () { var s = sc(4.3, 7.19);
          stock(s, { R: window.NV, peak: "2026-10-06", lo: 100, hi: 260, ticks: [100, 150, 200, 250], unit: " $", dec: 2, name: "Nvidia", badge: "+31 %", tUp: 5.0, tBadge: 5.8,
            icon: "<circle cx='32' cy='32' r='32' fill='#76b900'/><text x='32' y='44' font-size='34' font-weight='800' fill='#fff' text-anchor='middle' font-family='Display'>N</text>",
            src: "Action Nvidia · Clôtures quotidiennes jusqu'au 23/11/2026 · Source : Yahoo Finance" }); })();

        // ===== 4. « et le S&P 500 a suivi. Mais il reste sous cette ligne… » : la ligne (non nommée) apparaît, on resserre =====
        (function () { var s = sc(7.19, 12.49), R = window.SPX;
          var c = stock(s, { R: R, peak: "2026-10-06", lo: 6200, hi: 8100, ticks: [6500, 7000, 7500, 8000], dec: 0, name: "S&P 500", badge: "+4,7 %", tUp: 7.3, tBadge: 7.9,
            icon: "<circle cx='32' cy='32' r='32' fill='#00194b'/><path d='M14 42 L26 30 L34 37 L50 20' fill='none' stroke='#fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/>",
            src: "Indice S&P 500 · Clôtures quotidiennes jusqu'au 23/11/2026 · Source : Yahoo Finance" });
          // la ligne : moyenne mobile à 200 jours, sans légende (elle n'est nommée qu'après le générique)
          var ma = draw(el(c.cam, "path", { d: c.path(0, c.L, 2), fill: "none", stroke: OR, "stroke-width": 6, "stroke-dasharray": "0", "stroke-linecap": "round" }), 9.0, .9, "power2.inOut");
          // pointillés une fois tracée
          tl.set(ma, { strokeDasharray: "16 12", strokeDashoffset: 0 }, 9.92);
          // « sous cette ligne » : on resserre sur les dernières séances, l'écart prix / ligne apparaît
          var xL = c.X(c.L), yL = c.Y(R[c.L][1]);
          tl.to(c.cam, { attr: { transform: "translate(" + (540 - xL * 2.4) + "," + (900 - yL * 2.4) + ") scale(2.4)" }, duration: 1.0, ease: "power2.inOut" }, 10.1);
          var gap = el(c.g, "line", { x1: 540, x2: 540, y1: 900, y2: 900 + (c.Y(R[c.L][2]) - yL) * 2.4, stroke: DN, "stroke-width": 4, opacity: 0 }); fade(gap, 11.15, .2);
          var gl = div(s, "<span style='display:inline-block; transform:translate(0,-50%); padding:2px 14px 6px; border-radius:6px; background:rgba(255,23,68,.1); color:" + DNT + "; font-size:44px; font-weight:700; letter-spacing:-.04em'>−1,5 % sous la ligne</span>", "left:570px; top:" + (900 + (c.Y(R[c.L][2]) - yL) * 1.2) + "px; opacity:0"); fade(gl, 11.25, .25);
          tl.to(s.querySelectorAll(".a:not(.src)"), { opacity: .15, duration: .3 }, 10.1);
          tl.to(c.g.querySelectorAll(":scope > text"), { opacity: 0, duration: .25 }, 10.1); })();

        // ===== 5. « car c'est un signal qui a précédé chaque grande crise » : photos fixes =====
        montage([["nyse.jpg", 12.49, 13.65], ["trader-panique.jpg", 13.65, 15.13, "50% 30%"]]);

        // ===== sous-titres : 3 mots max, masqués quand le même chiffre est à l'écran =====
        var W = window.VO.words.filter(function (w) { return w.s < END; }), groups = [], cur = [];
        W.forEach(function (t, k) { cur.push(t); if (/[,.?:!…]$/.test(t.w) || cur.length >= 3 || !W[k + 1]) { groups.push(cur); cur = []; } });
        var SKIP = [[5.7, 6.9]];
        groups.forEach(function (gp, k) {
          var t0 = gp[0].s, t1 = k + 1 < groups.length ? groups[k + 1][0].s : END;
          if (SKIP.some(function (r) { return t0 >= r[0] - .05 && t0 < r[1]; })) return;
          var d = div(top, "<span class='cap-box'>" + gp.map(function (t) { return t.w.replace(/^(31)$/, "$1 %"); }).join(" ") + "</span>", "", "cap-line");
          tl.fromTo(d, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: .1, ease: "power2.out", immediateRender: false }, Math.max(0, t0 - .06));
          tl.set(d, { opacity: 0 }, Math.min(t1 - .07, gp[gp.length - 1].e + .6, END - .035));
        });

        tl.set({}, {}, END);
        window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; tl.seek(0);
      })();
    </script>
  </body>
</html>
