<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/vo-words.js"></script>
    <script src="assets/reel-data.js"></script>
    <style>
      @font-face { font-family: "Inter UI"; src: url("assets/fonts/Inter-Regular.otf") format("opentype"); font-weight: 400; }
      @font-face { font-family: "Inter UI"; src: url("assets/fonts/Inter-Medium.otf") format("opentype"); font-weight: 500; }
      @font-face { font-family: "Inter UI"; src: url("assets/fonts/Inter-SemiBold.otf") format("opentype"); font-weight: 600; }

      /* DA FinanceData : bleu #00194B quadrillé, alterné avec un blanc cassé quadrillé et des photos plein cadre */
      :root { --bg: #00194b; --ink: #eaf1fb; --soft: #8fa3c7; --hair: rgba(255, 255, 255, 0.12); --cyan: #7dd0f5; --red: #ff2e24; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { width: 100%; height: 100%; position: relative; font-family: "Inter UI", sans-serif; color: var(--ink); background: var(--bg); font-feature-settings: "tnum" 1; }
      #stage { position: absolute; inset: 0; overflow: hidden; }

      .layer { position: absolute; inset: 0; opacity: 0; }
      #bg-dark { opacity: 1; }
      #bg-dark .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 38% at 50% 46%, #0b3480 0%, rgba(0, 25, 75, 0) 72%); }
      #bg-dark .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px); background-size: 48px 48px; background-position: 12px 0;
        -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); }
      #bg-dark .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 65% at 50% 46%, rgba(0, 0, 0, 0) 55%, rgba(0, 5, 22, 0.6) 100%); }
      #bg-light { background: #f6f8fc; }
      #bg-light::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 25, 75, 0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 25, 75, 0.06) 1px, transparent 1px); background-size: 48px 48px; background-position: 12px 0;
        -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); }
      #bg-light::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 65% at 50% 46%, rgba(255, 255, 255, 0) 55%, rgba(0, 25, 75, 0.08) 100%); }
      .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 10, 30, 0.45) 0%, rgba(0, 10, 30, 0) 20%, rgba(0, 10, 30, 0) 50%, rgba(0, 20, 60, 0.85) 100%); }
      #ph-sam2 img { filter: grayscale(1) brightness(0.8); }

      /* scènes : bloc centré dans la safe zone (x 140–940, y 440–1290) */
      .scene { position: absolute; left: 140px; top: 440px; width: 800px; height: 850px; opacity: 0; text-align: center; color: var(--ink); }
      .scene.light { --ink: #00194b; --soft: #5b6b8a; --hair: rgba(0, 25, 75, 0.14); --cyan: #0b6fd0; }
      .kicker { font-size: 22px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--cyan); }
      .title { margin-top: 14px; font-size: 60px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.04; white-space: nowrap; }
      .sub { margin-top: 12px; font-size: 26px; color: var(--soft); }
      .big + .sub { margin-top: 36px; }
      .big { font-weight: 600; letter-spacing: -0.05em; line-height: 1; white-space: nowrap; }
      .scene svg.chart { position: absolute; left: 0; top: 190px; width: 800px; height: 600px; overflow: visible; }
      .source { position: absolute; left: 0; right: 0; top: 800px; font-size: 17px; color: var(--soft); }
      svg text { font-family: "Inter UI", sans-serif; font-feature-settings: "tnum" 1; }
      svg .val { font-weight: 600; fill: var(--ink); letter-spacing: -0.02em; }
      svg .lbl { fill: var(--soft); }
      svg .cap { font-weight: 500; fill: var(--soft); letter-spacing: 0.14em; }
      svg .grid { stroke: var(--hair); stroke-width: 1.5; fill: none; }
      svg .axis { stroke: var(--soft); stroke-width: 2; fill: none; opacity: 0.6; }

      /* formes à angles droits, peu de texte */
      #heat { position: absolute; left: 0; top: 560px; width: 1080px; overflow: hidden; box-shadow: 0 30px 70px rgba(0, 5, 25, 0.6); opacity: 0; }
      #heat img { display: block; width: 100%; }
      .badge { position: absolute; padding: 12px 28px 16px; background: var(--red); color: #fff; font-weight: 600; letter-spacing: -0.04em; white-space: nowrap; opacity: 0; }
      .big { font-size: 210px; }
      /* fin : logo + bouton */
      #end { position: absolute; left: 140px; top: 470px; width: 800px; height: 820px; opacity: 0; text-align: center; }
      #avatar { position: absolute; left: 220px; top: -10px; width: 360px; height: 360px; }
      #avatar svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #avatar .pic { position: absolute; left: 22px; top: 22px; width: 316px; height: 316px; border-radius: 50%; overflow: hidden; border: 8px solid #00194b; box-shadow: 0 20px 50px rgba(0, 5, 25, 0.5); opacity: 0; }
      #avatar .pic img { width: 100%; height: 100%; display: block; }
      #wordmark { position: absolute; left: 0; right: 0; top: 380px; font-size: 72px; font-weight: 600; letter-spacing: -0.04em; color: #fff; opacity: 0; }
      #tagline { position: absolute; left: 0; right: 0; top: 478px; font-size: 28px; color: var(--soft); opacity: 0; }
      #btn { position: absolute; left: 50%; top: 510px; width: 400px; height: 100px; margin-left: -200px; border-radius: 8px; background: #0095f6; color: #fff; font-size: 40px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: center; justify-content: center; gap: 14px; opacity: 0; box-shadow: 0 18px 40px rgba(0, 60, 140, 0.4); }
      #btn .t2 { display: none; }
      #btn svg { width: 38px; height: 38px; display: none; }

      /* sous-titres : blanc, fond gris translucide, lettres resserrées */
      #captions { position: absolute; left: 140px; right: 140px; top: 1330px; height: 130px; }
      .cap-line { position: absolute; left: -60px; right: -60px; top: 0; text-align: center; opacity: 0; }
      .cap-box { display: inline-block; padding: 8px 22px 13px; border-radius: 4px; background: rgba(30, 34, 42, 0.74);
        font-family: "Inter UI", sans-serif; font-weight: 600; font-size: 54px; line-height: 1.12; letter-spacing: -0.045em; word-spacing: -0.02em; color: #fff; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30.7" data-width="1080" data-height="1920">
      <audio id="vo" src="assets/voiceover.mp3" data-start="0" data-duration="30.7" data-track-index="1"></audio>
      <div id="stage" class="clip" data-start="0" data-duration="30.7" data-track-index="0">
        <div class="layer" id="bg-dark"><div class="glow"></div><div class="grid"></div><div class="vig"></div></div>
        <div class="layer" id="bg-light"></div>
        <div class="layer photo" id="ph-sam" style="opacity:1"><img src="assets/img/sam-altman.jpg" alt="" /></div>
        <div class="layer photo" id="ph-openai"><img src="assets/img/openai.jpg" alt="" /></div>
        <div class="layer photo" id="ph-sam2"><img src="assets/img/sam-altman.jpg" alt="" /></div>
        <div class="layer photo" id="ph-dario"><img src="assets/img/dario-amodei.jpg" alt="" /></div>

        <!-- hook : Sam Altman + capture du marché -->
        <div id="sc-hook" class="layer">
          <div id="heat"><img src="assets/img/heatmap.png" alt="" /></div>
          <div class="badge" id="b500" style="left:540px;top:440px;font-size:100px;transform:translateX(-50%)">−500 Md$</div>
        </div>
        <!-- 50 au lieu de 70 -->
        <div class="scene light" id="sc-gap">
          <div class="title">Moins que prévu</div>
          <svg class="chart" id="ch-gap" viewBox="0 0 800 600"></svg>
        </div>
        <!-- l'IA chute -->
        <div class="scene" id="sc-crash">
          <div class="title">L'IA chute</div>
          <svg class="chart" id="ch-crash" viewBox="0 0 800 600"></svg>
        </div>
        <!-- IPO 2027 → 1 400 Md$ -->
        <div class="scene light" id="sc-ipo">
          <div style="position:absolute;left:0;right:0;top:150px" id="g-ipo"><div class="kicker">Introduction en Bourse</div><div class="big" id="v-ipo" style="margin-top:40px">2027</div></div>
          <div style="position:absolute;left:0;right:0;top:150px;opacity:0" id="g-val"><div class="kicker">Valorisation visée</div><div class="big" id="v-val" style="margin-top:60px;font-size:160px">1 400 Md$</div></div>
        </div>
        <!-- Anthropic passe devant -->
        <div class="scene" id="sc-anthrev">
          <div class="title">Anthropic passe devant</div>
          <svg class="chart" id="ch-cmp" viewBox="0 0 800 600"></svg>
        </div>
        <!-- fin : profil Instagram + bouton -->
        <div id="end">
          <div id="avatar"><svg viewBox="0 0 360 360"><defs><linearGradient id="gStory" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75" /><stop offset="0.3" stop-color="#fa7e1e" /><stop offset="0.6" stop-color="#d62976" /><stop offset="1" stop-color="#962fbf" /></linearGradient></defs>
            <circle id="ring" cx="180" cy="180" r="170" fill="none" stroke="url(#gStory)" stroke-width="12" transform="rotate(-90 180 180)" /></svg>
            <div class="pic"><img src="assets/img/logo-financedata.png" alt="" /></div></div>
          <div id="wordmark">FinanceData</div>
          <div id="btn"><svg viewBox="0 0 40 40"><path d="M9 21 L17 29 L32 12" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></svg><span class="t1">S'abonner</span><span class="t2">Abonné</span></div>
        </div>

        <div id="captions"></div>
      </div>
    </div>

    <script>
      (function () {
        var NS = "http://www.w3.org/2000/svg";
        var RED = "#ff2e24", NAVY = "#00194b", CYAN = "#7dd0f5";
        var R = window.REEL;
        var tl = gsap.timeline({ paused: true });
        var SFX = []; // [nom, instant, gain] → mixés après le rendu par scripts/sfx.mjs

        function el(parent, tag, attrs, text) {
          var n = document.createElementNS(NS, tag);
          for (var k in attrs) n.setAttribute(k, attrs[k]);
          if (text != null) n.textContent = text;
          parent.appendChild(n);
          return n;
        }
        function $(id) { return document.getElementById(id); }
        function drawIn(node, at, dur, ease) {
          var len = node.getTotalLength();
          node.style.strokeDasharray = len + " " + len;
          tl.fromTo(node, { opacity: 0 }, { opacity: 1, duration: 0.01 }, at);
          tl.fromTo(node, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.inOut" }, at);
        }
        function fadeIn(node, at, dur, y) { tl.fromTo(node, { opacity: 0, y: y == null ? 16 : y }, { opacity: 1, y: 0, duration: dur || 0.6, ease: "power2.out" }, at); }
        function growX(node, at, dur) { tl.fromTo(node, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: dur || 1, ease: "power2.out" }, at); }
        function growY(node, at, dur) { tl.fromTo(node, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: dur || 1, ease: "power2.out" }, at); }
        function fmt(v, dec) { return v.toFixed(dec).replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
        function counter(node, at, to, dur, pre, suf) {
          var o = { v: 0 };
          tl.fromTo(o, { v: 0 }, { v: to, duration: dur, ease: "power2.out", immediateRender: false, onUpdate: function () { node.textContent = (pre || "") + fmt(o.v, 0) + (suf || ""); } }, at);
          SFX.push(["swell", at, 0.12]);
        }
        function sc(id) { return R.scenes.filter(function (s) { return s.id === id; })[0]; }
        function wordAt(id, key, nth) {
          var hits = [];
          sc(id).chunks.forEach(function (c) { c.words.forEach(function (w) { if (w.key === key) hits.push(w); }); });
          if (!hits.length) throw new Error("mot introuvable : " + key);
          return hits[nth || 0].start;
        }
        // une scène = un fond (photo plein cadre, bleu ou blanc) + au plus un élément animé
        var LAYER = { hook: "ph-sam", decu: "ph-openai", gap: "bg-light", crash: "bg-dark", timing: "ph-sam2", ipo: "bg-light",
          anthropic: "ph-dario", anthrev: "bg-dark", cta: "bg-dark", sub: "bg-dark" };
        R.scenes.forEach(function (s, i) {
          var prev = i ? LAYER[R.scenes[i - 1].id] : null, cur = LAYER[s.id];
          if (i && prev !== cur) {
            if (cur !== "bg-dark") tl.fromTo("#" + cur, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.inOut" }, s.start - 0.2);
            if (prev !== "bg-dark") tl.to("#" + prev, { opacity: 0, duration: 0.35, ease: "power1.inOut" }, s.start - 0.1);
            SFX.push(["whoosh", s.start - 0.25, 0.2]);
          }
          var node = $("sc-" + s.id);
          if (!node) return;
          tl.fromTo(node, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, Math.max(0, s.start - 0.05));
          tl.to(node, { opacity: 0, duration: 0.25 }, s.end - 0.25);
        });

        // ---------- hook : la capture apparaît, puis le montant ----------
        (function () {
          var t5 = wordAt("hook", "500");
          tl.fromTo("#heat", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.1);
          SFX.push(["swipe", 0.05, 0.45]);
          tl.fromTo("#b500", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t5 - 0.15);
          var b = $("b500"), o = { v: 0 };
          tl.fromTo(o, { v: 0 }, { v: 500, duration: 0.7, ease: "power2.out", onUpdate: function () { b.textContent = "−" + fmt(o.v, 0) + " Md$"; } }, t5 - 0.15);
          SFX.push(["impact", t5 - 0.15, 0.45]);
        })();

        // ---------- 50 au lieu de 70 ----------
        (function () {
          var s = sc("gap"), svg = $("ch-gap"), base = 540, k = 6.4;
          el(svg, "line", { x1: 60, x2: 740, y1: base, y2: base, class: "axis" });
          var t5 = wordAt("gap", "50") - 0.2, t7 = wordAt("gap", "70") - 0.2, tG = wordAt("gap", "attendus");
          var bP = el(svg, "rect", { x: 450, y: base - 50 * k, width: 220, height: 50 * k, fill: RED });
          var vP = el(svg, "text", { x: 560, y: base - 50 * k + 84, "font-size": 64, "font-weight": 600, fill: "#fff", "text-anchor": "middle" }, "50");
          var bA = el(svg, "rect", { x: 130, y: base - 70 * k, width: 220, height: 70 * k, fill: "none", stroke: NAVY, "stroke-width": 3, "stroke-dasharray": "12 9" });
          var vA = el(svg, "text", { x: 240, y: base - 70 * k - 26, class: "val", "font-size": 64, "text-anchor": "middle" }, "70");
          growY(bP, t5, 1.0); fadeIn(vP, t5 + 0.5, 0.5, 0);
          growY(bA, t7, 1.0); fadeIn(vA, t7 + 0.5, 0.5, 0);
          var tag = el(svg, "g", {});
          el(tag, "rect", { x: 450, y: base - 70 * k - 6, width: 220, height: 20 * k + 6, fill: "rgba(255,46,36,0.12)", stroke: RED, "stroke-width": 2, "stroke-dasharray": "6 6" });
          el(tag, "text", { x: 560, y: base - 60 * k + 14, "font-size": 40, "font-weight": 600, fill: RED, "text-anchor": "middle" }, "−20");
          fadeIn(tag, tG, 0.6, 0);
          SFX.push(["pop", tG, 0.35]);
        })();

        // ---------- l'IA chute : trois valeurs ----------
        (function () {
          var s = sc("crash"), svg = $("ch-crash");
          [["Nvidia", 2.94], ["AMD", 3.9], ["Arm", 6.48]].forEach(function (r, i) {
            var y = 70 + i * 160, t = s.start + 0.15 + i * 0.3, w = r[1] * 72;
            var lab = el(svg, "text", { x: 60, y: y, class: "cap", "font-size": 26 }, r[0].toUpperCase());
            var bar = el(svg, "rect", { x: 60, y: y + 22, width: w, height: 64, fill: RED });
            var v = el(svg, "text", { x: 60 + w + 22, y: y + 70, "font-size": 48, "font-weight": 600, fill: RED }, "−" + fmt(r[1], 1) + " %");
            fadeIn(lab, t, 0.5, 0); growX(bar, t, 0.9); fadeIn(v, t + 0.5, 0.5, 0);
          });
        })();

        // ---------- IPO 2027 puis 1 400 Md$ ----------
        (function () {
          var tV = wordAt("ipo", "valorisation") - 0.15;
          tl.fromTo("#v-ipo", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, wordAt("ipo", "2027") - 0.2);
          tl.to("#g-ipo", { opacity: 0, duration: 0.3 }, tV - 0.3);
          tl.fromTo("#g-val", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, tV);
          counter($("v-val"), tV, 1400, 1.4, "", " Md$");
        })();

        // ---------- Anthropic passe devant ----------
        (function () {
          var s = sc("anthrev"), svg = $("ch-cmp"), k = 7.6, t65 = wordAt("anthrev", "65") - 0.2;
          [["OpenAI", 50, "rgba(234,241,251,0.5)", s.start + 0.15, 300], ["Anthropic", 65, CYAN, t65, 110]].forEach(function (r, i) {
            var y = r[4], lab = el(svg, "text", { x: 60, y: y, class: "cap", "font-size": 26 }, r[0].toUpperCase());
            var bar = el(svg, "rect", { x: 60, y: y + 22, width: r[1] * k, height: 76, fill: r[2] });
            var v = el(svg, "text", { x: 60 + r[1] * k + 22, y: y + 76, class: "val", "font-size": 48 }, i ? "0 Md$" : "50 Md$");
            fadeIn(lab, r[3], 0.5, 0); growX(bar, r[3], 1.1); fadeIn(v, r[3] + 0.3, 0.5, 0);
            if (i) counter(v, r[3], 65, 1.1, "> ", " Md$");
          });
        })();

        // ---------- fin : profil Instagram, bouton S'abonner → Abonné ----------
        (function () {
          var c = sc("cta"), s = sc("sub");
          tl.fromTo("#end", { opacity: 0 }, { opacity: 1, duration: 0.4 }, c.start);
          tl.fromTo("#avatar .pic", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, c.start + 0.05);
          drawIn($("ring"), c.start + 0.4, 1.2, "power2.inOut");
          SFX.push(["swipe", c.start + 0.05, 0.25]);
          fadeIn($("wordmark"), c.start + 0.8, 0.6);
          var tB = s.start - 0.05, tC = s.start + 1.1;
          tl.fromTo("#btn", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, tB);
          tl.to("#btn", { scale: 0.94, duration: 0.1, ease: "power1.in" }, tC);
          tl.to("#btn", { scale: 1, duration: 0.3, ease: "back.out(2)" }, tC + 0.1);
          tl.to("#btn", { backgroundColor: "#363a45", boxShadow: "0 18px 40px rgba(0,0,0,0.35)", duration: 0.3 }, tC + 0.05);
          tl.set("#btn .t1", { display: "none" }, tC + 0.1);
          tl.set("#btn .t2", { display: "inline" }, tC + 0.1);
          tl.set("#btn svg", { display: "block" }, tC + 0.1);
          drawIn(document.querySelector("#btn svg path"), tC + 0.12, 0.35);
          SFX.push(["click", tC - 0.02, 0.6], ["chime", tC + 0.12, 0.35]);
        })();

        // ---------- sous-titres (3 mots max, blancs, fond gris translucide) ----------
        (function () {
          var box = $("captions");
          R.chunks.forEach(function (c) {
            var div = document.createElement("div");
            div.className = "cap-line";
            var inner = document.createElement("div");
            inner.className = "cap-box";
            inner.textContent = c.words.map(function (w) { return w.text; }).join(" ");
            div.appendChild(inner);
            box.appendChild(div);
            tl.fromTo(div, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.1, ease: "power2.out" }, c.start - 0.06);
            tl.to(div, { opacity: 0, duration: 0.01 }, c.end - 0.035);
          });
        })();

        window.__SFX = SFX.map(function (c) { return { name: c[0], t: +c[1].toFixed(3), gain: c[2] }; });
        tl.set({}, {}, R.total);
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
