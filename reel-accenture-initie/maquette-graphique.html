<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Maquette graphique boursier</title>
<script src="assets/acn.js"></script>
<style>
  /* Maquette du nouveau graphique boursier « The Economist version FinanceData » (scène du 26 octobre).
     Zone de tracé à part de la gouttière des valeurs : la courbe ne touche jamais les chiffres de l'axe.
     Valeurs posées au-dessus des lignes de grille à droite, mois en bas avec petites graduations, ligne du bas en marine.
     Une seule couleur (bleu FinanceData) pour l'annotation clé ; le reste en marine et gris. Annotations courtes, avec filet de rappel. */
  @font-face { font-family: "Display"; src: url("assets/fonts/inter-display-latin-var.woff2"); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; background: #eef1f5; color: #0a105e; font-family: "Display"; font-variation-settings: "opsz" 32; -webkit-font-smoothing: antialiased; position: relative; overflow: hidden; }
  #st { position: absolute; inset: 0; transform: scale(.82); transform-origin: 540px 880px; }
  .a { position: absolute; }
  svg { position: absolute; overflow: visible; }
  svg text { font-family: "Display"; font-variation-settings: "opsz" 32; font-feature-settings: "tnum" 1; }
  .card { position: absolute; background: #fff; border-radius: 4px; box-shadow: 0 18px 50px rgba(0,11,34,.14); }
</style>
</head>
<body>
<div id="st"></div>
<script>
  var NS = "http://www.w3.org/2000/svg", st = document.getElementById("st");
  var NAVY = "#0a105e", BLUE = "#3d5afe", GRID = "#d5dae5", AX = "#6b7290", PURPLE = "#a100ff";
  function div(html, style) { var d = document.createElement("div"); d.className = "a"; d.innerHTML = html; d.setAttribute("style", style); st.appendChild(d); return d; }
  function el(s, tag, a, text) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; s.appendChild(e); return e; }
  function fr(v, d) { return v.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }).replace(/[  ]/g, " "); }

  // titre : logo + nom de l'entreprise, puis ce que montre le graphique
  div("<svg width='58' height='58' viewBox='0 0 24 24' style='position:static; display:block'><path d='m.66 16.95 13.242-4.926L.66 6.852V0l22.68 9.132v5.682L.66 24Z' fill='" + PURPLE + "'/></svg><span>Cours de l'action</span>",
      "left:96px; top:286px; display:flex; align-items:center; gap:22px; font-weight:700; font-size:72px; letter-spacing:-.055em; line-height:1");

  // repère : zone de tracé (x 0 → PW) séparée de la gouttière des valeurs (PW → W)
  var S = window.ACN.filter(function (r) { return r[0] >= "2026-06-01" && r[0] <= "2026-10-28"; }), n = S.length;
  var W = 888, PW = 760, H = 470, TOP = 440, g = document.createElementNS(NS, "svg");
  g.setAttribute("width", W); g.setAttribute("height", H + 90); g.style.left = "96px"; g.style.top = TOP + "px"; st.appendChild(g);
  var X = function (i) { return i / (n - 1) * PW; }, Y = function (v) { return H - (v - 75) / 215 * H; };
  [100, 150, 200, 250].forEach(function (v) {
    el(g, "line", { x1: 0, x2: W, y1: Y(v), y2: Y(v), stroke: GRID, "stroke-width": 2 });
    el(g, "text", { x: W, y: Y(v) - 12, "font-size": 30, fill: AX, "font-weight": 500, "text-anchor": "end" }, v + " $");
  });
  el(g, "line", { x1: 0, x2: W, y1: H, y2: H, stroke: NAVY, "stroke-width": 3 });
  // mois en bas
  ["2026-06-01", "2026-07-01", "2026-08-03", "2026-09-01", "2026-10-01"].forEach(function (dt, k) {
    var i = S.findIndex(function (r) { return r[0] >= dt; }), x = X(i);
    el(g, "line", { x1: x, x2: x, y1: H, y2: H + 14, stroke: NAVY, "stroke-width": 3 });
    el(g, "text", { x: x + 8, y: H + 50, "font-size": 30, fill: AX, "font-weight": 500 }, ["juin", "juil.", "août", "sept.", "oct."][k]);
  });

  // la courbe, en marine
  var d = S.map(function (r, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(r[1]).toFixed(1); }).join(" ");
  el(g, "path", { d: d, fill: "none", stroke: NAVY, "stroke-width": 5, "stroke-linejoin": "round", "stroke-linecap": "round" });

  // annotation 1 (grise) : le plus bas
  var iL = 0; S.forEach(function (r, i) { if (r[1] < S[iL][1]) iL = i; });
  var xl = X(iL), yl = Y(S[iL][1]);
  el(g, "circle", { cx: xl, cy: yl, r: 9, fill: "#eef1f5", stroke: NAVY, "stroke-width": 4 });
  el(g, "text", { x: xl + 22, y: yl + 46, "font-size": 30, fill: NAVY, "font-weight": 700 }, "Plus bas : " + fr(S[iL][1], 0) + " $");

  // annotation 2 (bleue, la seule couleur) : l'achat de la PDG, et le ×2 depuis le plus bas
  var iB = S.findIndex(function (r) { return r[0] >= "2026-10-26"; }), xb = X(iB), yb = Y(S[iB][1]);
  el(g, "line", { x1: xb, x2: xb, y1: yb, y2: H, stroke: BLUE, "stroke-width": 2, "stroke-dasharray": "6 6" });
  el(g, "circle", { cx: xb, cy: yb, r: 13, fill: BLUE, stroke: "#eef1f5", "stroke-width": 4 });
  el(g, "text", { x: xb - 30, y: Y(274), "font-size": 32, fill: BLUE, "font-weight": 700, "text-anchor": "end" }, "Achat de la PDG · ×2 depuis juin");
  el(g, "text", { x: xb, y: H + 50, "font-size": 30, fill: BLUE, "font-weight": 700, "text-anchor": "middle" }, "26");

  // cartes : qui a acheté
  div("<div style='position:absolute; left:36px; top:30px; font-size:44px; font-weight:700; letter-spacing:-.05em'>Julie Sweet</div><div style='position:absolute; left:36px; top:84px; font-size:28px; font-weight:600; color:#6b7290'>PDG</div><div style='position:absolute; left:34px; top:128px; font-size:64px; font-weight:700; letter-spacing:-.055em; color:" + BLUE + "; font-feature-settings:\"tnum\" 1'>12 200</div><div style='position:absolute; left:36px; top:200px; font-size:28px; font-weight:600; color:#6b7290'>actions achetées</div>", "left:96px; top:1040px; width:430px; height:250px");
  st.lastChild.className = "card";
  div("<div style='position:absolute; left:36px; top:30px; font-size:44px; font-weight:700; letter-spacing:-.05em'>Paula Price</div><div style='position:absolute; left:36px; top:84px; font-size:28px; font-weight:600; color:#6b7290'>administratrice</div><div style='position:absolute; left:34px; top:128px; font-size:64px; font-weight:700; letter-spacing:-.055em'>Achète</div><div style='position:absolute; left:36px; top:200px; font-size:28px; font-weight:600; color:#6b7290'>le même jour</div>", "left:554px; top:1040px; width:430px; height:250px");
  st.lastChild.className = "card";

  div("Cours de clôture, 2026 · Sources : Yahoo Finance, SEC (Form 4)", "left:96px; top:1320px; font-size:28px; font-weight:500; color:#6b7290; letter-spacing:-.02em");
  div("<span style='font-weight:700; font-size:66px; letter-spacing:-.055em; color:#0a105e'>achète plus de</span>", "left:0; right:0; top:1420px; text-align:center");
</script>
</body>
</html>
