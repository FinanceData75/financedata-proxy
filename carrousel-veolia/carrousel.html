<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Carrousel Veolia, 10 000 € investis</title>
<script src="assets/ve.js"></script>
<style>
  /* Carrousel Instagram (2 pages, 1080 × 1350) : 10 000 € investis dans Veolia le 23/11/2012, dividendes réinvestis.
     Page 1 = couverture photo + titre League Spartan blanc. Page 2 = graphique éditorial (fond blanc, grand titre, un seul chiffre à droite, grille légère, source).
     ?p=1 ou ?p=2 (capture : node slides/capture.cjs). */
  @font-face { font-family: "League Spartan"; src: url("assets/fonts/league-spartan-latin-wght-normal.woff2"); font-weight: 100 900; }
  @font-face { font-family: "Display"; src: url("assets/fonts/inter-display-latin-var.woff2"); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #fff; color: #0b1f44; font-family: "Display"; -webkit-font-smoothing: antialiased; position: relative; font-feature-settings: "tnum" 1; }
  .pg { position: absolute; inset: 0; display: none; background: #fff; }
  .a { position: absolute; }
  svg { position: absolute; overflow: visible; }
  svg text { font-family: "Display"; font-feature-settings: "tnum" 1; }
</style>
</head>
<body>

<!-- 1. Couverture -->
<section class="pg" id="p1" style="background:#000">
  <img src="assets/photos/veolia-enseigne.jpg" style="position:absolute; inset:0; width:1080px; height:1350px; object-fit:cover; object-position:50% 35%">
  <div style="position:absolute; left:0; right:0; bottom:0; height:760px; background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.7) 45%, rgba(0,0,0,.92) 100%)"></div>
  <div style="position:absolute; left:80px; right:80px; top:800px; text-align:center; font-family:'League Spartan'; font-weight:700; font-size:80px; line-height:1.03; letter-spacing:-.01em; color:#fff">10 000 € investis dans Veolia il y a 14 ans valent aujourd'hui 78 900 €</div>
  <img src="assets/img/fd-fleche-blanche.png" style="position:absolute; left:495px; top:1215px; width:90px; height:90px">
</section>

<!-- 2. L'évolution (style des carrousels FinanceData publiés : fond sombre bleuté, courbe rouge, annotations fléchées) -->
<section class="pg" id="p2" style="background:radial-gradient(ellipse 90% 70% at 85% 95%, #0d3a8c 0%, rgba(13,58,140,0) 70%), linear-gradient(165deg, #000000 0%, #03070f 45%, #071a44 100%)">
  <div class="a" style="left:60px; right:60px; top:96px; text-align:center; font-family:'League Spartan'; font-weight:700; font-size:72px; line-height:1.08; letter-spacing:-.005em; color:#fff">Évolution de 10 000€ investis dans l'action Veolia en 2012</div>
  <div class="a" style="left:0; right:0; top:268px; text-align:center; font-size:22px; font-style:italic; color:#8a93a6">Source : Yahoo Finance, dividendes réinvestis, données depuis novembre 2012</div>
  <div id="ch"></div>
  <img src="assets/img/fd-fleche-blanche.png" style="position:absolute; left:500px; top:1258px; width:80px; height:80px">
</section>

<script>
  var NS = "http://www.w3.org/2000/svg", INK = "#0b1f44", SOFT = "#6b7280", VERT = "#10b981", OR2 = "#e0a526";
  function el(s, tag, a, text) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; s.appendChild(e); return e; }
  function fr(v) { return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
  (function () {
    var R = window.VE, n = R.length, L = n - 1, PX = 150, PY = 350, PW = 860, PH = 760, lo = 0, hi = 100000, RED = "#ff2a1f", AX = "#8a93a6";
    var X = function (i) { return PX + i / L * PW; }, Y = function (v) { return PY + PH - (v - lo) / (hi - lo) * PH; };
    var g = document.createElementNS(NS, "svg"); g.setAttribute("width", 1080); g.setAttribute("height", 1350); g.style.left = 0; g.style.top = 0; document.getElementById("ch").appendChild(g);
    el(g, "text", { x: PX - 20, y: PY - 34, "font-size": 22, fill: "#fff", "font-weight": 700, "text-anchor": "end" }, "€");
    [0, 20000, 40000, 60000, 80000, 100000].forEach(function (v) { el(g, "line", { x1: PX, x2: PX + PW, y1: Y(v), y2: Y(v), stroke: "#ffffff", "stroke-opacity": .08, "stroke-width": 1.2 }); el(g, "text", { x: PX - 20, y: Y(v) + 9, "font-size": 26, fill: AX, "font-weight": 500, "text-anchor": "end" }, String(v)); });
    var M = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
    R.forEach(function (r, i) { if ((i && r[0].slice(0, 4) !== R[i - 1][0].slice(0, 4) && r[0].slice(0, 4) !== "2013") || i === 0) { var j = i === 0 ? 0 : i; var x = X(j), t = el(g, "text", { x: x, y: PY + PH + 40, "font-size": 22, fill: AX, "font-weight": 500, "text-anchor": "end", transform: "rotate(-45 " + x + " " + (PY + PH + 40) + ")" }, (i === 0 ? "nov." : "janv.") + " " + r[0].slice(2, 4)); } });
    var d = R.map(function (r, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(r[1]).toFixed(1); }).join("");
    el(g, "path", { d: d, fill: "none", stroke: RED, "stroke-width": 4.5, "stroke-linejoin": "round" });
    // annotations : valeur en gras, date en italique, flèche courbe
    var defs = el(g, "defs", {}), mk = el(defs, "marker", { id: "ah", viewBox: "0 0 10 10", refX: 8, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
    el(mk, "path", { d: "M0 0 L10 5 L0 10", fill: "none", stroke: "#fff", "stroke-width": 1.6 });
    function note(date, val, when, tx, ty, cx, cy) { var i = 0; R.forEach(function (r, k) { if (r[0] === date) i = k; }); var px = X(i), py = Y(R[i][1]);
      el(g, "text", { x: tx, y: ty, "font-size": 40, fill: "#fff", "font-weight": 700, "text-anchor": "middle" }, val);
      el(g, "text", { x: tx, y: ty + 40, "font-size": 32, fill: "#fff", "font-weight": 400, "font-style": "italic", "text-anchor": "middle" }, when);
      el(g, "path", { d: "M" + cx[0] + " " + cx[1] + " Q" + cy[0] + " " + cy[1] + " " + (px + cy[2]) + " " + (py + cy[3]), fill: "none", stroke: "#fff", "stroke-width": 2, "marker-end": "url(#ah)" }); }
    note("2016-11-03", "26 957€", "en novembre 2016", 400, 1000, [330, 950], [290, 900, -2, 18]);
    note("2026-07-15", "86 545€", "en juillet 2026", 690, 360, [800, 345], [920, 330, -6, -6]);
    note("2026-11-24", "78 887€", "en novembre 2026", 880, 960, [960, 905], [1000, 800, 0, 12]);
  })();
  var p = +(new URLSearchParams(location.search).get("p") || 1); document.getElementById("p" + p).style.display = "block";
</script>
</body>
</html>
