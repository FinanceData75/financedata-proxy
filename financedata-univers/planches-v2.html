<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Univers FinanceData · minimal</title>
<script src="assets/spx-rsi.js"></script>
<style>
  @font-face { font-family: "Inter UI"; src: url("assets/fonts/Inter-Regular.otf"); font-weight: 400; }
  @font-face { font-family: "Inter UI"; src: url("assets/fonts/Inter-Medium.otf"); font-weight: 500; }
  @font-face { font-family: "Inter UI"; src: url("assets/fonts/Inter-SemiBold.otf"); font-weight: 600; }
  :root { --navy: #00194b; --white: #f6f8fc; --ink: #00194b; --soft: #8a94a8; --red: #ff2e24; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #222; display: flex; gap: 40px; padding: 40px; }
  .frame { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Inter UI", sans-serif; }
  .white { background: var(--white); }
  .white::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(0,25,75,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,25,75,.05) 1px, transparent 1px); background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); }
  .navy { background: radial-gradient(ellipse 60% 38% at 50% 46%, #0b3480 0%, #00194b 72%); }
  .navy::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 48px 48px;
    -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%); }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,10,30,.55) 100%); }
  .credit { position: absolute; right: 28px; bottom: 260px; z-index: 2; font-size: 18px; color: rgba(255,255,255,.6); }
  .cap { position: absolute; left: 0; right: 0; top: 1330px; text-align: center; z-index: 3; }
  .cap span { display: inline-block; padding: 8px 22px 13px; border-radius: 4px; background: rgba(30,34,42,.74); font-weight: 600; font-size: 54px; letter-spacing: -.045em; color: #fff; }
  svg { position: absolute; overflow: visible; }
  .lbl { position: absolute; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: 500; letter-spacing: .02em; color: var(--soft); }
</style>
</head>
<body>

<!-- 1. Une vraie photo, plein écran, rien d'autre que les sous-titres -->
<div class="frame photo" id="g1">
  <img src="../reel-vix/assets/img/warren-buffett.jpg" alt="" />
  <div class="credit">Photo : Mark Hirschey (CC BY-SA)</div>
  <div class="cap"><span>que Warren Buffett</span></div>
</div>

<!-- 2. Un vrai graphique, une seule information -->
<div class="frame white" id="g2">
  <div class="lbl" style="top:560px">RSI du S&amp;P 500</div>
  <svg id="c2" width="840" height="420" style="left:120px; top:700px"></svg>
  <div class="cap"><span>il repasse sous 30.</span></div>
</div>

<!-- 3. Un seul chiffre -->
<div class="frame navy" id="g3">
  <div style="position:absolute; left:0; right:0; top:700px; text-align:center; font-weight:600; font-size:360px; letter-spacing:-.06em; color:#fff; line-height:1">+22<span style="font-size:200px"> %</span></div>
  <div class="lbl" style="top:1100px; color:#8fa3c7">S&amp;P 500, depuis le 30 mars</div>
  <div class="cap"><span>Vous connaissez la suite.</span></div>
</div>

<!-- 4. Une vraie capture, petite, carrée, sur fond blanc -->
<div class="frame white" id="g4">
  <img src="../reel-cds/assets/img/cds-3-mois.png" style="position:absolute; left:170px; top:640px; width:740px; box-shadow:0 24px 50px rgba(0,25,75,.16)" />
  <div class="cap"><span>Le prix du risque</span></div>
</div>

<script>
  var NS = "http://www.w3.org/2000/svg";
  function el(p, t, a, txt) { var n = document.createElementNS(NS, t); for (var k in a) n.setAttribute(k, a[k]); if (txt != null) n.textContent = txt; p.appendChild(n); return n; }
  (function () {
    var svg = document.getElementById("c2"), D = window.SPXRSI;
    var t0 = Date.parse(D[0][0]), t1 = Date.parse(D[D.length - 1][0]);
    var X = function (d) { return (Date.parse(d) - t0) / (t1 - t0) * 840; };
    var Y = function (v) { return 420 - (v - 15) / (85 - 15) * 420; };
    el(svg, "line", { x1: 0, x2: 840, y1: Y(30), y2: Y(30), stroke: "#8a94a8", "stroke-width": 2, "stroke-dasharray": "10 10" });
    el(svg, "text", { x: 856, y: Y(30) + 9, "font-family": "Inter UI", "font-size": 26, fill: "#8a94a8" }, "30");
    el(svg, "path", { d: D.map(function (r, i) { return (i ? "L" : "M") + X(r[0]).toFixed(1) + " " + Y(r[2]).toFixed(1); }).join(" "), fill: "none", stroke: "#00194b", "stroke-width": 4, "stroke-linejoin": "round" });
    var x = X("2026-03-30"), y = Y(27.7);
    el(svg, "circle", { cx: x, cy: y, r: 13, fill: "#ff2e24" });
    el(svg, "text", { x: x, y: y + 64, "font-family": "Inter UI", "font-weight": 600, "font-size": 44, fill: "#ff2e24", "text-anchor": "middle" }, "27,7");
  })();
</script>
</body>
</html>
